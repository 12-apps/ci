name: Monorepo Tests

# Reusable HEAVY tier of the org's fail-fast monorepo CI (pnpm + turborepo).
# Pairs with monorepo-static.yml: the consumer gates this call on the static
# tier's success and `code` output, so a lint/type failure skips every job
# here (fail-fast), and a push event runs the FULL suite (no --affected, no
# bail) as the post-merge safety net.
#
# What it standardizes (originally proven in future-pay, FUT-213):
#   - unit tests with cross-run turbo cache, vitest results-cache persistence
#     (failed-first / slowest-first ordering across runs — vitest's sequencer
#     reads <pkg>/node_modules/.vite/vitest, which CI otherwise starts cold),
#     and affected-vs-full command selection by event
#   - build with turbo --affected + cross-run cache
#   - opt-in integration lane with its own results cache
#
# Caller responsibilities: same as monorepo-static.yml (concurrency, both
# triggers, per-package turbo outputs). Gate the call like:
#   tests:
#     needs: [static]
#     if: needs.static.outputs.code == 'true'
#     uses: 12-apps/ci/.github/workflows/monorepo-tests.yml@v1

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: >-
          npm token for consumers whose installs resolve RESTRICTED packages
          (e.g. a private @12-apps package). Optional and backward-compatible:
          absent, NODE_AUTH_TOKEN resolves empty and installs stay anonymous,
          exactly as before. Takes effect only when the consumer's committed
          .npmrc reads ${NODE_AUTH_TOKEN}.
        required: false
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      pre-test-command:
        description: >-
          Shell run before the unit-test command (e.g. generate the Prisma
          client). Empty to skip.
        type: string
        required: false
        default: ''
      unit-test-command:
        description: >-
          Command for the PR (incremental) unit run. The workflow fetches the
          base branch tip first (available as FETCH_HEAD) so file-level
          selectors can diff against it. The default is package-level turbo
          selection with fail-fast bail; consumers with a file-level selector
          override it (e.g. future-pay's
          `CI_AFFECTED_BASE=FETCH_HEAD node scripts/ci-affected-tests.mjs`).
        type: string
        required: false
        default: 'pnpm turbo run test --affected -- --bail=1'
      unit-full-command:
        description: >-
          Command for the push (full-suite safety net) unit run — no selection,
          no bail: a complete failure inventory of what actually landed.
        type: string
        required: false
        default: 'pnpm turbo run test'
      unit-fingerprint-command:
        description: >-
          OPT-IN. A command printing a stable hash (to stdout, alone) of
          everything the unit lane's verdict depends on — typically the tree
          minus docs and other paths that cannot change a test outcome. Consumers
          with a file-level selector already own that ignore rule; point this at
          the same one (future-pay:
          `node scripts/ci-test-fingerprint.mjs`). Empty (default) disables the
          whole mechanism, so existing callers are unaffected.

          When set, a PR run that PASSES records its fingerprint, and a later PR
          run whose fingerprint matches skips this lane outright — install,
          pre-test setup and the suite alike — reporting the recorded verdict
          instead of recomputing it.

          The point is the PR that grows a commit at a time. Selection is
          cumulative by design (it diffs against the PR's merge base, not the
          previous push, because only the LATEST run gates the merge button), so
          a third commit touching nothing testable still re-runs the first two
          commits' suites. This recognises the repeat.

          Three properties make the skip safe rather than merely fast, and a
          consumer's hash command has to preserve the first:

            * It is a hash of the TREE, not of a diff. On `pull_request` the
              checkout is the MERGE commit, so the base branch's tip is already
              inside it: if `main` advances with anything the hash counts, the
              fingerprint moves and the lane runs. A "did this push change
              anything?" check cannot see that, and would skip a suite the base
              branch had just broken.
            * Only a PASSING run records one. A failed run stores nothing, and
              neither does a cancelled one — which matters more than it sounds,
              because the recommended caller sets `cancel-in-progress: true` for
              PRs, so two quick pushes routinely cancel the first run. "Nothing
              changed since the last push" would happily skip on the strength of
              a run that tested nothing.
            * The lane's own commands are in the KEY, not the hash. The hash
              covers the repo; `node-version`, `pre-test-command` and
              `unit-test-command` are folded in beside it, so changing HOW the
              suite runs invalidates every stored verdict even though those
              values live in a workflow file the hash ignores.

          Never active on `push`: the post-merge safety net exists to skip
          nothing.
        type: string
        required: false
        default: ''
      vitest-cache-paths:
        description: >-
          Newline-separated paths of the packages' vitest results caches
          (<pkg>/node_modules/.vite/vitest). When set, they are persisted
          across runs — restored before the tests (this ref first, then the
          default branch) and saved after EVEN ON FAILURE, which is what makes
          vitest's failed-first ordering work in CI. Empty (default) skips the
          cache steps.
        type: string
        required: false
        default: ''
      default-branch:
        description: >-
          Default branch name, used only for the vitest cache restore fallback
          (the push safety net on this branch runs the full suite, so its
          cache carries data for every test file and PRs may restore it).
        type: string
        required: false
        default: 'main'
      stack-aware:
        description: >-
          On a STACKED pull request, select against the STACK's base rather than
          this pull request's immediate base. Off by default.

          Mid-stack, a pull request's base is the branch BELOW it, so every
          selector in this tier sees one layer only and skips whatever the lower
          layers touched — the tier goes green having tested less. Three things
          are redirected, and they are not independent:

            * `turbo --affected` in the unit and build lanes, via
              TURBO_SCM_BASE.
            * the base branch fetched by the unit lane, so FETCH_HEAD points at
              the stack base. That one also fixes CONSUMER selectors: a caller
              passing `unit-test-command: CI_AFFECTED_BASE=FETCH_HEAD ...` gets
              the corrected base with no change on its side.
            * the build lane's base, which has no fetch of its own and would
              otherwise have no local commit to diff against.

          Off by default because GitHub ships stacked pull requests as a PUBLIC
          PREVIEW "subject to change", and this repo hands workflows to
          consumers on a moving major tag. No effect off a stack.
        type: boolean
        required: false
        default: false
      run-build:
        description: 'Run the turbo build lane.'
        type: boolean
        required: false
        default: true
      pre-build-command:
        description: 'Shell run before the build (e.g. Prisma generate). Empty to skip.'
        type: string
        required: false
        default: ''
      run-integration:
        description: >-
          Run the integration lane. Consumers typically compute this from
          their own paths filter (only when the integration-relevant surface
          changed) and force it on push.
        type: boolean
        required: false
        default: false
      integration-command:
        description: 'Command for the PR integration run (fail-fast bail by default).'
        type: string
        required: false
        default: 'pnpm run test:integration -- --bail=1'
      integration-full-command:
        description: 'Command for the push (safety net) integration run — no bail.'
        type: string
        required: false
        default: 'pnpm run test:integration'
      pre-integration-command:
        description: >-
          Shell run before the integration command (e.g. generate the Prisma
          client or build shared packages). Empty to skip.
        type: string
        required: false
        default: ''
      integration-cache-path:
        description: >-
          Vitest results-cache path for the integration config (often the ROOT
          node_modules/.vite/vitest when the integration config's project root
          is the repo root). Empty skips the cache steps.
        type: string
        required: false
        default: ''
      pglite-template-migrations:
        description: >-
          hashFiles() pattern covering the committed migrations behind the
          consumer's PGlite schema template (the migrated data directory its
          integration setup builds once per run and copies per suite). When
          set, every integration shard restores/saves
          node_modules/.cache/pglite-template, so the template build happens
          once per cache key instead of once per job. Empty (default) skips
          the cache entirely. Safe by construction: the template directory is
          content-addressed, so a stale restore just makes the setup build the
          missing fingerprint — see actions/pglite-template-cache.
        type: string
        required: false
        default: ''
      unit-junit-reports:
        description: >-
          OPT-IN. Space-separated JUnit XML paths (files or directories) the unit
          lane writes. When set, a PR run asserts the lane executed at least one
          test case and fails if it did not.

          The mode it closes: affected selection is paired with
          `--passWithNoTests`, which is correct per-invocation — a changed file
          with no importing test legitimately runs nothing — but at the JOB level
          it is indistinguishable from "the selector resolved nothing at all". A
          stale impact map, an unresolvable diff base or a mis-classified path
          all land on exit 0, every check green, and no test signal whatsoever.
          More machinery between "PR opened" and "tests chosen" means more ways
          to select nothing, not fewer; the selectors already fail SAFE, and this
          is the assertion that the fail-safe actually held.

          The consumer's `unit-test-command` must emit the reports
          (`--reporter=junit --outputFile.junit=<path>`); a workflow cannot
          inject reporter flags into an opaque command string. Directories are
          scanned recursively and summed, so a lane running vitest per workspace
          package can point at one folder.

          Empty (default) disables the mechanism — existing callers are
          unaffected.
        type: string
        required: false
        default: ''
      integration-junit-reports:
        description: >-
          OPT-IN. As `unit-junit-reports`, for the integration lane.

          Currently mutually exclusive with `integration-shards > 1`, and the
          workflow enforces that rather than leaving it to the caller: a shard
          sees only its own slice, and an empty slice is ordinary arithmetic
          when a narrow selection is split across runners. That exclusion is an
          artifact of this workflow having no merge step — guarding a MERGED
          report (`vitest --merge-reports` in a job after the matrix) makes the
          two fully compatible, because no slice is ever inspected. Read it as
          scaffolding, not as a property of the guard.
        type: string
        required: false
        default: ''
      allow-zero-tests-label:
        description: >-
          PR label that skips the zero-test guards. For a genuinely test-free PR
          (workflow YAML, docs, a regenerated baseline) the guard is correct to
          fire and wrong to block, so the bypass is a deliberate, visible act on
          the PR rather than a silent condition.

          Deliberately NOT named `ci:full-tests`. A sibling repo already uses
          that label to WIDEN selection to the full suite, and reusing it here —
          where it only disarms a guard and changes selection not at all — sets
          up the one confusion that fails unsafely: someone applies it expecting
          broader coverage and gets narrower coverage plus a disabled gate. The
          default says what it actually permits.

          Applies ONLY to the guards: it does not widen selection or force a full
          suite, so it costs no extra CI time.
        type: string
        required: false
        default: 'ci:allow-zero-tests'
      integration-shards:
        description: >-
          Fan the integration lane out over this many runners. 1 (default) keeps
          the single-job shape every existing caller has today.

          Scale OUT, not up. An integration suite that provisions a database per
          test file saturates one runner from inside a single job — its worker
          pool is capped by RAM, not by cores — so the way to spend less
          wall-clock is more machines, not a bigger `--maxWorkers`.

          Each leg appends `--shard=<index>/<total>` to the integration command,
          which vitest applies to the file set AFTER the caller's own selection.
          That composes with an affected-only selector: the shard splits
          whatever the selector chose. It relies on the caller's command
          forwarding extra CLI args through to vitest (future-pay's
          `ci-integration-affected.mjs` does; the default command does too, via
          `pnpm run test:integration -- …`).

          Sizing is the caller's call, and more is not better: every leg pays
          the full checkout + install + pre-integration setup, so shards past
          the point where setup dominates buy nothing. Measure before raising
          it.
        type: number
        required: false
        default: 1

# Authenticate npm installs for consumers with RESTRICTED packages. Workflow-
# level so every `pnpm install` in this file sees it; the consumer's .npmrc is
# what turns the variable into a registry credential (see the NPM_TOKEN secret
# declaration above). Empty when the secret is not passed — anonymous installs,
# the pre-existing behavior.
env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  # pnpm 10+ stopped expanding env vars in credentials that come from a
  # PROJECT .npmrc (a committed file could redirect the expanded secret to an
  # attacker-controlled registry), so a consumer's ${NODE_AUTH_TOKEN} line is
  # silently ignored there and a restricted install 404s. Re-reading the same
  # file as the USER config restores the expansion: user-level credentials
  # stay trusted, and the trust is declared here, outside the repository.
  # (pnpm 11's PNPM_CONFIG_NPMRC_AUTH_FILE does not exist in pnpm 10 —
  # verified against 10.34.5.) Identical behavior for pnpm 9 consumers, and
  # a no-op for repos with no .npmrc: a missing userconfig file reads empty.
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history for turbo --affected merge-base detection.
        with:
          fetch-depth: 0

      # ── Has this exact tree already passed? (opt-in, see the input) ────────
      # Deliberately the FIRST thing after the checkout, ahead of pnpm, Node and
      # the install: skipping the suite while still paying ~90s to prepare for it
      # would give back a fraction of what the repeat costs. The consumer's
      # command is dependency-free by contract and runs on the runner's system
      # Node, which is what detect-changes.yml already does before its own
      # setup-node.
      - name: Fingerprint the test-relevant tree
        id: fingerprint
        # PR-only. The push run is the post-merge safety net; it skips nothing,
        # by definition, and must never consult a recorded verdict.
        if: ${{ inputs.unit-fingerprint-command != '' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          FP_CMD: ${{ inputs.unit-fingerprint-command }}
          # Folded into the KEY rather than the hash. These decide what the lane
          # RUNS and they live in a workflow file, which a sane "can this change
          # a test outcome?" rule ignores — so without them, editing
          # unit-test-command would inherit the previous command's verdict.
          LANE_NODE: ${{ inputs.node-version }}
          LANE_PRE: ${{ inputs.pre-test-command }}
          LANE_UNIT: ${{ inputs.unit-test-command }}
        run: |
          set -o pipefail
          # NOT `set -e`: every failure here must fall through to an empty
          # fingerprint, which disables the lookup and runs the tests. The whole
          # mechanism is an optimisation, and an optimisation that cannot answer
          # must answer "run it".
          fp="$(bash -c "$FP_CMD")" || fp=""
          fp="$(printf '%s' "$fp" | tr -d '[:space:]')"
          if ! printf '%s' "$fp" | grep -Eq '^[0-9a-f]{32,128}$'; then
            echo "::warning::unit-fingerprint-command produced no usable hash — running the lane."
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          lane="$(printf '%s\0%s\0%s\0%s' \
            "$LANE_NODE" "$LANE_PRE" "$LANE_UNIT" "$FP_CMD" \
            | sha256sum | cut -c1-16)"
          echo "value=${lane}-${fp}" >> "$GITHUB_OUTPUT"
          echo "unit verdict key: ${lane}-${fp}"

      # `lookup-only` — the entry's EXISTENCE is the whole message, so nothing is
      # downloaded. No `restore-keys`: a prefix match would answer for a
      # DIFFERENT tree, which is the one mistake this must not make.
      - name: Look up a recorded verdict for this tree
        id: verdict
        if: ${{ steps.fingerprint.outputs.value != '' }}
        uses: actions/cache/restore@v4
        with:
          path: .unit-verdict
          key: unit-verdict-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

      - name: Report the reused verdict
        if: ${{ steps.verdict.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "This tree is byte-identical, in every path that can affect a test,"
          echo "to one an earlier PASSING run of this lane already covered."
          echo "Nothing to recompute — change any counted file and the lane runs again."
          {
            echo "### Unit Tests — reused an earlier verdict"
            echo
            echo "No counted file differs from a tree this lane has already passed on,"
            echo "so the suite was not re-run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        if: ${{ steps.verdict.outputs.cache-hit != 'true' }}
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: ${{ steps.verdict.outputs.cache-hit != 'true' }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ steps.verdict.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Command inputs are routed through env (not interpolated into the
      # script) so shell metacharacters in a computed value can never be
      # template-expanded into the run block (Actions hardening guidance).
      # Same pattern for every command input in this workflow.
      - name: Pre-test setup
        if: ${{ inputs.pre-test-command != '' && steps.verdict.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-test-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-test.log

      - name: Restore turbo cache
        if: ${{ steps.verdict.outputs.cache-hit != 'true' }}
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-unit-${{ github.sha }}
          restore-keys: |
            turbo-unit-

      # ── Test prioritization (failed-first / slowest-first) ────────────────
      # Restored AFTER pnpm install so install can't clobber the .vite dirs.
      # Restore preference: this ref's latest save (the fix-verify loop within
      # a PR), else the default branch's (its push safety-net runs cover every
      # test file, and base-branch caches are restorable from PRs).
      - name: Restore vitest results cache (test prioritization)
        if: ${{ inputs.vitest-cache-paths != '' && steps.verdict.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.vitest-cache-paths }}
          key: vitest-results-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vitest-results-${{ github.ref }}-
            vitest-results-refs/heads/${{ inputs.default-branch }}-

      # Make FETCH_HEAD — and with it every three-dot diff and turbo's
      # --affected range — actually resolvable. This used to be a
      # `git fetch --depth=1` inside the step below, which GRAFTS the
      # `fetch-depth: 0` checkout above into a shallow repository and destroys
      # the merge base it already had; see the action for the measurements.
      #
      # Mid-stack, GITHUB_BASE_REF is the branch BELOW this pull request, so
      # the STACK's base is fetched instead — that fixes both consumers at
      # once (FETCH_HEAD, which commands diff against via e.g.
      # `CI_AFFECTED_BASE=FETCH_HEAD`, and turbo's own base) with no change to
      # the caller's command.
      - name: Fetch the base for affected selection
        id: base
        if: ${{ github.event_name == 'pull_request' && steps.verdict.outputs.cache-hit != 'true' }}
        uses: 12-apps/ci/.github/actions/fetch-base@v1
        with:
          base-ref: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.ref || '' }}
          fallback-branch: ${{ inputs.default-branch }}

      - name: Run unit tests
        id: unit
        if: ${{ steps.verdict.outputs.cache-hit != 'true' }}
        shell: bash
        # PR: incremental command against the fetched base tip (FETCH_HEAD).
        # Push: the full suite — a diff against the branch's own tip would be
        # empty and wrongly select nothing.
        env:
          UNIT_CMD: ${{ inputs.unit-test-command }}
          UNIT_FULL_CMD: ${{ inputs.unit-full-command }}
          # Empty unless the caller opted in AND this pull request is in a stack.
          STACK_BASE_SHA: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.sha || '' }}
          # The base tip the step above actually fetched. Empty only when the
          # histories are unrelated, which must widen to a full run rather than
          # narrow on a bogus empty diff.
          BASE_SHA: ${{ steps.base.outputs.base-sha }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Pin turbo's --affected base to a SHA that exists locally. Left to
            # itself turbo resolves GITHUB_BASE_REF by NAME, and a pull request
            # checkout has no local `main` branch — it printed "Failed to
            # resolve base ref 'main'" followed by "assuming all files have
            # changed" and ran every package, green, for a three-file diff.
            # A stacked pull request pins the stack's base for the same reason
            # the ref above is fetched: GITHUB_BASE_REF is only the layer below.
            # TURBO_SCM_HEAD is pinned alongside it because turbo honours the
            # pair, not TURBO_SCM_BASE alone.
            if [ -n "$STACK_BASE_SHA" ]; then
              export TURBO_SCM_BASE="$STACK_BASE_SHA" TURBO_SCM_HEAD=HEAD
              echo "Stacked pull request — selecting against $STACK_BASE_SHA"
            elif [ -n "$BASE_SHA" ]; then
              export TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD=HEAD
            fi
            bash -c "$UNIT_CMD" 2>&1 | tee unit.log
          else
            bash -c "$UNIT_FULL_CMD" 2>&1 | tee unit.log
          fi

      # ── Zero-test-signal guard ─────────────────────────────────────────────
      # PR-only: on push the FULL command runs, so a zero total means something
      # else is already broken and the lane's own failure is the better signal.
      #
      # Deliberately NOT gated on the test step's outcome. A lane that FAILED
      # already reports red; a lane that PASSED having run nothing is the entire
      # point of this step. Gated only on event, opt-in, and the label — and
      # carrying no `continue-on-error`, because a guard that cannot fail is
      # decoration.
      - name: Verify the unit lane executed at least one test
        if: >-
          ${{ github.event_name == 'pull_request'
              && inputs.unit-junit-reports != ''
              && !contains(github.event.pull_request.labels.*.name, inputs.allow-zero-tests-label) }}
        uses: 12-apps/ci/.github/actions/vitest-signal-guard@v1
        with:
          reports: ${{ inputs.unit-junit-reports }}
          lane: unit
          bypass-label: ${{ inputs.allow-zero-tests-label }}

      # Save even when tests FAIL — the failure entries are what makes the next
      # run's ordering useful (actions/cache's built-in post step skips saving
      # on job failure, hence the explicit restore/save split). run_id and
      # run_attempt keep every save key unique (cache entries are immutable).
      - name: Save vitest results cache
        if: ${{ always() && inputs.vitest-cache-paths != '' && steps.unit.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.vitest-cache-paths }}
          key: vitest-results-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ── Record the verdict, and ONLY a passing one ─────────────────────────
      # `steps.unit.outcome == 'success'` is the entire safety argument, so it is
      # asserted directly on the step that ran the tests rather than inferred
      # from the job. A failed run leaves no record. Neither does a CANCELLED
      # one, which is the case that actually bites: the recommended caller sets
      # `cancel-in-progress: true` for PRs, so pushing twice in a minute kills
      # the first run mid-suite — and a mechanism keyed on "did anything change
      # since that push?" would cheerfully skip on its behalf.
      #
      # A hit skips `Run unit tests`, leaving its outcome 'skipped', so a reused
      # verdict never re-records itself and the key is written exactly once.
      - name: Record this tree as passing
        id: record
        if: ${{ steps.unit.outcome == 'success' && steps.fingerprint.outputs.value != '' }}
        shell: bash
        # Through env rather than interpolated into the run block, per the
        # convention stated on `Pre-test setup` above — this value is validated
        # hex, but the rule is what keeps that from having to be re-checked.
        env:
          VERDICT_KEY: unit-verdict-${{ steps.fingerprint.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p .unit-verdict
          # Content is diagnostic only — the KEY carries the meaning, and
          # `lookup-only` means no reader ever downloads this.
          {
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "key=$VERDICT_KEY"
          } > .unit-verdict/passed

      - name: Save the recorded verdict
        if: ${{ steps.record.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .unit-verdict
          key: unit-verdict-${{ steps.fingerprint.outputs.value }}

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ inputs.run-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history for turbo --affected merge-base detection.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      - name: Pre-build setup
        if: ${{ inputs.pre-build-command != '' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-build-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-build.log

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: |
            turbo-build-

      # This lane used to fetch a base only for a STACKED pull request and let
      # every other one rely on turbo deriving the base from GITHUB_BASE_REF.
      # Turbo resolves that by NAME, and a pull request checkout has no local
      # `main` branch, so the ordinary case printed "Failed to resolve base ref"
      # and then "assuming all files have changed" — a full build of every
      # package, reported as an affected one. Both cases now fetch a real base
      # and pin turbo to a SHA that exists locally.
      - name: Fetch the base for turbo --affected
        id: base
        if: ${{ github.event_name == 'pull_request' }}
        uses: 12-apps/ci/.github/actions/fetch-base@v1
        with:
          # Mid-stack, GITHUB_BASE_REF is only the layer below, so --affected
          # would skip everything the lower layers touched.
          base-ref: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.ref || '' }}
          fallback-branch: ${{ inputs.default-branch }}

      - name: Point turbo --affected at the base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          STACK_BASE_SHA: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.sha || '' }}
          BASE_SHA: ${{ steps.base.outputs.base-sha }}
        run: |
          set -euo pipefail
          # Unrelated histories leave both empty: export nothing and let turbo
          # fall back to building everything, which is the safe direction.
          base="${STACK_BASE_SHA:-$BASE_SHA}"
          if [ -n "$base" ]; then
            {
              echo "TURBO_SCM_BASE=$base"
              echo "TURBO_SCM_HEAD=HEAD"
            } >> "$GITHUB_ENV"
            echo "build --affected diffs against $base"
          fi

      - name: Build
        shell: bash
        # PR: --affected builds only the touched packages (plus dependents via
        # turbo's graph; upstream deps still build as prerequisites). Push:
        # everything.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run build --affected 2>&1 | tee build.log
          else
            pnpm turbo run build 2>&1 | tee build.log
          fi

  # Sizes the integration matrix before any expensive setup. It is its own job
  # because `strategy.matrix` cannot be built from an input expression — a
  # matrix reads a JSON array, and a job output is the only place a reusable
  # workflow can produce one. It installs nothing, so the cost is a runner
  # start; the matrix it sizes is what waits.
  integration-plan:
    name: Integration Plan
    runs-on: ubuntu-latest
    if: ${{ inputs.run-integration }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Compute the shard list
        id: plan
        shell: bash
        env:
          SHARDS: ${{ inputs.integration-shards }}
        run: |
          set -euo pipefail
          # Clamp rather than trust. A zero or negative count emits an EMPTY
          # matrix, and an empty matrix skips the lane while reporting success —
          # a silent green with no tests run, which is the one outcome a test
          # lane must never produce by accident.
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ]; then
            echo "::warning::integration-shards='$SHARDS' is not a positive integer; falling back to a single shard."
            SHARDS=1
          fi
          echo "shards=$(seq "$SHARDS" | jq -cRn '[inputs | tonumber]')" >> "$GITHUB_OUTPUT"

  integration-tests:
    # An explicit name suppresses the "(1)" suffix GitHub would otherwise append
    # for a matrix job. That matters beyond looks: the unsharded name has to stay
    # byte-identical or every consumer requiring `Tests / Integration Tests` in a
    # branch ruleset starts waiting on a context that no longer reports.
    name: ${{ inputs.integration-shards > 1 && format('Integration Tests · shard {0}/{1}', matrix.shard, inputs.integration-shards) || 'Integration Tests' }}
    runs-on: ubuntu-latest
    needs: integration-plan
    if: ${{ inputs.run-integration }}
    strategy:
      # One shard's failure must not cancel the others: a partial matrix reports
      # a partial inventory, and the point of the push safety net is a complete
      # one.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.integration-plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # The consumer's PGlite schema template, restored before the setup that
      # would otherwise build it. Opt-in via pglite-template-migrations; the
      # rationale (and why a stale restore is harmless) lives with the action.
      - name: Cache the PGlite schema template
        if: ${{ inputs.pglite-template-migrations != '' }}
        uses: 12-apps/ci/.github/actions/pglite-template-cache@v1
        with:
          migrations-glob: ${{ inputs.pglite-template-migrations }}

      - name: Pre-integration setup
        if: ${{ inputs.pre-integration-command != '' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-integration-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-integration.log

      # Failed-first ordering for what is usually the longest lane (see
      # unit-tests). Distinct key space from the unit caches.
      # The shard index is part of the key space. Without it every leg of the
      # matrix writes the same cache entry, so the legs race and the survivor's
      # timings describe one shard's slice of the suite while being restored by
      # all of them — failed-first ordering would then be seeded from files the
      # restoring shard does not even run.
      - name: Restore vitest results cache (test prioritization)
        if: ${{ inputs.integration-cache-path != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.integration-cache-path }}
          key: vitest-int-results-${{ github.ref }}-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vitest-int-results-${{ github.ref }}-s${{ matrix.shard }}-
            vitest-int-results-refs/heads/${{ inputs.default-branch }}-s${{ matrix.shard }}-

      # This lane's checkout is deliberately left shallow — the action deepens
      # only as far as the merge base needs, which is cheaper than
      # `fetch-depth: 0` on a large repo. Without it a consumer command that
      # selects affected integration suites has no resolvable base at all: its
      # own `--depth=1` self-fetch grafts the checkout, the three-dot diff
      # dies, and the lane either runs its whole suite or (worse, when the
      # diff failure is swallowed) selects nothing.
      - name: Fetch the base for affected selection
        id: base
        if: ${{ github.event_name == 'pull_request' }}
        uses: 12-apps/ci/.github/actions/fetch-base@v1
        with:
          base-ref: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.ref || '' }}
          fallback-branch: ${{ inputs.default-branch }}

      - name: Run integration tests
        id: integration
        shell: bash
        # PR: fail-fast bail (the restored cache makes the retry re-hit the
        # failure first). Push (safety net): full failure inventory.
        env:
          INT_CMD: ${{ inputs.integration-command }}
          INT_FULL_CMD: ${{ inputs.integration-full-command }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.integration-shards }}
        run: |
          set -o pipefail
          # Appended, not injected: vitest applies `--shard` to the file set that
          # survives the caller's own selection, so an affected-only run splits
          # what it selected rather than re-widening to the whole suite. Omitted
          # entirely at one shard so an unsharded caller's command line is
          # byte-identical to what it was before this input existed.
          SHARD_ARG=""
          if [ "$SHARD_TOTAL" -gt 1 ]; then
            SHARD_ARG=" --shard=${SHARD_INDEX}/${SHARD_TOTAL}"
            echo "▶️  shard ${SHARD_INDEX}/${SHARD_TOTAL}"
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash -c "${INT_CMD}${SHARD_ARG}" 2>&1 | tee integration.log
          else
            bash -c "${INT_FULL_CMD}${SHARD_ARG}" 2>&1 | tee integration.log
          fi

      # Zero-test-signal guard — see the unit lane's copy for why it is gated on
      # event/opt-in/label only.
      #
      # ALSO gated on a single shard, and that condition is load-bearing. The
      # guard's question is "did this LANE run anything", but a shard only ever
      # sees its own slice, and an empty slice is a legitimate outcome of
      # splitting a narrow selection across runners — shard 3 of 4 drawing
      # nothing is arithmetic, not a selector bug. Run per-shard it would turn
      # that into a red build, which is worse than the hole it closes: a guard
      # that cries wolf gets bypassed, and then it guards nothing.
      #
      # The exclusion is an ARTIFACT of this workflow, not of the idea. Guarding
      # a MERGED report — one job after the matrix, over `vitest
      # --merge-reports` — makes sharding and the guard fully compatible,
      # because you never inspect a slice. A sibling repo already merges shard
      # blobs into a single junit exactly that way; it simply has no guard on
      # top of it yet. So the fix here is a merge step, and this condition is
      # scaffolding until one exists — not a permanent either/or.
      - name: Verify the integration lane executed at least one test
        if: >-
          ${{ github.event_name == 'pull_request'
              && inputs.integration-junit-reports != ''
              && inputs.integration-shards == 1
              && !contains(github.event.pull_request.labels.*.name, inputs.allow-zero-tests-label) }}
        uses: 12-apps/ci/.github/actions/vitest-signal-guard@v1
        with:
          reports: ${{ inputs.integration-junit-reports }}
          lane: integration
          bypass-label: ${{ inputs.allow-zero-tests-label }}

      # Save even on failure — failures drive the next run's ordering (see
      # unit-tests).
      - name: Save vitest results cache
        if: ${{ always() && inputs.integration-cache-path != '' && steps.integration.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.integration-cache-path }}
          key: vitest-int-results-${{ github.ref }}-s${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
