name: Release major tag

# Auto-advance EVERY live moving major tag (v1, v2, …) so consumers pinned to any
# of them pick up backwards-compatible changes with no manual force-push.
# Counterpart to the README policy: "backwards-compatible changes move the major;
# a breaking change cuts the next one".
#
# This used to advance a hardcoded `v1`, which silently stranded every other
# major. `v2` was cut for the additive cost/change-detection line and then never
# moved again, so `@v2` — the pin the README tells consumers to use, and the one
# both consumer repos adopted — froze while `@v1` kept tracking main. Every live
# major now gets the same treatment.
#
# Each run is IDEMPOTENT and independent of which push triggered it: it reads
# main's LIVE tip and each major's current commit, then advances that major to the
# newest commit with NO breaking change between the two — i.e. it ships every
# compatible commit up to, but never across, a breaking change. A breaking commit
# (conventional `type!:` / `type(scope)!:` subject, or a `BREAKING CHANGE:`
# footer) freezes the major at the last compatible commit before it; cut the next
# major by hand (`cut-major-tag.yml`) to go further.
#
# Majors advance INDEPENDENTLY, each from wherever it currently sits, so a major
# that fell behind catches up on its own without dragging the others along and
# without this workflow needing to know why it lagged.
#
# WHICH majors it advances is read from `.github/majors.json` (FUT-956), not
# from the tag list. "Every live major" was the fix for `v2` being stranded
# while a hardcoded `v1` tracked main, and it overshot: nothing has carried a
# breaking marker since `v2` was cut, so nothing ever stopped `v1` either, and
# it was dragged the whole way. `@v1` was therefore not the v1 line — it was the
# current v2 wearing a v1 label, and twenty-nine commits reached `@v1` consumers
# with nothing to review. A major nobody is releasing on should stop moving, and
# saying which is a decision rather than something to infer from a tag list.
#
# A live `vN` tag that the file names neither `supported` nor `frozen` FAILS the
# run. Cutting a major is a deliberate act (cut-major-tag.yml, by hand), so
# recording it is part of cutting it — and the alternative is the failure this
# whole change is about: a new major that silently either advances or does not,
# with nothing anywhere saying which was meant.
#
# Computing the target from the live tip (not the triggering commit) makes this
# correct even when a burst of pushes causes GitHub's concurrency group to drop a
# pending sibling run: whichever run survives still walks the full range and moves
# each major to its last compatible commit, so no compatible commit is stranded.

on:
  push:
    branches: [main]
  # Recovery, and the reason it is needed: a run that never starts still HOLDS
  # the concurrency group below, and there is no other way to reach this
  # workflow. Measured on 2026-08-26 — run 65 (3cedddf) sat `queued` for 90
  # minutes without its job ever starting; run 66 (d7bd37c) queued behind it and
  # was concluded `failure` with its only job still `queued`. So `v1` stopped at
  # 742f13a while main was two compatible commits ahead, and consumers pinned to
  # `@v1` kept resolving the older workflow. Nothing was red in a way that named
  # this: the holder reads `queued`, not failed, and the victim reads `failure`
  # with no failing job to open.
  workflow_dispatch:

# Least-privilege: this job's only side effect is writing tag refs.
permissions:
  contents: write

# Serialize tag moves, and let a newer push REPLACE a pending one.
#
# This was `cancel-in-progress: false`, to let a running push always finish. The
# comment that set it also recorded why nothing depends on that: each run
# recomputes every target from main's live tip, so a cancelled run costs nothing
# a later run does not redo. It was buying no correctness — and it was charging
# for it, because a `false` group is held by a run that never starts as firmly as
# by one that is working, and this workflow has exactly one job. One stranded run
# therefore froze every moving major indefinitely, which is the failure recorded
# above the trigger.
#
# `true` makes the group self-clearing: the next push to main supersedes whatever
# is stuck, and — by that same recompute-from-live-tip property — ships every
# compatible commit the superseded run would have.
concurrency:
  group: release-major-tag
  cancel-in-progress: true

jobs:
  move-major-tag:
    name: Move major tags
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can read the majors and walk what they ship.
          fetch-depth: 0
          fetch-tags: true
      - name: Advance each supported major to its newest compatible commit
        shell: bash
        run: |
          set -euo pipefail
          # The declared majors. jq is on every GitHub-hosted runner.
          declared='.github/majors.json'
          supported="$(jq -r '.supported' "$declared")"
          mapfile -t frozen < <(jq -r '.frozen | keys[]' "$declared")
          echo "Declared: supported=${supported}, frozen=${frozen[*]:-none}"
          is_frozen() { local t; for t in "${frozen[@]:-}"; do [ "$t" = "$1" ] && return 0; done; return 1; }
          # Recompute from main's LIVE tip (a sibling push may be newer than the
          # commit that triggered this run). Read the freshly-fetched tip from
          # FETCH_HEAD, NOT origin/main: a bare `git fetch origin main` updates
          # FETCH_HEAD but can leave the local origin/main tracking ref stale, so
          # reading origin/main could compute an old tip and strand a commit.
          # Fail-fast on the fetch (not masked).
          git fetch --no-tags --quiet origin main
          tip="$(git rev-parse FETCH_HEAD)"
          breaking_re='^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'
          is_breaking() { git log -1 --format='%s%n%b' "$1" | grep -qE "$breaking_re"; }

          # Only bare `vN` refs are moving majors. vX.Y.Z tags from
          # release-version.yml are immutable by definition and must never move.
          majors="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+$' | sort -V || true)"

          if [ -z "$majors" ]; then
            # Bootstrap: create the SUPPORTED major at the tip unless the tip
            # itself is breaking. Hardcoding `v1` here would recreate the very
            # tag the declaration has retired.
            if is_breaking "$tip"; then
              echo "No major tag yet and the tip is a breaking change — not creating one."
              echo "Cut the first major by hand with cut-major-tag.yml."
              exit 0
            fi
            git tag -f "$supported" "$tip"
            git push -f origin "refs/tags/${supported}"
            echo "✓ Bootstrapped ${supported} -> $tip"
            exit 0
          fi

          moved=()
          undeclared=()
          while read -r tag; do
            [ -z "$tag" ] && continue

            if is_frozen "$tag"; then
              echo "· $tag is FROZEN by .github/majors.json — left where it is."
              continue
            fi
            if [ "$tag" != "$supported" ]; then
              undeclared+=("$tag")
              continue
            fi

            # Peel to the COMMIT. A major may be annotated (cut-major-tag.yml and
            # hand-cut tags produce tag objects), in which case a bare rev-parse
            # returns the tag object's sha, which would never equal the commit sha
            # the walk produces — so the "already current" check below would never
            # fire and the tag would be force-pushed on every single run. The old
            # hardcoded-v1 version got away with a bare rev-parse only because v1
            # happened to be lightweight; v2 is annotated.
            cur="$(git rev-parse "refs/tags/${tag}^{commit}")"

            # Walk (tag, tip] oldest -> newest; target = the last commit before the
            # first breaking one (or tip if none). Ships every compatible commit up
            # to, but never across, a breaking change — so nothing is stranded.
            target="$cur"
            while read -r sha; do
              [ -z "$sha" ] && continue
              if is_breaking "$sha"; then break; fi
              target="$sha"
            done < <(git rev-list --reverse "${cur}..${tip}")

            if [ "$target" = "$cur" ]; then
              echo "· $tag is already at its newest shippable commit, or frozen just"
              echo "  before a breaking change. Cut the next major to release past it."
              continue
            fi

            git tag -f "$tag" "$target"
            moved+=("refs/tags/$tag")
            echo "✓ $tag -> $target"
          done <<<"$majors"

          # An undeclared live major is a decision nobody recorded. Reported
          # AFTER the walk so the supported major still ships this push's
          # commits — the declaration being incomplete is not a reason to strand
          # a release — and then failed, loudly, with the remedy named.
          if [ ${#undeclared[@]} -gt 0 ]; then
            if [ ${#moved[@]} -gt 0 ]; then git push -f origin "${moved[@]}"; fi
            echo "::error title=Undeclared major tag::These live major tags are neither \`supported\` nor listed under \`frozen\` in .github/majors.json, so this workflow cannot know whether to advance them: ${undeclared[*]}. Add each one to that file — advancing it means making it \`supported\`, retiring it means a \`frozen\` entry with the reason."
            exit 1
          fi

          if [ ${#moved[@]} -eq 0 ]; then
            echo "No major tag moved."
            exit 0
          fi

          # One push for every moved major: fewer round trips, and no window where
          # some majors have advanced and others have not.
          git push -f origin "${moved[@]}"
