name: Release major tag

# Auto-advance the moving major tag (v1) whenever a backwards-compatible change
# lands on main, so consumers pinned to `@v1` pick it up with no manual
# force-push. This is the counterpart to the README policy: "backwards-compatible
# changes move v1; a breaking change cuts v2".
#
# Breaking changes FREEZE v1: the job scans EVERY commit that moving v1 would
# newly ship — the range (current v1, HEAD] — for a conventional-commit breaking
# marker (`type!:` / `type(scope)!:` subject, or a `BREAKING CHANGE:` footer). If
# any is found, v1 is NOT moved (advancing it would leapfrog the break to `@v1`
# consumers) — cut the next major (v2) by hand. Scanning the whole range (not
# just HEAD) keeps this correct regardless of how pushes interleave or which run
# wins, so a compatible commit is never stranded and a breaking one never slips
# through.

on:
  push:
    branches: [main]

# Least-privilege: this job's only side effect is writing the tag ref.
permissions:
  contents: write

# Serialize tag moves. cancel-in-progress MUST stay false: cancelling an
# in-flight compatible run (e.g. when a later breaking push lands) would drop its
# v1 move, and the later run would exit in the freeze branch — leaving v1 stale.
# Letting each run finish, combined with the range scan below, is always correct.
concurrency:
  group: release-major-tag
  cancel-in-progress: false

jobs:
  move-major-tag:
    name: Move v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can read v1 and diff the range it would ship.
          fetch-depth: 0
          fetch-tags: true
      - name: Move v1 (freeze on any breaking change in the range it would ship)
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          breaking_re='^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'
          # Range moving v1 would newly ship: (current v1, HEAD]. If v1 does not
          # exist yet, inspect only this commit.
          if git rev-parse -q --verify refs/tags/v1 >/dev/null; then
            breaking="$(git log --format='%s%n%b' "$(git rev-parse refs/tags/v1)..$SHA" | grep -E "$breaking_re" || true)"
          else
            breaking="$(git log -1 --format='%s%n%b' "$SHA" | grep -E "$breaking_re" || true)"
          fi
          if [ -n "$breaking" ]; then
            echo "Breaking change in the range moving v1 would ship — v1 FROZEN."
            echo "Cut a new major tag (v2) manually. Offending marker(s):"
            printf '%s\n' "$breaking" | sed 's/^/  /'
            exit 0
          fi
          git tag -f v1 "$SHA"
          git push -f origin "refs/tags/v1"
          echo "✓ Moved v1 -> $SHA"
