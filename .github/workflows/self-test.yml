# Self-tests for the scripts this repo ships INSIDE composite actions.
#
# Everything else here is a reusable workflow, which is only ever exercised by
# a consumer's run. The action scripts are different: they are ordinary Node
# modules, they encode assumptions about how git behaves, and a regression in
# one is invisible until a consumer's selection silently widens (a full run
# wearing the word "affected") or silently narrows (a gate that skips itself
# and reports success). Both failure modes are green, so they need a test that
# is not.
name: Self Tests

on:
  pull_request:
    paths:
      - '.github/actions/**'
      # The docs and the major declaration are asserted here too (FUT-956), so
      # an edit to either has to run those assertions. Same rule the comment
      # below records for the workflow files: a gate filtered out of the edits
      # it exists to catch is a gate that stops running, and a gate that stops
      # running is never red.
      - '**.md'
      - '.github/majors.json'
      # Renovate's scope decides which pins keep moving, and a pin that stops
      # moving is a freeze — the exact failure the pinning was taken out to
      # avoid. Without this line an edit to renovate.json runs no test at all.
      - 'renovate.json'
      # The workflow FILES' own shape is tested here too, and those tests are
      # worthless if editing the file under test does not run them. This lane
      # was filtered to `.github/actions/**` while asserting things about
      # monorepo-tests.yml — a gate that stops running is never red.
      - '.github/workflows/**'
      # Same rule, one directory over: the provisioning scripts a composite
      # action SHIPS are asserted here, and an edit to one has to run those
      # assertions. do-provision executes deploy-cloud-init.sh, so a change
      # there is a change to what a consumer's droplet boots with.
      - 'scripts/ephemeral/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'scripts/ephemeral/**'
      - '**.md'
      - '.github/majors.json'
      - 'renovate.json'

permissions:
  contents: read

jobs:
  action-scripts:
    name: Action script tests
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # node builtins only — no install step, by design: these scripts run in
      # consumer jobs before any dependency is available.
      - name: fetch-base
        shell: bash
        run: node --test .github/actions/fetch-base/__tests__/fetch-base.test.mjs

      - name: setup-playwright
        shell: bash
        run: node --test .github/actions/setup-playwright/__tests__/install-playwright.test.mjs

      - name: vitest-signal-guard
        shell: bash
        run: node --test .github/actions/vitest-signal-guard/__tests__/check-test-signal.test.mjs

      - name: bundle-ceiling-guard
        shell: bash
        run: node --test .github/actions/bundle-ceiling-guard/__tests__/bundle-ceiling-guard.test.mjs

      # affected-plan decides what a consumer's test lane runs. Both of its
      # failure directions are green — a lane that runs too much only costs
      # minutes, and a lane that runs too little reports success on code no
      # test touched — so it carries the widest self-test set here.
      - name: affected-plan
        shell: bash
        run: node --test .github/actions/affected-plan/__tests__/*.test.mjs

      - name: package-gates
        shell: bash
        run: node --test .github/actions/package-gates/__tests__/package-gates.test.mjs

      # The failure ledger's EXTRACTOR is the piece that fails silently. A gate
      # that reproduces a failure goes red and one that cannot read its ledger
      # says so, but a detector that stopped recognising a runner's output
      # records an EMPTY ledger: the next run finds nothing, stands down
      # politely, and the pipeline goes on being slow with nothing red at any
      # point. Its fixtures are real runner output quoted from consumer runs.
      - name: failure-ledger
        shell: bash
        run: node --test .github/actions/failure-ledger/__tests__/*.test.mjs

      # Not an action's tests — the workflow FILES' own shape. A reusable
      # workflow that references an action by a relative path works in every
      # job above (same checkout, same directory) and breaks only in the
      # consuming repo, so nothing else in this lane can see it.
      - name: Reusable workflow references
        shell: bash
        run: node --test .github/workflows/__tests__/reusable-workflow-refs.test.mjs

      # Every ssh invocation carries a keepalive.
      #
      # A deploy holds one ssh session across pull, rollout and fixture seed,
      # and goes quiet for minutes at a time inside it. Without
      # `ServerAliveInterval` the idle connection is reaped and the step dies
      # on a broken pipe — four times in a consumer, three of them answered by
      # making one phase of the REMOTE script chatter, which only moved the
      # silence somewhere else. This is the transport-level rule those fixes
      # kept missing, and it is one option a new ssh line gets copied without.
      - name: SSH keepalive
        shell: bash
        run: node --test .github/workflows/__tests__/ssh-keepalive.test.mjs

      # The zero-shard guard on every matrix job built from a plan output.
      - name: Matrix zero guard
        shell: bash
        run: node --test .github/workflows/__tests__/matrix-zero-guard.test.mjs

      # The pin a reader copies, against the major this repo actually supports.
      #
      # These drifted apart and nothing compared them: README.md said `@v2` in
      # ten places while CONSUMING.md said `@v1` in twenty, so a consumer's pin
      # depended on which page they opened. Harmless only while the two tags are
      # the same commit — which they were, because release-major-tag.yml dragged
      # `v1` along behind every v2 release. The moment a breaking change lands,
      # `v1` freezes, `v2` keeps moving, and a consumer split across the two runs
      # two engine versions with nothing reporting it.
      #
      # Green in both wrong directions without this: the docs cannot be red, and
      # a tag that quietly stopped being the one anybody releases on cannot
      # either.
      - name: Documented major pins
        shell: bash
        run: node --test .github/workflows/__tests__/major-pin-refs.test.mjs

      # Every job these workflows DEFINE is bounded by `timeout-minutes`.
      #
      # This one can only live here. A consumer calls these workflows with
      # `uses:`, and GitHub rejects `timeout-minutes` on a call job — so a
      # consumer's own guard covers the jobs it owns and can do nothing about
      # these, which is why an unbounded lane in this repo was invisible from
      # both sides. A job added here without a bound is now red before it ships.
      - name: Job timeouts
        shell: bash
        run: node --test .github/workflows/__tests__/job-timeouts.test.mjs

      # Every workflow here declares a top-level `permissions:` block, and every
      # nested reusable call declares its own.
      #
      # Same reason as the timeouts above: a CONSUMER cannot fix this. A reusable
      # workflow with no block runs at whatever the caller's job grants, so the
      # gap is invisible from the consuming repo (its own call looks correctly
      # pinned) and invisible here (nothing is red). Eleven workflows declared a
      # block and six did not, and the six were the test lanes and both deploy
      # adapters. A workflow added without one is now red before it ships.
      - name: Workflow permissions
        shell: bash
        run: node --test .github/workflows/__tests__/workflow-permissions.test.mjs

      # No run: script pastes a secret — or an attacker-writable context — into
      # its own source.
      #
      # The failure this catches is not a broken run; it is a working one that
      # leaks. deploy-digitalocean.yml passed two tokens positionally to
      # `ssh … 'bash -s' --`, which put them in the REMOTE host's process table
      # for the life of the session, while the block's own comment correctly
      # stated that no secret-bearing .env was written. Both were true. Nothing
      # about it was ever red.
      - name: Run-body interpolation
        shell: bash
        run: node --test .github/workflows/__tests__/run-body-interpolation.test.mjs

      # The retry gate's hold on lint/type-check/actionlint.
      #
      # Its failure mode is silent and one-directional: the gate is SKIPPED on
      # every green branch, so the condition holding it must survive a skip —
      # and the two idioms that do (`always()`, `!cancelled()`) are true for a
      # FAILED gate too. Written either of those ways the tier starts on a tree
      # the gate just proved broken, the run is still red, and the only thing
      # lost is the minutes the lane exists to save. Nothing else would notice.
      - name: Retry gate wiring
        shell: bash
        run: node --test .github/workflows/__tests__/retry-gate-wiring.test.mjs

      # Where the verdict is looked up, and where it is recorded.
      #
      # Both are placement rules whose wrong answer is SILENT. A lookup inside
      # the matrix still works — it just bills for four jobs per lane that exist
      # only to discover they have nothing to do, which is what it did until
      # FUT-960. A record inside the matrix still works — it just makes a
      # lane-level claim a shard did not earn, which is why the skip had to stand
      # down whenever the zero-test guard was armed on a sharded lane.
      #
      # Neither shows up as a failing job, so neither can be caught by running
      # CI. They are asserted over the workflow text instead.
      - name: Lane verdict wiring
        shell: bash
        run: node --test .github/workflows/__tests__/lane-verdict-wiring.test.mjs

      # What a provisioned droplet actually boots with. do-provision runs
      # scripts/ephemeral/deploy-cloud-init.sh, and every way that document can
      # be wrong is silent: the API accepts any user-data at all, the droplet
      # boots, and the run reports success. So the test RENDERS it (no token, no
      # API call, no droplet) and asserts on the bytes — that it parses, that
      # non-root egress to the metadata endpoint is dropped before any token is
      # written, and that no secret is interpolated that need not be.
      - name: Cloud-init user-data
        shell: bash
        run: node --test scripts/ephemeral/__tests__/deploy-cloud-init.test.mjs

      # No shell step truncates a pipeline with `head`.
      #
      # `shell: bash` is `-eo pipefail`, and a composite action's `run:` MUST
      # declare a shell — so `| head` makes the step's exit status the exit
      # status of a producer that gets EPIPE the moment head has enough lines.
      # The trigger is the SIZE OF THE DATA, so it passes under the limit and
      # fails over it with nothing in the diff to say which. Measured on
      # future-pay#1216: affected-plan's summary step killed `Tests / Unit Plan`
      # with a correct plan already on disk, and every lane gated on that job
      # skipped.
      - name: Head truncation
        shell: bash
        run: node --test .github/workflows/__tests__/head-truncation.test.mjs

  # Not a script test and not a file-shape test: an assertion about GITHUB, run
  # on GitHub, because the alternative is a comment.
  #
  # Three separate comments in this repo said "an empty matrix skips the lane
  # and reports success". It does not — GitHub refuses to create the job and the
  # run errors — and the belief survived because nothing ever executed it. The
  # whole zero-planned-tests design in monorepo-tests.yml rests on the guard
  # below short-circuiting BEFORE the matrix is expanded, so that ordering is
  # asserted rather than assumed.
  #
  # Reads as green either way in the job list. It is the WORKFLOW that fails if
  # the ordering is ever the other one: an expanded-then-guarded empty vector
  # takes this run down with it, which is exactly the signal wanted.
  empty-matrix-plan:
    name: Empty matrix plan
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Report no work, exactly as a real plan job does
        id: plan
        shell: bash
        run: |
          echo "shards=[]" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"

  empty-matrix-guard:
    name: Empty matrix is skipped by the guard, never expanded
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    needs: empty-matrix-plan
    if: ${{ needs.empty-matrix-plan.outputs.count != '0' }}
    strategy:
      matrix:
        shard: ${{ fromJson(needs.empty-matrix-plan.outputs.shards) }}
    steps:
      - name: Unreachable
        shell: bash
        run: |
          echo "::error::the zero guard did not skip this job"
          exit 1
