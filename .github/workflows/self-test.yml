# Self-tests for the scripts this repo ships INSIDE composite actions.
#
# Everything else here is a reusable workflow, which is only ever exercised by
# a consumer's run. The action scripts are different: they are ordinary Node
# modules, they encode assumptions about how git behaves, and a regression in
# one is invisible until a consumer's selection silently widens (a full run
# wearing the word "affected") or silently narrows (a gate that skips itself
# and reports success). Both failure modes are green, so they need a test that
# is not.
name: Self Tests

on:
  pull_request:
    paths:
      - '.github/actions/**'
      # The workflow FILES' own shape is tested here too, and those tests are
      # worthless if editing the file under test does not run them. This lane
      # was filtered to `.github/actions/**` while asserting things about
      # monorepo-tests.yml — a gate that stops running is never red.
      - '.github/workflows/**'
      # Same rule, one directory over: the provisioning scripts a composite
      # action SHIPS are asserted here, and an edit to one has to run those
      # assertions. do-provision executes deploy-cloud-init.sh, so a change
      # there is a change to what a consumer's droplet boots with.
      - 'scripts/ephemeral/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'scripts/ephemeral/**'

permissions:
  contents: read

jobs:
  action-scripts:
    name: Action script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # node builtins only — no install step, by design: these scripts run in
      # consumer jobs before any dependency is available.
      - name: fetch-base
        shell: bash
        run: node --test .github/actions/fetch-base/__tests__/fetch-base.test.mjs

      - name: setup-playwright
        shell: bash
        run: node --test .github/actions/setup-playwright/__tests__/install-playwright.test.mjs

      - name: vitest-signal-guard
        shell: bash
        run: node --test .github/actions/vitest-signal-guard/__tests__/check-test-signal.test.mjs

      - name: bundle-ceiling-guard
        shell: bash
        run: node --test .github/actions/bundle-ceiling-guard/__tests__/bundle-ceiling-guard.test.mjs

      # affected-plan decides what a consumer's test lane runs. Both of its
      # failure directions are green — a lane that runs too much only costs
      # minutes, and a lane that runs too little reports success on code no
      # test touched — so it carries the widest self-test set here.
      - name: affected-plan
        shell: bash
        run: node --test .github/actions/affected-plan/__tests__/*.test.mjs

      - name: package-gates
        shell: bash
        run: node --test .github/actions/package-gates/__tests__/package-gates.test.mjs

      # Not an action's tests — the workflow FILES' own shape. A reusable
      # workflow that references an action by a relative path works in every
      # job above (same checkout, same directory) and breaks only in the
      # consuming repo, so nothing else in this lane can see it.
      - name: Reusable workflow references
        shell: bash
        run: node --test .github/workflows/__tests__/reusable-workflow-refs.test.mjs

      # The zero-shard guard on every matrix job built from a plan output.
      - name: Matrix zero guard
        shell: bash
        run: node --test .github/workflows/__tests__/matrix-zero-guard.test.mjs

      # What a provisioned droplet actually boots with. do-provision runs
      # scripts/ephemeral/deploy-cloud-init.sh, and every way that document can
      # be wrong is silent: the API accepts any user-data at all, the droplet
      # boots, and the run reports success. So the test RENDERS it (no token, no
      # API call, no droplet) and asserts on the bytes — that it parses, that
      # non-root egress to the metadata endpoint is dropped before any token is
      # written, and that no secret is interpolated that need not be.
      - name: Cloud-init user-data
        shell: bash
        run: node --test scripts/ephemeral/__tests__/deploy-cloud-init.test.mjs

  # Not a script test and not a file-shape test: an assertion about GITHUB, run
  # on GitHub, because the alternative is a comment.
  #
  # Three separate comments in this repo said "an empty matrix skips the lane
  # and reports success". It does not — GitHub refuses to create the job and the
  # run errors — and the belief survived because nothing ever executed it. The
  # whole zero-planned-tests design in monorepo-tests.yml rests on the guard
  # below short-circuiting BEFORE the matrix is expanded, so that ordering is
  # asserted rather than assumed.
  #
  # Reads as green either way in the job list. It is the WORKFLOW that fails if
  # the ordering is ever the other one: an expanded-then-guarded empty vector
  # takes this run down with it, which is exactly the signal wanted.
  empty-matrix-plan:
    name: Empty matrix plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Report no work, exactly as a real plan job does
        id: plan
        shell: bash
        run: |
          echo "shards=[]" >> "$GITHUB_OUTPUT"
          echo "count=0" >> "$GITHUB_OUTPUT"

  empty-matrix-guard:
    name: Empty matrix is skipped by the guard, never expanded
    runs-on: ubuntu-latest
    needs: empty-matrix-plan
    if: ${{ needs.empty-matrix-plan.outputs.count != '0' }}
    strategy:
      matrix:
        shard: ${{ fromJson(needs.empty-matrix-plan.outputs.shards) }}
    steps:
      - name: Unreachable
        shell: bash
        run: |
          echo "::error::the zero guard did not skip this job"
          exit 1
