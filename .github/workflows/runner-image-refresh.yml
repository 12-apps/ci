name: Runner image refresh

# Rebuilds the self-hosted fleet's image every week and redeploys it
# (scripts/runner-host/wake/refresh-image.sh): a golden host updated to this
# commit, a FRESH host from the new image checked before anything ships, then
# deploy.sh with the fleet's live settings, which copies the image to every
# region and prunes the old ones.
#
# Why weekly: fleet hosts live minutes and never update themselves, so the
# GitHub runner, Node and OS packages are whatever the image was built with,
# and GitHub stops accepting a runner that falls too far behind its latest
# release. The whole fleet would then queue without an error of its own.
#
# It does nothing until the repository variables below exist, so merging it
# changes nothing on its own (docs: scripts/runner-host/wake/README.md,
# "Refreshing the image"):
#   CI_RUNNER_AWS_ROLE            the OIDC role this job assumes
#   CI_RUNNER_SUBNET_ID           a subnet in the home region for the golden and
#   CI_RUNNER_SECURITY_GROUP_ID     smoke hosts, with their security group
#   CI_RUNNER_INSTANCE_PROFILE    the hosts' instance profile ARN

on:
  schedule:
    # Mondays 06:17 UTC (03:17 in Brasília): the quietest hour of the week.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runner-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild and redeploy the runner image
    if: vars.CI_RUNNER_AWS_ROLE != ''
    # The role trusts this environment's subject only (README, "One-time
    # setup"), and the environment only deploys from main.
    environment: runner-image
    # GitHub's runner on purpose: this job replaces the fleet's image, so it
    # cannot depend on the fleet being healthy, and it may be the fix for a
    # fleet that is not.
    runs-on: ubuntu-latest
    # Measured on 2026-09-26: settings and golden ~25 min, imaging ~15, the
    # smoke host ~8; deploy.sh then copies to each region (up to 90 min each
    # in the worst case). The role session below must outlast the job.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate with the fleet's OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.CI_RUNNER_AWS_ROLE }}
          role-session-name: runner-image-refresh
          # The default is one hour; credentials expiring mid-deploy would
          # stop it half-rolled and leave the hosts running.
          role-duration-seconds: 10800
      - name: Rebuild, check a fresh host, redeploy
        shell: bash
        env:
          AWS_REGION: us-east-1
          CI_REF: ${{ github.sha }}
          REFRESH_ID: ${{ github.run_id }}
          SUBNET_ID: ${{ vars.CI_RUNNER_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.CI_RUNNER_SECURITY_GROUP_ID }}
          INSTANCE_PROFILE_ARN: ${{ vars.CI_RUNNER_INSTANCE_PROFILE }}
        run: exec bash scripts/runner-host/wake/refresh-image.sh
      # A cancelled or timed-out step is SIGKILLed with its process tree, so
      # the script's exit trap may never run: terminate what this run tagged.
      - name: Terminate this run's hosts
        if: always()
        shell: bash
        env:
          AWS_REGION: us-east-1
          REFRESH_ID: ${{ github.run_id }}
        run: |
          ids=$(aws ec2 describe-instances --filters "Name=tag:ci-runner-refresh,Values=${REFRESH_ID}" \
            "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then
            # shellcheck disable=SC2086
            aws ec2 terminate-instances --instance-ids $ids --output text >/dev/null
            echo "terminated ${ids}"
          else
            echo "nothing left running"
          fi
