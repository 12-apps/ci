name: Deploy · DigitalOcean

# Reusable deploy adapter (called by cd.yml). Does NOT build — it pulls prebuilt
# GHCR images onto a persistent single droplet and runs the docker-compose stack.
# Redeploys SSH into the SAME box so postgres_data volumes survive.
# Enabled by ENABLE_DEPLOY_DIGITALOCEAN (gated in cd.yml).
#
# Required secrets: DO_API_TOKEN, DO_SSH_PRIVATE_KEY_B64.
#   DOPPLER_TOKEN — REQUIRED for redeploys: a read-scoped Doppler service token.
#   ALL app secrets (AUTH_*, GOOGLE_*, POSTGRES_*, PAGBANK_*, DATA_ENCRYPTION_KEY,
#   …) are injected at container start via `doppler run`; NO secret-bearing .env
#   is written — only non-secret per-deploy image pins go to /app/.env.
# Optional secrets: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — used ONLY by the
#   one-time provision (cloud-init) path, not by redeploys.
# Required variable (after first provision): DEPLOY_HOST (droplet public IPv4).

on:
  workflow_call:
    inputs:
      action:
        description: 'provision | deploy | destroy'
        type: string
        required: false
        default: deploy
      image_tag:
        description: 'GHCR image tag to run (the commit SHA, passed by cd.yml)'
        type: string
        required: false
        default: main
      image_namespace:
        description: 'GHCR namespace ghcr.io/<owner/repo> (from discovery)'
        type: string
        required: false
        default: ''
      droplet_name:
        type: string
        required: false
        default: app-prod
      droplet_size:
        type: string
        required: false
        default: s-1vcpu-1gb
      branch:
        type: string
        required: false
        default: main

jobs:
  provision:
    name: Provision droplet
    if: inputs.action == 'provision'
    runs-on: ubuntu-latest
    env:
      DROPLET_NAME: ${{ inputs.droplet_name }}
      DROPLET_SIZE: ${{ inputs.droplet_size }}
    steps:
      # Engine lives in 12-apps/ci; this composite ships scripts/ephemeral/deploy-cloud-init.sh
      # so consumer repos never vendor it. Secrets pass as inputs (composites have no secrets ctx).
      - name: Create droplet + initial deploy
        uses: 12-apps/ci/.github/actions/do-provision@v1
        with:
          do_api_token: ${{ secrets.DO_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          image_tag: ${{ inputs.image_tag }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}.git
          droplet_name: ${{ inputs.droplet_name }}
          droplet_size: ${{ inputs.droplet_size }}
          branch: ${{ inputs.branch }}
      - name: Resolve IP and print next step
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          IP=$(curl -sk "https://api.digitalocean.com/v2/droplets?name=$DROPLET_NAME" \
            -H "Authorization: Bearer $DO_API_TOKEN" \
            | jq -r '.droplets[0].networks.v4[] | select(.type=="public") | .ip_address' | head -1)
          {
            echo "## Droplet provisioned 🚀"
            echo ""
            echo "**IP:** \`$IP\`  (cloud-init is bringing the stack up — allow a few min)"
            echo ""
            echo "Set repo Variable **DEPLOY_HOST = $IP** so push-to-main deploys target it."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Redeploy
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Guard — DEPLOY_HOST must be set
        run: |
          if [ -z "${{ vars.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST variable is not set. Run cd.yml with action=provision (target=digitalocean) first, then add the DEPLOY_HOST repo variable."
            exit 1
          fi
      - name: Setup SSH key
        run: |
          echo "${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}" | tr -d ' \n\r\t' | base64 -d > /tmp/do_key
          chmod 600 /tmp/do_key
      - name: Pull prebuilt images and (re)start over SSH
        run: |
          ssh -i /tmp/do_key -o StrictHostKeyChecking=no -o LogLevel=ERROR \
            root@${{ vars.DEPLOY_HOST }} 'bash -s' -- \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.actor }}" \
            "${{ inputs.image_tag }}" \
            "${{ inputs.image_namespace }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "${{ secrets.DOPPLER_TOKEN }}" <<'REMOTE'
          set -euo pipefail
          # DOPPLER_TOKEN is the only optional trailing arg (ssh drops it if unset
          # → default-expand). Every secret comes from the Doppler config, so no
          # other credential needs to be passed to the box.
          GH_TOKEN="$1"; GH_ACTOR="$2"; IMAGE_TAG="$3"; IMAGE_NS="${4:-}"; REPO_HTTPS="$5"; DOPPLER_TOKEN="${6:-}"
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is required — this adapter injects all secrets from the Doppler config." >&2
            exit 1
          fi

          # Reclaim disk FIRST — before git or docker write anything. The
          # persistent box accumulates superseded image tags + build cache, and a
          # full disk fails even git ("cannot write .git/config.lock"). Removes
          # unused images/containers/networks + build cache only; named volumes
          # (postgres_data) are preserved.
          docker system prune -af || true

          # x-access-token: prefix — GitHub Actions/App tokens (ghs_…) authenticate
          # as the username "x-access-token"; using the token as a bare username
          # makes git prompt for a password and fail non-interactively (exit 128).
          CLONE_URL=$(printf '%s' "$REPO_HTTPS" | sed "s|https://|https://x-access-token:${GH_TOKEN}@|")

          # The box no longer builds anything — it only needs the compose file and
          # nginx config, so shallow-sync the repo for those.
          if [ ! -d /app/.git ]; then
            git clone --depth 1 --branch main "$CLONE_URL" /app
          fi
          cd /app
          # Scrub the token from /app/.git/config on ANY exit — including a git
          # fetch/reset failure under `set -e`, which would otherwise leave the
          # token-embedded URL persisted. `rc=$?; … exit $rc` preserves the real
          # exit code so a failed deploy still fails the job.
          trap 'rc=$?; git remote set-url origin "$REPO_HTTPS" 2>/dev/null || true; exit $rc' EXIT
          git remote set-url origin "$CLONE_URL"
          git fetch --depth 1 origin main
          git reset --hard origin/main

          # Doppler is the single source of truth for secrets — they are injected
          # at container start by `doppler run`; NO secret-bearing .env is written.
          # /app/.env is (re)written with ONLY the non-secret per-deploy image pins
          # that docker compose reads for ${VAR} interpolation. POSTGRES_*/AUTH_*/
          # GOOGLE_*/PAGBANK_*/etc. all live in the Doppler config now.
          command -v doppler >/dev/null 2>&1 || curl -Ls https://cli.doppler.com/install.sh | sh
          export DOPPLER_TOKEN                 # doppler run reads it from the env
          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            [ -n "$IMAGE_NS" ] && echo "IMAGE_NAMESPACE=${IMAGE_NS}"
          } > /app/.env

          # Pull prebuilt images from GHCR (private) and run — no on-box build.
          # Secrets are injected into each invocation by `doppler run`.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          doppler run -- docker compose --profile tools pull
          # `< /dev/null` + `-T`: this whole script IS the stdin of `bash -s` over
          # ssh. Without its own stdin, `docker compose run` READS the rest of that
          # stdin — swallowing the `up`/`ps` lines below, so bash hits EOF and the
          # deploy silently ends before recreating anything. Redirect stdin so the
          # remaining commands actually run.
          doppler run -- docker compose run --rm -T migrate < /dev/null
          # --force-recreate: a plain `up` can leave the old container running when
          # only the image tag changed (observed: new image pulled + resolved, but
          # the container stayed on the prior SHA). Force it so the new image
          # actually goes live. --remove-orphans drops services removed from the
          # compose file (e.g. the retired redis).
          doppler run -- docker compose up -d --no-build --force-recreate --remove-orphans
          docker compose ps
          REMOTE
      - name: Summary
        run: |
          {
            echo "## Redeployed ✅"
            echo ""
            echo "**Image tag:** \`${{ inputs.image_tag }}\`"
            echo "**URL:** http://${{ vars.DEPLOY_HOST }}/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Smoke/integration/e2e against the live droplet (parity with the Cloudflare
  # adapter). post-cd.yml's WEB_URL/API_URL must point at the droplet for the
  # checks to run; otherwise they no-op on the placeholder URLs.
  trigger-post-cd:
    name: Trigger Post-CD
    needs: deploy
    # createWorkflowDispatch needs actions:write; the caller (cd.yml) grants it.
    permissions:
      contents: read
      actions: write
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger post-cd workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'post-cd.yml',
              ref: context.ref,
              inputs: {
                deployment_sha: context.sha
              }
            })

  destroy:
    name: Destroy droplet
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    env:
      DROPLET_NAME: ${{ inputs.droplet_name }}
    steps:
      - name: Delete droplet by name
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          ID=$(curl -sk "https://api.digitalocean.com/v2/droplets?name=$DROPLET_NAME" \
            -H "Authorization: Bearer $DO_API_TOKEN" | jq -r '.droplets[0].id // empty')
          if [ -z "$ID" ]; then
            echo "No droplet named $DROPLET_NAME found"; exit 0
          fi
          curl -sk -X DELETE "https://api.digitalocean.com/v2/droplets/$ID" \
            -H "Authorization: Bearer $DO_API_TOKEN"
          echo "## Destroyed droplet $ID 🗑️" >> "$GITHUB_STEP_SUMMARY"
