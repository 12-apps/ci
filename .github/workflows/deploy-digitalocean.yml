name: Deploy · DigitalOcean

# Reusable deploy adapter (called by cd.yml). Does NOT build — it pulls prebuilt
# GHCR images onto a persistent single droplet and runs the docker-compose stack.
# Redeploys SSH into the SAME box so postgres_data volumes survive.
# Enabled by ENABLE_DEPLOY_DIGITALOCEAN (gated in cd.yml).
#
# Required secrets: DO_API_TOKEN, DO_SSH_PRIVATE_KEY_B64.
#   DOPPLER_TOKEN — REQUIRED for redeploys: a read-scoped Doppler service token.
#   ALL app secrets (AUTH_*, GOOGLE_*, POSTGRES_*, PAGBANK_*, DATA_ENCRYPTION_KEY,
#   …) are injected at container start via `doppler run`; NO secret-bearing .env
#   is written — only non-secret per-deploy image pins go to /app/.env.
#   DOPPLER_TOKEN is required for PROVISION too, not only redeploys: cloud-init
#   installs the CLI and injects secrets exactly as a redeploy does, so no
#   secret-bearing .env is ever written to the droplet. GOOGLE_CLIENT_ID /
#   GOOGLE_CLIENT_SECRET are no longer read by any path here — OAuth
#   credentials come from the Doppler config like every other secret.
# Required variable (after first provision): DEPLOY_HOST (droplet public IPv4).

on:
  workflow_call:
    inputs:
      action:
        description: 'provision | deploy | destroy'
        type: string
        required: false
        default: deploy
      image_tag:
        description: 'GHCR image tag to run (the commit SHA, passed by cd.yml)'
        type: string
        required: false
        default: main
      image_namespace:
        description: 'GHCR namespace ghcr.io/<owner/repo> (from discovery)'
        type: string
        required: false
        default: ''
      droplet_name:
        type: string
        required: false
        default: app-prod
      droplet_size:
        type: string
        required: false
        default: s-1vcpu-1gb
      branch:
        type: string
        required: false
        default: main

jobs:
  provision:
    name: Provision droplet
    if: inputs.action == 'provision'
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 30
    env:
      DROPLET_NAME: ${{ inputs.droplet_name }}
      DROPLET_SIZE: ${{ inputs.droplet_size }}
    steps:
      # Engine lives in 12-apps/ci; this composite ships scripts/ephemeral/deploy-cloud-init.sh
      # so consumer repos never vendor it. Secrets pass as inputs (composites have no secrets ctx).
      - name: Create droplet + initial deploy
        uses: 12-apps/ci/.github/actions/do-provision@v2
        with:
          do_api_token: ${{ secrets.DO_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The same token the redeploy job below already requires, so provision
          # and redeploy now agree about where secrets come from. They did not:
          # provision baked a .env (and an OAuth secret) into cloud-init
          # user-data, and the first redeploy replaced that posture with this
          # one — the box was weakest exactly while it was newest.
          secrets_token: ${{ secrets.DOPPLER_TOKEN }}
          image_tag: ${{ inputs.image_tag }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}.git
          droplet_name: ${{ inputs.droplet_name }}
          droplet_size: ${{ inputs.droplet_size }}
          branch: ${{ inputs.branch }}
      - name: Resolve IP and print next step
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          IP=$(curl -sk "https://api.digitalocean.com/v2/droplets?name=$DROPLET_NAME" \
            -H "Authorization: Bearer $DO_API_TOKEN" \
            | jq -r '.droplets[0].networks.v4[] | select(.type=="public") | .ip_address' | head -1)
          {
            echo "## Droplet provisioned 🚀"
            echo ""
            echo "**IP:** \`$IP\`  (cloud-init is bringing the stack up — allow a few min)"
            echo ""
            echo "Set repo Variable **DEPLOY_HOST = $IP** so push-to-main deploys target it."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Redeploy
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 45
    # A superseded deploy still SUCCEEDS as a job (it correctly did nothing), so
    # `needs.deploy.result` cannot distinguish "deployed" from "skipped".
    # Downstream consumers must read this output instead.
    outputs:
      superseded: ${{ steps.supersede.outputs.skip }}
    steps:
      # Supersede check — SKIP (not cancel) a deploy that is already obsolete.
      #
      # cd.yml serializes deploys (`cancel-in-progress: false`, deliberately —
      # cancelling mid-`docker compose up` has no rollback). So merging A then B
      # deploys A in full, then immediately overwrites it with B: A's 234s is pure
      # waste. Because a deploy only starts after its build finishes (~2 min), by
      # then B is usually already main's tip — so asking "am I still the tip?"
      # here, BEFORE touching the droplet, reclaims that whole run.
      #
      # Skipping is safe in a way cancelling is not: nothing has been mutated yet.
      # It also removes a live inconsistency — the remote script does
      # `git reset --hard origin/main` for the compose file while pinning images to
      # `github.sha`, so a superseded deploy ran B's compose against A's images.
      #
      # Push only. A workflow_dispatch deploy is an explicit human act (a rollback
      # or a re-deploy of a known sha) and must never be second-guessed.
      - name: Supersede check — is this still the branch tip?
        id: supersede
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          tip=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            | jq -r '.sha') || tip=""
          # Fail OPEN: an unreadable tip must deploy, never silently skip. A
          # missed deploy is the one outcome worse than a redundant one.
          if [ -z "$tip" ] || [ "$tip" = "null" ]; then
            echo "::warning::could not resolve $GITHUB_REF_NAME tip — deploying anyway"
            exit 0
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::superseded — $GITHUB_REF_NAME is now at ${tip:0:7}, this run is ${GITHUB_SHA:0:7}. Skipping; that commit's own deploy will ship it."
            {
              echo "## Deploy skipped — superseded ⏭️"
              echo ""
              echo "\`$GITHUB_REF_NAME\` advanced to \`${tip:0:7}\` while this run (\`${GITHUB_SHA:0:7}\`) was building."
              echo "Deploying it would be immediately overwritten, so the droplet was left untouched."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guard — DEPLOY_HOST must be set
        if: steps.supersede.outputs.skip != 'true'
        run: |
          if [ -z "${{ vars.DEPLOY_HOST }}" ]; then
            echo "::error::DEPLOY_HOST variable is not set. Run cd.yml with action=provision (target=digitalocean) first, then add the DEPLOY_HOST repo variable."
            exit 1
          fi
      - name: Setup SSH key
        if: steps.supersede.outputs.skip != 'true'
        run: |
          echo "${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}" | tr -d ' \n\r\t' | base64 -d > /tmp/do_key
          chmod 600 /tmp/do_key
      - name: Pull prebuilt images and (re)start over SSH
        if: steps.supersede.outputs.skip != 'true'
        run: |
          ssh -i /tmp/do_key -o StrictHostKeyChecking=no -o LogLevel=ERROR \
            root@${{ vars.DEPLOY_HOST }} 'bash -s' -- \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.actor }}" \
            "${{ inputs.image_tag }}" \
            "${{ inputs.image_namespace }}" \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "${{ secrets.DOPPLER_TOKEN }}" <<'REMOTE'
          set -euo pipefail
          # DOPPLER_TOKEN is the only optional trailing arg (ssh drops it if unset
          # → default-expand). Every secret comes from the Doppler config, so no
          # other credential needs to be passed to the box.
          GH_TOKEN="$1"; GH_ACTOR="$2"; IMAGE_TAG="$3"; IMAGE_NS="${4:-}"; REPO_HTTPS="$5"; DOPPLER_TOKEN="${6:-}"
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is required — this adapter injects all secrets from the Doppler config." >&2
            exit 1
          fi

          # Reclaim disk FIRST — before git or docker write anything. The
          # persistent box accumulates superseded image tags + build cache, and a
          # full disk fails even git ("cannot write .git/config.lock"). Removes
          # unused images/containers/networks + build cache only; named volumes
          # (postgres_data) are preserved.
          docker system prune -af || true

          # x-access-token: prefix — GitHub Actions/App tokens (ghs_…) authenticate
          # as the username "x-access-token"; using the token as a bare username
          # makes git prompt for a password and fail non-interactively (exit 128).
          CLONE_URL=$(printf '%s' "$REPO_HTTPS" | sed "s|https://|https://x-access-token:${GH_TOKEN}@|")

          # The box no longer builds anything — it only needs the compose file and
          # nginx config, so shallow-sync the repo for those.
          if [ ! -d /app/.git ]; then
            git clone --depth 1 --branch main "$CLONE_URL" /app
          fi
          cd /app
          # Scrub the token from /app/.git/config on ANY exit — including a git
          # fetch/reset failure under `set -e`, which would otherwise leave the
          # token-embedded URL persisted. `rc=$?; … exit $rc` preserves the real
          # exit code so a failed deploy still fails the job.
          trap 'rc=$?; git remote set-url origin "$REPO_HTTPS" 2>/dev/null || true; exit $rc' EXIT
          git remote set-url origin "$CLONE_URL"
          git fetch --depth 1 origin main
          git reset --hard origin/main

          # Doppler is the single source of truth for secrets — they are injected
          # at container start by `doppler run`; NO secret-bearing .env is written.
          # /app/.env is (re)written with ONLY the non-secret per-deploy image pins
          # that docker compose reads for ${VAR} interpolation. POSTGRES_*/AUTH_*/
          # GOOGLE_*/PAGBANK_*/etc. all live in the Doppler config now.
          command -v doppler >/dev/null 2>&1 || curl -Ls https://cli.doppler.com/install.sh | sh
          export DOPPLER_TOKEN                 # doppler run reads it from the env
          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            [ -n "$IMAGE_NS" ] && echo "IMAGE_NAMESPACE=${IMAGE_NS}"
          } > /app/.env

          # Pull prebuilt images from GHCR (private) and run — no on-box build.
          # Secrets are injected into each invocation by `doppler run`.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          doppler run -- docker compose --profile tools pull
          # `< /dev/null` + `-T`: this whole script IS the stdin of `bash -s` over
          # ssh. Without its own stdin, `docker compose run` READS the rest of that
          # stdin — swallowing the `up`/`ps` lines below, so bash hits EOF and the
          # deploy silently ends before recreating anything. Redirect stdin so the
          # remaining commands actually run.
          doppler run -- docker compose run --rm -T migrate < /dev/null
          # Bring the new images live — OPT-IN zero-downtime, per consumer.
          #
          # A repo that wants a gapless deploy ships an executable
          # scripts/deploy/rollout.sh and this runs it instead of the blanket
          # recreate below; a repo that does not has no such file and nothing
          # changes for it. Same shape as the demo-seed opt-in further down: the
          # engine asks the consumer what it has rather than knowing anything
          # about any particular consumer.
          #
          # Why the fallback is not good enough to be the only path:
          # --force-recreate rebuilds EVERY service in the compose file, not just
          # the ones whose image moved. That includes the database, and it
          # includes the reverse proxy — so for the length of the recreate there
          # is no listener on :80/:443 at all and clients get connection refused
          # rather than a proxy error they could retry through. It stays as the
          # default only because it is the behaviour every existing consumer is
          # already running; a rollout script is strictly better where one exists.
          #
          # The script owns its own health gating and rollback, so a failure here
          # means it could not get the new code live — and it fails the deploy
          # with the old containers left serving.
          if [ -x scripts/deploy/rollout.sh ]; then
            echo "Consumer provides scripts/deploy/rollout.sh — using zero-downtime rollout"
            doppler run -- bash scripts/deploy/rollout.sh
          else
            # --force-recreate: a plain `up` can leave the old container running when
            # only the image tag changed (observed: new image pulled + resolved, but
            # the container stayed on the prior SHA). Force it so the new image
            # actually goes live. --remove-orphans drops services removed from the
            # compose file (e.g. the retired redis).
            doppler run -- docker compose up -d --no-build --force-recreate --remove-orphans
          fi
          docker compose ps

          # Demo/e2e fixture reset — OPT-IN per consumer.
          #
          # A repo that wants disposable fixture data rebuilt on every deploy
          # defines a one-shot `demo-seed` service in its compose file; a repo
          # that does not simply has no such service and this is a no-op. The
          # engine stays generic either way — it asks the compose file whether
          # the service exists rather than knowing anything about the consumer.
          #
          # AFTER `up`, deliberately. The fixture reset is not part of getting
          # the new code live: running it before `up` would let a failing seed
          # strand the deploy with the old containers still serving.
          #
          # Non-fatal, but LOUD. A broken fixture is not a broken deployment —
          # the app is already up and healthy at this point, and failing here
          # would report a good release as a bad one. The `::error::` annotation
          # surfaces it on the run, and post-cd's e2e goes red against the stale
          # data anyway, so nothing is actually swallowed.
          # HARD TIMEOUT, and it is not decorative. The first production run of
          # this step wrote thousands of rows against a 1-vCPU box, held this
          # SSH session for 2h12m, and died on a broken pipe (exit 255) — which
          # failed a deploy whose containers were already live and healthy. The
          # deploy is not the fixture's babysitter: it gives the reset a bounded
          # budget and moves on. A reset killed mid-way is repaired by the next
          # run, since the consumer's reset rebuilds from scratch by design.
          if doppler run -- docker compose --profile tools config --services 2>/dev/null | grep -qx demo-seed; then
            budget="${DEMO_SEED_TIMEOUT:-900}"
            echo "Resetting demo stores (budget: ${budget}s)..."
            # `|| rc=$?` rather than testing $? in an elif: under `set -e` the
            # status of an if-condition is easy to lose, and 124 (timeout's
            # kill) must stay distinguishable from the seed's own failure.
            rc=0
            timeout "$budget" doppler run -- docker compose run --rm -T demo-seed < /dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Demo stores reset."
            elif [ "$rc" -eq 124 ]; then
              echo "::error::demo-seed exceeded its ${budget}s budget and was killed. The deployment is live; its demo/e2e fixture data may be partial."
            else
              echo "::error::demo-seed failed (exit ${rc}) — the deployment is live, but its demo/e2e fixture data is stale."
            fi
          fi
          REMOTE
      - name: Summary
        if: steps.supersede.outputs.skip != 'true'
        run: |
          {
            echo "## Redeployed ✅"
            echo ""
            echo "**Image tag:** \`${{ inputs.image_tag }}\`"
            echo "**URL:** http://${{ vars.DEPLOY_HOST }}/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Smoke/integration/e2e against the live droplet (parity with the Cloudflare
  # adapter). post-cd.yml's WEB_URL/API_URL must point at the droplet for the
  # checks to run; otherwise they no-op on the placeholder URLs.
  trigger-post-cd:
    name: Trigger Post-CD
    needs: deploy
    # createWorkflowDispatch needs actions:write; the caller (cd.yml) grants it.
    permissions:
      contents: read
      actions: write
    # A superseded deploy left the droplet untouched, so there is nothing new to
    # smoke — and the superseding commit's own run will do it. Without this the
    # skip would still pay for a post-cd dispatch plus a full e2e pass against
    # whatever happens to be live, which is the waste this was meant to remove.
    if: needs.deploy.result == 'success' && needs.deploy.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    steps:
      - name: Trigger post-cd workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'post-cd.yml',
              ref: context.ref,
              inputs: {
                deployment_sha: context.sha
              }
            })

  destroy:
    name: Destroy droplet
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    env:
      DROPLET_NAME: ${{ inputs.droplet_name }}
    steps:
      - name: Delete droplet by name
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: |
          ID=$(curl -sk "https://api.digitalocean.com/v2/droplets?name=$DROPLET_NAME" \
            -H "Authorization: Bearer $DO_API_TOKEN" | jq -r '.droplets[0].id // empty')
          if [ -z "$ID" ]; then
            echo "No droplet named $DROPLET_NAME found"; exit 0
          fi
          curl -sk -X DELETE "https://api.digitalocean.com/v2/droplets/$ID" \
            -H "Authorization: Bearer $DO_API_TOKEN"
          echo "## Destroyed droplet $ID 🗑️" >> "$GITHUB_STEP_SUMMARY"
