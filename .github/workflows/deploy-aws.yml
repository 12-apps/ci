name: Deploy · AWS

# Consumes a prebuilt ECR digest. The consumer owns source build, image publishing,
# infrastructure template and secret population. OFF unless explicitly enabled.
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: deploy
      engine_ref:
        description: Pin the same tested 12-apps/ci commit used by this reusable workflow
        type: string
        required: true
      region:
        type: string
        required: true
      expected_account:
        type: string
        required: true
      role_arn:
        description: OIDC role scoped to the consumer repository/environment and selected stack
        type: string
        required: true
      stack:
        type: string
        required: true
      image:
        type: string
        default: ''
      template:
        type: string
        default: ''
      parameters:
        type: string
        default: ''
      container:
        type: string
        default: application
      mount:
        type: string
        default: /srv/application/data
      destination:
        type: string
        default: /var/lib/application
      ready_file:
        type: string
        default: /var/lib/12-apps-controller-ready
      port:
        type: string
        default: '8787'
      health:
        type: string
        default: /readyz
      timeout:
        type: string
        default: '180'
      environment:
        type: string
        default: production
      post_cd_workflow:
        description: Optional consumer workflow_dispatch workflow after a successful deployment
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    if: vars.ENABLE_DEPLOY_AWS == 'true'
    # Pinned to GitHub's image, NOT `vars.CI_RUNNER`: scripts/deploy/aws.mjs
    # shells out to the `aws` CLI that ubuntu-latest ships preinstalled, and the
    # runner-host image has none. See runner-selection.test.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-aws-${{ inputs.expected_account }}-${{ inputs.region }}-${{ inputs.stack }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require an immutable deployment-engine pin
        shell: bash
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
        run: |
          if [[ ! "$ENGINE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'engine_ref must be the tested 40-character engine commit SHA.' >&2
            exit 1
          fi
      - name: Check out the pinned public deployment engine
        uses: actions/checkout@v4
        with:
          repository: 12-apps/ci
          ref: ${{ inputs.engine_ref }}
          path: .ci-engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate with a scoped AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.region }}
          role-to-assume: ${{ inputs.role_arn }}
          allowed-account-ids: ${{ inputs.expected_account }}
          role-session-name: ci-immutable-deploy
      # The engine was explicitly checked out above. Do not use a relative
      # action: reusable workflows resolve those against the consumer's tree.
      - name: Operate on the selected stack using the pinned engine
        shell: bash
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          DEPLOY_REGION: ${{ inputs.region }}
          DEPLOY_ACCOUNT: ${{ inputs.expected_account }}
          DEPLOY_STACK: ${{ inputs.stack }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          DEPLOY_TEMPLATE: ${{ inputs.template }}
          DEPLOY_PARAMETERS: ${{ inputs.parameters }}
          DEPLOY_CONTAINER: ${{ inputs.container }}
          DEPLOY_MOUNT: ${{ inputs.mount }}
          DEPLOY_DESTINATION: ${{ inputs.destination }}
          DEPLOY_READY_FILE: ${{ inputs.ready_file }}
          DEPLOY_PORT: ${{ inputs.port }}
          DEPLOY_HEALTH: ${{ inputs.health }}
          DEPLOY_TIMEOUT: ${{ inputs.timeout }}
        run: bash .ci-engine/scripts/deploy/aws-entrypoint.sh
  post-cd:
    needs: deploy
    if: needs.deploy.result == 'success' && inputs.action == 'deploy' && inputs.post_cd_workflow != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        env:
          POST_CD_WORKFLOW: ${{ inputs.post_cd_workflow }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: process.env.POST_CD_WORKFLOW, ref: context.ref
            });
