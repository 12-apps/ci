name: Detect Changes (reusable)

# Generic path-based change detection. The caller declares its OWN categories —
# this workflow knows nothing about any repo's layout:
#
#   jobs:
#     changes:
#       permissions:
#         contents: read
#         pull-requests: read     # REQUIRED — see the permissions note below
#       uses: 12-apps/ci/.github/workflows/detect-changes.yml@v2
#       with:
#         path-filters: |
#           web:
#             - 'apps/web/**'
#           docs:
#             - '**/*.md'
#
#     unit-tests:
#       needs: changes
#       if: fromJSON(needs.changes.outputs.changes).web
#       ...
#
# BEFORE YOU ADD THIS JOB, read "When NOT to use this" in the README. If your
# repo already calls `monorepo-static.yml`, declare the categories there via
# `extra-filters` instead — that tier already runs a Detect Changes job, and a
# second one costs a whole billed minute on every push for ~6s of work.

on:
  workflow_call:
    inputs:
      path-filters:
        description: >-
          REQUIRED. The filter spec, as YAML or JSON. Each top-level key is a
          category name; its value is a list of globs. YAML top-level keys MUST
          be UNINDENTED (at column 0) — that is how the category names are
          discovered for the `changes` map and for `force-all`. An indented
          block declares no names and fails the job loudly rather than silently
          reporting every category false.
        type: string
        required: true
      force-all:
        description: >-
          Report EVERY declared category as true without diffing. Wire this to
          the events where selection must not apply — typically the post-merge
          full-suite safety net, by passing an expression that is true on push
          (see the README example; it cannot be spelled out here, because an
          expression written in an input DESCRIPTION is evaluated at parse time
          and invalidates the workflow for every caller). Incremental PR-time
          selection is only safe to trust when something still runs the whole
          suite.
        type: boolean
        required: false
        default: false
      base:
        description: >-
          Git ref the diff is taken against. Empty (default) lets the filter pick:
          the PR base for `pull_request`, the before-sha for `push`. Takes
          precedence over `stack-aware`.
        type: string
        required: false
        default: ''
      stack-aware:
        description: >-
          On a STACKED pull request, diff against the stack's base instead of
          this pull request's immediate base. Off by default.

          Mid-stack, a pull request's base is the branch BELOW it, so the default
          diff sees only that one layer. A layer that changes package B on top of
          a layer that changed package A reports only B — and A's suites get
          skipped even though the merged result contains both. Diffing against
          the stack base reports what the whole stack touches, which is what
          "should this suite run" actually depends on.

          Costs a full-history checkout on stacked pull requests (the filter has
          to resolve a sha locally rather than reading the PR's file list from the
          API), so `fetch-depth` is forced to 0 for those runs.

          No effect when the pull request is not in a stack, or on other events —
          the metadata this reads only exists on stacked pull requests, so the
          behaviour is unchanged everywhere else. Off by default because GitHub
          ships stacked pull requests as a PUBLIC PREVIEW "subject to change",
          and this repo hands workflows to consumers on a moving major tag.
        type: boolean
        required: false
        default: false
      fetch-depth:
        description: >-
          Checkout depth. 0 (full history) is only needed when `base` names a ref
          that must be resolved locally; the default costs nothing on PRs, where
          the filter uses the API rather than a local diff.
        type: number
        required: false
        default: 1
    outputs:
      changes:
        description: >-
          JSON object mapping every DECLARED category to a JSON boolean, e.g.
          {"web":true,"docs":false}. Use it directly in a job `if:` —
          `if: fromJSON(needs.changes.outputs.changes).web` — with no string
          comparison, since the values are real booleans.
        value: ${{ jobs.detect.outputs.changes }}
      matched:
        description: >-
          JSON array of the category names that matched, e.g. ["web"]. The same
          information as `changes`, in the shape `contains()` wants:
          `if: contains(fromJSON(needs.changes.outputs.matched), 'web')`.
        value: ${{ jobs.detect.outputs.matched }}
      any:
        description: >-
          'true' when at least one category matched. A cheap top-level guard for
          "does this diff touch anything this pipeline cares about at all?".
        value: ${{ jobs.detect.outputs.any }}

# Least-privilege, enforced at the source. pull-requests: read is what
# dorny/paths-filter uses to read a PR's file list without a local diff.
#
# THE CALLER MUST GRANT BOTH. A called workflow may not request more than its
# caller grants, so a caller job whose effective permissions are narrower than
# this — including one that simply inherits a workflow-level `contents: read` —
# does not fail gracefully: GitHub rejects the ENTIRE RUN at startup, with no
# jobs, no logs and no annotation naming the missing scope. Declare it on the
# calling job:
#
#   permissions:
#     contents: read
#     pull-requests: read
permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Bound so a HANG fails in minutes instead of running to
    # GitHub's six-hour default; see job-timeouts.test.mjs.
    timeout-minutes: 10
    outputs:
      changes: ${{ steps.assemble.outputs.changes }}
      matched: ${{ steps.assemble.outputs.matched }}
      any: ${{ steps.assemble.outputs.any }}
    steps:
      # The declared category NAMES are needed whether or not a diff is taken:
      # `force-all` reports all of them, and `changes` must carry a key for every
      # category (a caller's `if:` reading an absent key gets `null`, which is
      # falsy — a silent skip instead of a loud failure). Parsed from the input
      # itself so the caller declares its categories exactly once.
      - name: Parse declared categories
        id: names
        shell: bash
        env:
          FILTERS: ${{ inputs.path-filters }}
        run: |
          set -euo pipefail
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const raw = process.env.FILTERS ?? "";
          if (!raw.trim()) {
            console.error("::error::path-filters is empty — declare at least one category.");
            process.exit(1);
          }
          let names;
          if (raw.trimStart().startsWith("{")) {
            // JSON spec: the keys are the categories, no ambiguity.
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (e) {
              console.error(`::error::path-filters looks like JSON but does not parse: ${e.message}`);
              process.exit(1);
            }
            if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
              console.error("::error::path-filters JSON must be an object of category -> globs.");
              process.exit(1);
            }
            names = Object.keys(parsed);
          } else {
            // YAML spec: top-level keys are the ones at column 0. This is the
            // same convention monorepo-static.yml's `extra-filters` uses, and it
            // is why the input must be UNINDENTED — an indented block yields
            // zero names and fails right here instead of quietly reporting
            // every category false and skipping the whole pipeline.
            names = raw
              .split("\n")
              .map((l) => l.replace(/\s+$/, ""))
              .filter((l) => l && !/^\s/.test(l) && !l.startsWith("#"))
              .map((l) => {
                const m = /^([A-Za-z0-9_.\-]+)\s*:/.exec(l);
                return m ? m[1] : null;
              })
              .filter(Boolean);
          }
          const unique = [...new Set(names)];
          if (unique.length === 0) {
            console.error(
              "::error::path-filters declared no categories. In YAML every category name must sit at column 0 (UNINDENTED) — an indented block declares none.",
            );
            process.exit(1);
          }
          console.log(`names=${JSON.stringify(unique)}`);
          console.error(`Declared categories: ${unique.join(", ")}`);
          EOF

      # Resolve the diff base BEFORE the checkout, since the checkout's own
      # condition and depth depend on the answer. Explicit `base` always wins;
      # the stack base is only consulted when the caller opted in AND the pull
      # request is actually in a stack. `stack` is absent on an unstacked pull
      # request and on every non-pull_request event, so this collapses to the
      # previous behaviour in all of those cases.
      - name: Resolve the diff base
        id: base
        if: ${{ !inputs.force-all }}
        shell: bash
        env:
          EXPLICIT: ${{ inputs.base }}
          STACK_BASE: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT" ]; then
            echo "value=$EXPLICIT"   >> "$GITHUB_OUTPUT"
            echo "from-stack=false"  >> "$GITHUB_OUTPUT"
            echo "Diffing against the caller's explicit base: $EXPLICIT"
          elif [ -n "$STACK_BASE" ]; then
            echo "value=$STACK_BASE" >> "$GITHUB_OUTPUT"
            echo "from-stack=true"   >> "$GITHUB_OUTPUT"
            echo "Stacked pull request — diffing against the stack base: $STACK_BASE"
          else
            echo "value="            >> "$GITHUB_OUTPUT"
            echo "from-stack=false"  >> "$GITHUB_OUTPUT"
            echo "Letting the filter pick the base (PR base, or the push before-sha)."
          fi

      - name: Checkout
        # A local checkout is only needed when the filter has to resolve a ref
        # itself. On `pull_request` dorny reads the PR's file list from the API,
        # so skipping the checkout there saves the clone on the most frequent
        # event — but `force-all` skips the filter entirely, so nothing is
        # needed then either.
        if: ${{ !inputs.force-all && (github.event_name != 'pull_request' || steps.base.outputs.value != '') }}
        uses: actions/checkout@v4
        with:
          # A stack base is a raw sha that only a local history can resolve, so
          # those runs need the full clone regardless of what the caller asked
          # for. Quoted '0' deliberately: GitHub expressions treat bare 0 as
          # falsy, so `... && 0 || inputs.fetch-depth` would silently always
          # yield the caller's depth and the resolve would fail on a shallow
          # clone — with a "bad object" error nothing here would explain.
          fetch-depth: ${{ steps.base.outputs.from-stack == 'true' && '0' || inputs.fetch-depth }}

      # ── Stacked pull requests take a different path, because dorny cannot ────
      # dorny/paths-filter honours `base` ONLY on push/workflow_dispatch. On a
      # pull_request it ignores the input entirely and reads the PR's file list
      # from the API, announcing it as:
      #
      #   'base' input parameter is ignored when action is triggered by pull
      #    request event
      #
      # That list is the pull request's OWN diff — mid-stack, the top layer
      # alone. So passing the stack base to dorny looks correct, logs correct,
      # and changes nothing. This was verified the hard way on a real stacked
      # pull request: the right sha went in and one layer's files came out.
      #
      # git does the globbing here instead of dorny. The categories' globs become
      # `:(glob)` pathspecs and git reports whether the stack-base..head diff
      # touches any of them. That needs no new dependency, which matters in a
      # repo that deliberately has none — and `:(glob)` handles `**` the way
      # these specs assume. It relies on the specs being POSITIVE globs only,
      # which is already a documented rule for both this input and
      # monorepo-static's (no `!` negations under predicate-quantifier: some).
      - name: Filter changed paths against the stack base
        id: stackfilter
        if: ${{ !inputs.force-all && steps.base.outputs.from-stack == 'true' }}
        shell: bash
        env:
          FILTERS: ${{ inputs.path-filters }}
          BASE: ${{ steps.base.outputs.value }}
        run: |
          set -euo pipefail

          # Spec -> one line per category: "name<TAB>glob<TAB>glob...". Same two
          # accepted shapes as the names step: JSON object, or YAML whose
          # top-level keys sit at column 0.
          spec="$(node <<'EOF'
          const raw = process.env.FILTERS ?? "";
          const out = [];
          if (raw.trimStart().startsWith("{")) {
            for (const [name, globs] of Object.entries(JSON.parse(raw))) {
              out.push([name, ...[].concat(globs)].join("\t"));
            }
          } else {
            let cur = null, globs = [];
            const flush = () => { if (cur) out.push([cur, ...globs].join("\t")); };
            for (const line of raw.split("\n")) {
              if (!line.trim() || line.trimStart().startsWith("#")) continue;
              const top = line.match(/^([A-Za-z0-9_.-]+):\s*(.*)$/);
              if (top) {
                flush();
                cur = top[1]; globs = [];
                const inline = top[2].trim();
                // Flow style on the same line: web: ['apps/web/**']
                if (inline.startsWith("[")) {
                  globs = JSON.parse(inline.replace(/'/g, '"'));
                }
                continue;
              }
              const item = line.match(/^\s*-\s*(.+?)\s*$/);
              if (item && cur) globs.push(item[1].replace(/^['"]|['"]$/g, ""));
            }
            flush();
          }
          console.log(out.join("\n"));
          EOF
          )"

          matched=()
          while IFS=$'\t' read -r -a row; do
            [ "${#row[@]}" -gt 1 ] || continue
            name="${row[0]}"
            pathspecs=()
            for g in "${row[@]:1}"; do pathspecs+=(":(glob)$g"); done
            # Three-dot: changes since the merge-base, which is what a reviewer
            # means by "what this stack changes" and what dorny uses too.
            if [ -n "$(git diff --name-only "${BASE}...HEAD" -- "${pathspecs[@]}")" ]; then
              matched+=("$name")
              echo "· $name matched"
            fi
          done <<<"$spec"

          printf '%s\n' "${matched[@]+"${matched[@]}"}" \
            | node -e "const l=require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean);console.log('changes='+JSON.stringify(l))" \
            >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        # Skipped on a stacked pull request — the step above did it with a base
        # dorny would have ignored.
        if: ${{ !inputs.force-all && steps.base.outputs.from-stack != 'true' }}
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ inputs.path-filters }}
          base: ${{ steps.base.outputs.value }}
          # A JSON array of the filter names that matched — the one output whose
          # shape does not depend on the caller's category names, so it is the
          # only one a generic workflow can forward.
          list-files: none

      # `force-all` is resolved HERE rather than by skipping the job, so the
      # outputs exist either way: a skipped job reports empty outputs, and every
      # downstream `if:` would silently evaluate false — the opposite of what
      # forcing means.
      - name: Assemble outputs
        id: assemble
        shell: bash
        env:
          NAMES: ${{ steps.names.outputs.names }}
          # Exactly one of these two ran (or neither, under force-all): the
          # stacked path when dorny could not be told the right base, the dorny
          # path otherwise. Both emit the same JSON-array-of-names shape.
          MATCHED: ${{ steps.stackfilter.outputs.changes || steps.filter.outputs.changes }}
          FORCE_ALL: ${{ inputs.force-all }}
        run: |
          set -euo pipefail
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const names = JSON.parse(process.env.NAMES);
          const force = process.env.FORCE_ALL === "true";
          // When the filter step is skipped its output is the empty string.
          const matched = force ? names : JSON.parse(process.env.MATCHED || "[]");
          const set = new Set(matched);
          // Real JSON booleans, not "true"/"false" strings, so a caller writes
          // `if: fromJSON(...).web` instead of `== 'true'`.
          const changes = Object.fromEntries(names.map((n) => [n, set.has(n)]));
          console.log(`changes=${JSON.stringify(changes)}`);
          console.log(`matched=${JSON.stringify([...set])}`);
          console.log(`any=${set.size > 0}`);
          console.error(force ? "force-all: every declared category reported true." : "");
          console.error(JSON.stringify(changes, null, 2));
          EOF
