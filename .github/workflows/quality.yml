name: Quality (reusable)

# Reusable static-quality + test-reliability gate. Consuming repos add a small caller:
#
#   jobs:
#     quality:
#       needs: changes
#       if: needs.changes.outputs.code == 'true'
#       uses: 12-apps/ci/.github/workflows/quality.yml@v1
#       with:
#         pre-e2e-command: pnpm --filter @repo/shared-helpers build
#       secrets: inherit
#
# Runs in the CALLER's checkout, so it uses the consumer repo's own
# eslint quality configs, scripts/, and `quality*` package.json scripts.
# The consumer must define these scripts: quality:complexity, quality:flakiness,
# quality:dup, quality:quarantine, quality:knip, test:e2e:reliability (see
# CONSUMING.md). The static gate is two eslint jobs — Complexity and Flakiness —
# plus a self-contained Quality Exceptions Ratchet job that enforces the
# `.quality-exceptions` burn-down (shrink-only + touch-must-fix).

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      run-knip:
        description: 'Run knip (unused files/exports/deps) as a blocking gate — the consumer supplies a shrink-only ratchet (quality:knip) so it only fails on NEW dead code.'
        type: boolean
        required: false
        default: true
      run-data-views:
        description: >-
          Run the DataViews backend-only gate: every admin list rendered with
          the shared DataViews panel must be server-driven (filter/sort/
          paginate/search at the backend). Opt-in — the consumer supplies a
          `quality:data-views` script plus a shrink-only exceptions file that
          grandfathers existing client-mode lists, so it only fails on NEW
          client-side lists or grandfathered ones that regressed.
        type: boolean
        required: false
        default: false
      run-e2e-reliability:
        description: 'Re-run changed e2e specs N times to flush flakes.'
        type: boolean
        required: false
        default: true
      run-affected-e2e:
        description: 'Run ONLY the e2e specs affected by the diff (needs a test:e2e:affected script + selector/manifest in the consumer). Opt-in.'
        type: boolean
        required: false
        default: false
      flakiness-targets:
        description: 'Lint targets for the central flakiness gate (space-separated, relative to the repo root). Ignored when the consumer defines its own quality:flakiness script.'
        type: string
        required: false
        default: '.'
      pre-e2e-command:
        description: 'Shell run before the e2e reliability gate (e.g. build shared packages). Empty to skip.'
        type: string
        required: false
        default: ''
      install-playwright:
        description: 'Install Playwright browsers before the reliability gate.'
        type: boolean
        required: false
        default: true
      e2e-repeat:
        description: 'Times to re-run each changed e2e spec (retries stay 0).'
        type: string
        required: false
        default: '3'
      nextjs-app-dirs:
        description: >-
          Comma-separated Next.js App Router roots (e.g. "apps/web/app") to
          enforce navigation-feedback coverage on: every route segment shipping a
          page.* must ship a sibling loading.*. Empty (default) skips the gate.
        type: string
        required: false
        default: ''
      loading-must-render:
        description: >-
          Optional component name every loading.* must reference (e.g. a shared
          RouteLoading spinner) so coverage cannot be satisfied by an empty
          placeholder file. Empty skips the content check.
        type: string
        required: false
        default: ''
      e2e-coverage-app-dirs:
        description: >-
          Comma-separated Next.js App Router roots (e.g. "apps/web/app") to
          enforce e2e page↔spec coverage on: every route segment shipping a
          page.* must have a co-located e2e spec (default suffix .e2e.ts) in its
          subtree, and every such spec must sit under a route segment. Pages
          grandfathered in the exceptions file are skipped. Empty (default)
          skips the gate.
        type: string
        required: false
        default: ''
      e2e-coverage-spec-suffix:
        description: 'Filename suffix marking a co-located e2e spec for the coverage gate.'
        type: string
        required: false
        default: '.e2e.ts'
      e2e-coverage-exempt-globs:
        description: >-
          Comma-separated filename substrings that exempt a co-located spec from
          the spec→page (no-orphan) check — cross-cutting specs that are not tied
          to a single page. Default covers journey and global specs.
        type: string
        required: false
        default: '.journey.,.global.'
      e2e-coverage-exceptions:
        description: >-
          Repo-root-relative path to a shrink-only JSON array of route-segment
          dirs grandfathered as having no e2e spec yet. The list may only shrink,
          and touching any file under a listed segment forces it to be de-listed
          (i.e. get a spec). A missing file means no grandfathering.
        type: string
        required: false
        default: '.e2e-coverage-exceptions.json'

# Least-privilege, enforced at the source: every job here only reads the repo.
# Capping permissions at the workflow level means a consumer that grants more in
# a combined CI file (e.g. packages: write, actions: write) cannot leak that
# privilege into this reusable workflow — the effective grant is the intersection.
permissions:
  contents: read

jobs:
  # The static-quality gate is split into two independent jobs so each surfaces
  # as its own status check: COMPLEXITY (size/cyclomatic/cognitive/nested-loop on
  # first-party source — also runs on the consumer's pre-commit) and FLAKINESS
  # (tiered anti-flake lint on tests/specs/stories). The consumer must define the
  # matching quality:complexity + quality:flakiness scripts (see CONSUMING.md).
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Complexity gate (size/complexity on source)
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:complexity 2>&1 | tee complexity.log

  # The anti-flake ruleset + baseline runner + eslint toolchain live ONLY in
  # 12-apps/ci (the `flakiness-lint` composite action). This job uses that
  # central action by default, so updating the rules here reaches every consumer
  # on its next CI run — the consumer keeps only its repo-specific
  # eslint-suppressions.json baseline, not the config/runner/devDeps.
  #
  # Back-compat: a consumer that still defines its own `quality:flakiness` script
  # keeps running that (legacy path) until it migrates by deleting the script.
  flakiness:
    name: Flakiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the central runner diffs the branch against its base to
          # revoke a touched file's baseline exemption (touched files must be clean).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Detect flakiness gate source
        id: src
        shell: bash
        run: |
          set -o pipefail
          if node -e "const s=(require('./package.json').scripts||{});process.exit(s['quality:flakiness']?0:1)" 2>/dev/null; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
          else
            echo "mode=central" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies (legacy consumer gate)
        if: steps.src.outputs.mode == 'legacy'
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Flakiness gate (legacy consumer script)
        if: steps.src.outputs.mode == 'legacy'
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:flakiness 2>&1 | tee flakiness.log
      - name: Fetch base ref (central gate diffs against it)
        if: steps.src.outputs.mode == 'central'
        shell: bash
        run: git fetch --no-tags origin "${GITHUB_BASE_REF:-main}"
      - name: Flakiness gate (central 12-apps/ci ruleset)
        if: steps.src.outputs.mode == 'central'
        uses: 12-apps/ci/.github/actions/flakiness-lint@v1
        with:
          node-version: ${{ inputs.node-version }}
          targets: ${{ inputs.flakiness-targets }}

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Copy-paste detection (jscpd)
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:dup 2>&1 | tee jscpd.log

  quarantine:
    name: Flaky Quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Validate flaky-quarantine.json
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:quarantine 2>&1 | tee quarantine.log

  knip:
    name: Knip
    if: ${{ inputs.run-knip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Unused files/exports/deps (knip)
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:knip 2>&1 | tee knip.log

  # DataViews backend-only ratchet (opt-in): lists rendered with the shared
  # DataViews panel must be server-driven. Client-mode consumers are
  # grandfathered in the repo's exceptions file and the list can only shrink —
  # a new client-side list, or a grandfathered one that regressed, fails here.
  data-views:
    name: DataViews Gate
    if: ${{ inputs.run-data-views }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: DataViews backend-only gate
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:data-views 2>&1 | tee data-views-gate.log

  # Enforce the `.quality-exceptions` burn-down policy on every PR:
  #   (A) shrink-only — the file may LOSE lines, never gain them, so a new file
  #       can never be grandfathered (fix it instead of listing it);
  #   (B) touch-must-fix — a changed file that is STILL listed must be removed
  #       from the list, at which point the complexity/flakiness gate makes its
  #       findings hard errors. So you cannot touch a grandfathered file and
  #       leave it grandfathered.
  # Self-contained (pure git + bash); needs no consumer script. No-ops when the
  # repo has no `.quality-exceptions` file.
  exceptions-ratchet:
    name: Quality Exceptions Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff the branch against its base.
          fetch-depth: 0
      - name: Enforce .quality-exceptions burn-down (shrink-only + touch-must-fix)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          if [ ! -f .quality-exceptions ]; then
            echo "No .quality-exceptions file — nothing to enforce."
            exit 0
          fi
          # Fail-fast on the diff baseline (never masked): we must have the base.
          git fetch --no-tags origin "$BASE_REF"
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)" || {
            echo "::error::Could not compute merge-base with origin/$BASE_REF"
            exit 1
          }

          fail=0

          # (A) Shrink-only: any ADDED non-comment line in .quality-exceptions is a
          # new grandfather entry — forbidden.
          added="$(
            git diff "$merge_base" HEAD -- .quality-exceptions \
              | grep -E '^\+' | grep -vE '^\+\+\+' | sed -E 's/^\+//' \
              | sed -E 's/[[:space:]]+$//' | grep -vE '^\s*(#|$)' || true
          )"
          if [ -n "$added" ]; then
            echo "::error::.quality-exceptions may only shrink, never grow. Lines ADDED:"
            printf '%s\n' "$added" | sed 's/^/  + /'
            echo "You cannot grandfather a file — fix its issues instead of listing it."
            fail=1
          fi

          # (B) Touch-must-fix: a changed file that is still listed must be
          # de-listed (removing its line makes the eslint gate enforce its fixes).
          # Use --name-status -M (not --name-only) so a RENAMED or DELETED
          # grandfathered file is caught too: .quality-exceptions holds the OLD
          # path, but --name-only reports only a rename's NEW path — so the old
          # listed path would never match and the gate would silently pass,
          # leaving the file grandfathered. Here we check BOTH sides of a rename
          # (old + new) and the path of a delete.
          listed_now="$(grep -vE '^\s*(#|$)' .quality-exceptions | sed -E 's/[[:space:]]+$//')"
          offenders=""
          while IFS=$'\t' read -r status p1 p2; do
            [ -z "$status" ] && continue
            case "$status" in
              C*) involved="$p2" ;;            # copy: only the new file is new work
              R*) involved="$p1"$'\n'"$p2" ;;  # rename: BOTH old (source) and new
              *)  involved="$p1" ;;            # A / M / D: the single path
            esac
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if printf '%s\n' "$listed_now" | grep -qxF "$f"; then
                offenders="$offenders$f"$'\n'
              fi
            done <<< "$involved"
          done < <(git diff --name-status -M --diff-filter=ACMRD "$merge_base" HEAD)
          offenders="$(printf '%s' "$offenders" | grep -vE '^[[:space:]]*$' | sort -u || true)"
          if [ -n "$offenders" ]; then
            echo "::error::You changed files still grandfathered in .quality-exceptions (a rename or delete counts as touching):"
            printf '%s\n' "$offenders" | sed 's/^/  - /'
            echo "Policy: a touched file must be removed from .quality-exceptions AND have"
            echo "all its complexity/flakiness issues fixed. For a rename, remove the OLD"
            echo "path's line and clean up the new file; for a delete, remove the stale line."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ .quality-exceptions ratchet OK (shrink-only; no touched file left grandfathered)."

  # In the Next.js App Router, a route segment that ships a page.* without a
  # loading.* renders NOTHING while the segment streams (prod) or compiles on
  # demand (dev) — the user stares at a frozen screen. This gate enforces that
  # every page has instant loading feedback. No install needed: it only walks
  # the checkout. Opt in with nextjs-app-dirs; optionally require each
  # loading.* to reference a shared spinner via loading-must-render (an
  # existence-only check could be satisfied by an empty placeholder).
  nextjs-loading:
    name: Next.js Loading Coverage
    if: ${{ inputs.nextjs-app-dirs != '' }}
    runs-on: ubuntu-latest
    env:
      APP_DIRS: ${{ inputs.nextjs-app-dirs }}
      MUST_RENDER: ${{ inputs.loading-must-render }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Enforce page.* ↔ loading.* coverage
        shell: bash
        run: |
          set -o pipefail
          node <<'EOF'
          const { readdirSync, readFileSync } = require("node:fs");
          const { join } = require("node:path");
          const PAGE = /^page\.(js|jsx|ts|tsx)$/;
          const LOADING = /^loading\.(js|jsx|ts|tsx)$/;
          // api/ segments have no UI; node_modules is never a route. (_private
          // and dot folders are excluded separately in the directory loop.)
          const SKIP = new Set(["api", "node_modules"]);
          // Comma-only: paths may contain spaces, so comma is the separator.
          const roots = process.env.APP_DIRS.split(",").map((r) => r.trim()).filter(Boolean);
          const mustRender = process.env.MUST_RENDER || "";
          const failures = [];
          let pages = 0;
          function walk(dir) {
            let entries;
            try {
              entries = readdirSync(dir, { withFileTypes: true });
            } catch {
              failures.push(`${dir}: unreadable — check the nextjs-app-dirs input`);
              return;
            }
            const files = entries.filter((e) => e.isFile()).map((e) => e.name);
            const page = files.find((f) => PAGE.test(f));
            if (page) {
              pages += 1;
              const loading = files.find((f) => LOADING.test(f));
              if (!loading) {
                failures.push(
                  `${join(dir, page)}: no sibling loading.* — this segment renders nothing while it streams/compiles`,
                );
              } else if (
                mustRender &&
                !readFileSync(join(dir, loading), "utf8").includes(mustRender)
              ) {
                failures.push(`${join(dir, loading)}: does not reference ${mustRender}`);
              }
            }
            for (const e of entries) {
              if (!e.isDirectory()) continue;
              if (SKIP.has(e.name) || e.name.startsWith("_") || e.name.startsWith(".")) continue;
              walk(join(dir, e.name));
            }
          }
          roots.forEach(walk);
          // Flush failures before the zero-pages exit so unreadable-directory
          // diagnostics are not swallowed by the generic "no page.*" error.
          for (const f of failures) console.error(`::error::${f}`);
          if (pages === 0) {
            // Zero pages means the input points at the wrong place — fail loud
            // rather than green-lighting a gate that inspected nothing.
            console.error(`::error::no page.* found under: ${roots.join(" ")} — check nextjs-app-dirs`);
            process.exit(1);
          }
          if (failures.length > 0) {
            console.error(
              `${failures.length} of ${pages} route segment(s) lack loading feedback. ` +
                "Add a loading.tsx beside each page" +
                (mustRender ? ` rendering ${mustRender}.` : "."),
            );
            process.exit(1);
          }
          console.log(`OK: ${pages} route segment(s) covered by loading.* under: ${roots.join(" ")}`);
          EOF

  # E2E page↔spec coverage (opt-in): every route segment shipping a page.* must
  # have a co-located e2e spec (default *.e2e.ts) in its subtree, and every such
  # spec must sit under a route segment (cross-cutting journey/global specs are
  # exempt). Pages with no spec yet are grandfathered in a shrink-only exceptions
  # file: the list may only lose entries, and touching any file under a listed
  # segment forces that segment to be de-listed (i.e. get a spec). No install
  # needed — it walks the checkout + diffs against the base.
  e2e-coverage:
    name: E2E Coverage
    if: ${{ inputs.e2e-coverage-app-dirs != '' }}
    runs-on: ubuntu-latest
    env:
      APP_DIRS: ${{ inputs.e2e-coverage-app-dirs }}
      SPEC_SUFFIX: ${{ inputs.e2e-coverage-spec-suffix }}
      EXEMPT: ${{ inputs.e2e-coverage-exempt-globs }}
      EXCEPTIONS_FILE: ${{ inputs.e2e-coverage-exceptions }}
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ratchet can diff the exceptions file vs base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Enforce page.* ↔ e2e spec coverage
        shell: bash
        run: |
          set -o pipefail
          node <<'EOF'
          const { readdirSync, readFileSync, existsSync } = require("node:fs");
          const { join, dirname } = require("node:path");
          const PAGE = /^page\.(js|jsx|ts|tsx)$/;
          const SKIP = new Set(["api", "node_modules"]);
          const norm = (p) => p.replace(/\/+$/, "");
          const under = (p, base) => p === base || p.startsWith(norm(base) + "/");
          const roots = process.env.APP_DIRS.split(",").map((r) => r.trim()).filter(Boolean);
          const SUFFIX = process.env.SPEC_SUFFIX || ".e2e.ts";
          const EXEMPT = (process.env.EXEMPT || "").split(",").map((s) => s.trim()).filter(Boolean);
          const exFile = process.env.EXCEPTIONS_FILE || "";

          let exceptions = [];
          if (exFile && existsSync(exFile)) {
            try {
              exceptions = JSON.parse(readFileSync(exFile, "utf8"));
            } catch (e) {
              console.error(`::error::${exFile} is not valid JSON: ${e.message}`);
              process.exit(1);
            }
            if (!Array.isArray(exceptions)) {
              console.error(`::error::${exFile} must be a JSON array of route-segment dirs`);
              process.exit(1);
            }
          }
          const exSet = new Set(exceptions.map(norm));

          const pageDirs = [];
          const specFiles = [];
          let traversalFailed = false;
          function walk(dir) {
            let entries;
            try {
              entries = readdirSync(dir, { withFileTypes: true });
            } catch {
              console.error(`::error::${dir}: unreadable — check e2e-coverage-app-dirs`);
              traversalFailed = true;
              return;
            }
            const files = entries.filter((e) => e.isFile()).map((e) => e.name);
            if (files.some((f) => PAGE.test(f))) pageDirs.push(norm(dir));
            for (const f of files) if (f.endsWith(SUFFIX)) specFiles.push(join(dir, f));
            for (const e of entries) {
              if (!e.isDirectory()) continue;
              if (SKIP.has(e.name) || e.name.startsWith("_") || e.name.startsWith(".")) continue;
              walk(join(dir, e.name));
            }
          }
          roots.forEach(walk);

          // A single unreadable root must fail the gate even when other roots
          // contain pages — otherwise that tree ships with no coverage enforced.
          if (traversalFailed) {
            console.error("::error::one or more e2e-coverage-app-dirs roots were unreadable (see above) — refusing to pass with an un-scanned tree.");
            process.exit(1);
          }

          if (pageDirs.length === 0) {
            console.error(`::error::no page.* found under: ${roots.join(", ")} — check e2e-coverage-app-dirs`);
            process.exit(1);
          }

          const pageDirSet = new Set(pageDirs);
          const isCovered = (pd) => specFiles.some((sf) => under(sf, pd));
          const failures = [];

          // (1) page → spec: every page has a co-located spec, unless grandfathered.
          for (const pd of pageDirs) {
            if (isCovered(pd) || exSet.has(pd)) continue;
            failures.push(`${pd}: page.* has no ${SUFFIX} spec in its subtree — add one, or grandfather it in ${exFile}`);
          }

          // (2) exceptions must stay honest: a listed dir that no longer exists as
          // a page, or that now HAS a spec, must be removed (drives the shrink).
          for (const ex of exSet) {
            if (!pageDirSet.has(ex)) {
              failures.push(`${exFile}: "${ex}" is not a route segment with a page.* — remove it`);
            } else if (isCovered(ex)) {
              failures.push(`${exFile}: "${ex}" now has a ${SUFFIX} spec — remove it (the list only shrinks)`);
            }
          }

          // (3) spec → page: no orphan specs (journey/global specs are exempt).
          const isExempt = (f) => EXEMPT.some((x) => f.includes(x));
          const hasAncestorPage = (dir) => {
            let d = norm(dir);
            while (roots.some((r) => under(d, r))) {
              if (pageDirSet.has(d)) return true;
              const parent = norm(dirname(d));
              if (parent === d) break;
              d = parent;
            }
            return false;
          };
          for (const sf of specFiles) {
            if (isExempt(sf)) continue;
            if (!hasAncestorPage(dirname(sf))) {
              failures.push(`${sf}: e2e spec is not under any route segment (no page.* at or above it) — tie it to a page, or mark it ${EXEMPT.join("/") || "exempt"}`);
            }
          }

          for (const f of failures) console.error(`::error::${f}`);
          if (failures.length > 0) {
            console.error(`${failures.length} e2e page↔spec coverage problem(s).`);
            process.exit(1);
          }
          console.log(`OK: ${pageDirs.length} route segment(s), ${specFiles.length} co-located ${SUFFIX} spec(s); ${exSet.size} grandfathered.`);
          EOF
      - name: Enforce exceptions ratchet (shrink-only + touch-must-fix)
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$EXCEPTIONS_FILE" ] || [ ! -f "$EXCEPTIONS_FILE" ]; then
            echo "No $EXCEPTIONS_FILE — nothing to ratchet."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)" || {
            echo "::error::Could not compute merge-base with origin/$BASE_REF"
            exit 1
          }
          # Base version of the exceptions file. Distinguish "absent at base"
          # (BASE_EXISTED=0 → this PR is establishing the initial grandfather
          # baseline, so shrink-only must NOT reject the seeded entries) from
          # "present and empty at base" (BASE_EXISTED=1 → enforce shrink-only).
          if git show "$merge_base:$EXCEPTIONS_FILE" > /tmp/e2e-cov-base.json 2>/dev/null; then
            BASE_EXISTED=1
          else
            echo "[]" > /tmp/e2e-cov-base.json
            BASE_EXISTED=0
          fi
          BASE_JSON=/tmp/e2e-cov-base.json BASE_EXISTED="$BASE_EXISTED" HEAD_FILE="$EXCEPTIONS_FILE" MERGE_BASE="$merge_base" node <<'EOF'
          const { readFileSync } = require("node:fs");
          const { execSync } = require("node:child_process");
          const norm = (p) => String(p).replace(/\/+$/, "");
          const load = (f) => {
            try { const v = JSON.parse(readFileSync(f, "utf8")); return Array.isArray(v) ? v.map(norm) : []; }
            catch { return []; }
          };
          const base = new Set(load(process.env.BASE_JSON));
          const head = load(process.env.HEAD_FILE);
          let fail = false;

          // (A) shrink-only: no entry may be ADDED vs base — EXCEPT on the PR
          // that first creates the file, which establishes the initial
          // grandfather baseline (there is nothing to "grow" yet).
          if (process.env.BASE_EXISTED === "1") {
            const added = head.filter((p) => !base.has(p));
            if (added.length) {
              console.error("::error::" + process.env.HEAD_FILE + " may only shrink, never grow. Added:");
              added.forEach((p) => console.error(`  + ${p}`));
              console.error("You cannot grandfather a page — add its e2e spec instead of listing it.");
              fail = true;
            }
          } else {
            console.log(`(initial ${process.env.HEAD_FILE} — establishing the grandfather baseline; shrink-only enforced from the next PR.)`);
          }

          // (B) touch-must-fix: a changed file under a still-listed segment means
          // that segment must be de-listed (and thus get a spec). A rename/delete
          // counts as touching (check both sides).
          const listed = head; // still listed after this PR
          const mb = process.env.MERGE_BASE;
          const diff = execSync(`git diff --name-status -M --diff-filter=ACMRD ${mb} HEAD`, { encoding: "utf8" });
          const touched = new Set();
          for (const line of diff.split("\n")) {
            if (!line.trim()) continue;
            const parts = line.split("\t");
            const status = parts[0];
            const paths = status.startsWith("R") || status.startsWith("C") ? [parts[1], parts[2]] : [parts[1]];
            for (const p of paths) if (p) touched.add(p);
          }
          const offenders = listed.filter((seg) => [...touched].some((f) => f === seg || f.startsWith(seg + "/")));
          if (offenders.length) {
            console.error("::error::You changed files under segments still grandfathered in " + process.env.HEAD_FILE + " (a rename or delete counts as touching):");
            offenders.forEach((s) => console.error(`  - ${s}`));
            console.error("Policy: a touched segment must be removed from the exceptions file AND get a co-located e2e spec.");
            fail = true;
          }

          if (fail) process.exit(1);
          console.log(`✓ ${process.env.HEAD_FILE} ratchet OK (shrink-only; no touched segment left grandfathered).`);
          EOF

  e2e-affected:
    name: E2E (affected only)
    if: ${{ inputs.run-affected-e2e }}
    runs-on: ubuntu-latest
    env:
      USE_FILE_DB: '1'
      AUTH_SECRET: e2e-secret
      SKIP_ENV_VALIDATION: '1'
      E2E_AFFECTED_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the selector can diff the branch against its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Pre-e2e setup
        if: ${{ inputs.pre-e2e-command != '' }}
        shell: bash
        run: |
          set -o pipefail
          ${{ inputs.pre-e2e-command }} 2>&1 | tee pre-e2e.log
      - name: Install Playwright
        if: ${{ inputs.install-playwright }}
        run: pnpm exec playwright install --with-deps chromium
      # ── Failed-first ordering (test prioritization) ───────────────────────
      # Playwright records each run's outcome in test-results/.last-run.json
      # (including the IDs of failed tests). Persisting it across runs lets the
      # consumer's selector run a fast `--last-failed` phase FIRST and bail
      # before the full affected set when a previous failure still fails — the
      # e2e analogue of vitest's failed-first sequencing. Restore is per-ref
      # only: another branch's failures are noise here, and this job never runs
      # on the default branch, so there is no base-branch cache to fall back to.
      # Harmless for consumers whose selector ignores the file (restore misses
      # or the phase never triggers).
      - name: Restore last-run results (failed-first ordering)
        uses: actions/cache/restore@v4
        with:
          path: test-results/.last-run.json
          key: e2e-last-run-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2e-last-run-${{ github.ref }}-
      # Record the restored file's hash so the save below can skip when the run
      # didn't change it. On a stable green ref .last-run.json is a
      # deterministic {"status":"passed","failedTests":[]}, so without this
      # every run would add one immutable cache entry that says nothing new —
      # entries accumulate only while failures are actually changing, which is
      # when the cache is earning its keep. (hashFiles('' ) of a missing file
      # is the empty string, which also makes the first-ever save fire.)
      - name: Note restored last-run hash
        id: lastrun-pre
        shell: bash
        env:
          PRE_HASH: ${{ hashFiles('test-results/.last-run.json') }}
        run: echo "hash=$PRE_HASH" >> "$GITHUB_OUTPUT"
      # Runs only the specs the diff affects; full suite on shared/unmapped
      # changes; nothing on docs-only. Self-skips (exit 0) when nothing is affected.
      - name: Run affected e2e specs
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}"
          pnpm test:e2e:affected 2>&1 | tee e2e-affected.log
      # Save even when the run FAILS — the failures are what the next run's
      # failed-first phase re-hits (actions/cache's built-in post step skips
      # saving on job failure, hence the explicit restore/save split). Guards:
      # the file must exist (a run that skipped e2e, or a consumer that never
      # produces it, has nothing to save — and cache/save errors on a missing
      # path) AND must differ from what was restored (unchanged results would
      # add a redundant immutable entry per run; see lastrun-pre). The
      # run_id/run_attempt suffix keeps every save key unique.
      - name: Save last-run results
        if: ${{ always() && hashFiles('test-results/.last-run.json') != '' && hashFiles('test-results/.last-run.json') != steps.lastrun-pre.outputs.hash }}
        uses: actions/cache/save@v4
        with:
          path: test-results/.last-run.json
          key: e2e-last-run-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

  e2e-reliability:
    name: E2E Reliability
    if: ${{ inputs.run-e2e-reliability }}
    runs-on: ubuntu-latest
    env:
      # In-process PGlite test DB (matches the consumer's e2e defaults). Override
      # in the consumer if it runs e2e differently.
      USE_FILE_DB: '1'
      AUTH_SECRET: e2e-secret
      SKIP_ENV_VALIDATION: '1'
      E2E_RELIABILITY_REPEAT: ${{ inputs.e2e-repeat }}
      E2E_RELIABILITY_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the script can diff the branch against its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Pre-e2e setup
        if: ${{ inputs.pre-e2e-command != '' }}
        shell: bash
        run: |
          set -o pipefail
          ${{ inputs.pre-e2e-command }} 2>&1 | tee pre-e2e.log
      - name: Install Playwright
        if: ${{ inputs.install-playwright }}
        run: pnpm exec playwright install --with-deps chromium
      # Self-skips (exit 0) when no e2e specs changed vs the base branch.
      - name: Re-run changed e2e specs (retries=0)
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}"
          pnpm test:e2e:reliability 2>&1 | tee e2e-reliability.log
