name: Conflict restack (reusable)

# Re-stack a child branch after its parent is squash-merged. The mechanism is
# .github/actions/conflict-monitor (`mode: restack`; restack.mjs and
# lib/restack.mjs argue the rules); this file is the checkout, the grant, the
# runner and the concurrency around it. Its siblings are conflict-probe.yml
# (the PR's one conflict comment, which reads this job's `pushed` output),
# conflict-overlap.yml and conflict-report.yml.
#
# WHY A FOURTH FILE: GitHub checks every job a called workflow DECLARES
# against the caller's grant (see conflict-probe.yml), and this is the only
# job that holds a secret able to push. It asks for read scopes only; the
# push is the PAT's, not the workflow token's. `contents: read` also covers
# the force-push record the ping-pong cap reads (`GET /activity`,
# `GET /compare`); without it the job skips each candidate with a warning.
#
# A consuming repo adds (see CONSUMING.md, "Consuming the Conflict monitor's
# re-stack"):
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       types: [opened, reopened, synchronize]
#   permissions:
#     contents: read
#   jobs:
#     restack:
#       if: >-
#         github.event_name == 'push' ||
#         (github.event_name == 'pull_request' &&
#          github.event.pull_request.head.repo.full_name == github.repository &&
#          github.actor != 'dependabot[bot]')
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: 12-apps/ci/.github/workflows/conflict-restack.yml@v2
#       with:
#         pr: ${{ github.event.pull_request.number || '' }}
#       secrets:
#         PUSH_TOKEN: ${{ secrets.SOME_PAT }}
#     probe:
#       needs: restack
#       if: "!cancelled() && (<the probe's existing condition>)"
#       uses: 12-apps/ci/.github/workflows/conflict-probe.yml@v2
#       with:
#         pr: ${{ github.event.pull_request.number || '' }}
#         restacked: ${{ needs.restack.outputs.pushed }}
#
# WHY A PAT: a push made with GITHUB_TOKEN starts no workflow, so the PR would
# sit with zero check runs. Without PUSH_TOKEN the job plans, warns and pushes
# nothing.
#
# RUNNER: hard-coded to GitHub's ephemeral image, with no `runner` input and
# no CI_RUNNER fallback. The job holds a PAT, and a PAT job belongs on a
# runner that is recycled per job (post-merge-regen.yml's RUNNERS note); an
# overridable expression would make that a default instead of a rule.
#
# NOTHING FROM A PR RUNS: the BASE is checked out, with no credentials
# persisted, and the job only runs `merge-tree`, `commit-tree` and `push` on
# the PR's objects — no install, no script of the PR's.

on:
  workflow_call:
    inputs:
      config:
        description: "Path to the caller's group config; its `restack` key turns the mode on."
        type: string
        required: false
        default: '.github/conflict-monitor.json'
      base:
        description: 'Base branch. Empty: the repository default branch.'
        type: string
        required: false
        default: ''
      pr:
        description: 'Re-stack this one PR instead of every open one.'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Plan and log; push nothing.'
        type: boolean
        required: false
        default: false
      node-version:
        description: 'Node version the scripts run on.'
        type: string
        required: false
        default: '24'
    secrets:
      PUSH_TOKEN:
        description: >-
          A PAT that can push to PR branches. It is sent as an http
          extraheader in the push call only. Missing: plan and warn, push
          nothing — a GITHUB_TOKEN push would start no checks on the PR.
        required: false
    outputs:
      pushed:
        description: 'JSON `{"<pr>": {"head": <sha>, "baseSha": <sha>}}` of every PR it pushed; pass it to conflict-probe.yml as `restacked`.'
        value: ${{ jobs.restack.outputs.pushed }}

permissions:
  contents: read
  pull-requests: read

jobs:
  restack:
    name: Re-stack after a parent's squash
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    # The probe's own keying: one group per target, never cancelled
    # mid-push. A single-PR run is never replaced by another PR's run; a
    # pending full run is replaced only by a newer full run, which covers
    # everything. A full run and a single-PR run on the same PR may overlap:
    # the push is a lease, so the second one fails instead of clobbering, and
    # the next event re-plans. No group is shared with the heal: each side's
    # push is refused when the other moved the branch first.
    concurrency:
      group: conflict-restack-${{ github.repository }}-${{ inputs.pr || 'all' }}
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.restack.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-tree needs every merge base, so the base's whole line; the
          # BASE is checked out, never a PR head, and no credential is left in
          # .git/config for anything later to read.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.base || github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - id: restack
        uses: 12-apps/ci/.github/actions/conflict-monitor@v2
        with:
          mode: restack
          config: ${{ inputs.config }}
          base: ${{ inputs.base }}
          pr: ${{ inputs.pr }}
          dry-run: ${{ inputs.dry-run }}
          push-token: ${{ secrets.PUSH_TOKEN }}
