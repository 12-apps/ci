name: Conflict monitor (reusable)

# Say on a PR the moment its base makes it conflict, and count every time that
# happened. The mechanism is .github/actions/conflict-monitor (its action.yml
# and lib/ argue the rules); this file is the checkout and the grants around it.
#
# A consuming repo adds one caller:
#
#   name: Conflict monitor
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       types: [synchronize]
#     schedule:
#       - cron: '17 11 * * 1'
#     workflow_dispatch: {}
#   permissions:
#     contents: read
#   jobs:
#     probe:
#       if: >-
#         github.event_name == 'push' ||
#         (github.event_name == 'pull_request' &&
#          github.event.pull_request.head.repo.full_name == github.repository)
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: 12-apps/ci/.github/workflows/conflict-monitor.yml@v2
#       with:
#         mode: probe
#         pr: ${{ github.event.pull_request.number || '' }}
#     report:
#       if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: 12-apps/ci/.github/workflows/conflict-monitor.yml@v2
#       with:
#         mode: report
#
# WHY `pull_request: synchronize` AS WELL AS `push`: a push to the base is what
# makes a PR conflict, but the push that FIXES it lands on the PR branch —
# the author's merge, or a heal job's. Probing just that PR on its own push is
# what turns the comment to "resolved" within minutes instead of at the next
# merge to the base. A fork PR's token is read-only there, so the caller should
# keep that trigger to same-repository PRs (the fork's comment still resolves
# at the next push to the base).
#
# The config (`.github/conflict-monitor.json` by default) is the caller's own
# vocabulary: which paths form which group. Without one every file is `code`,
# split by conflict shape — the monitor still works, it just cannot name what
# a lockfile or a generated table is.

on:
  workflow_call:
    inputs:
      mode:
        description: '`probe` (comment on conflicted PRs) or `report` (replay and count every sync).'
        type: string
        required: true
      config:
        description: "Path to the caller's group config."
        type: string
        required: false
        default: '.github/conflict-monitor.json'
      base:
        description: 'Base branch. Empty: the repository default branch.'
        type: string
        required: false
        default: ''
      pr:
        description: '`probe` only: probe this one PR instead of every open one.'
        type: string
        required: false
        default: ''
      window-days:
        description: '`report` only: the trailing window of the "since" column.'
        type: string
        required: false
        default: '7'
      node-version:
        description: 'Node version the scripts run on.'
        type: string
        required: false
        default: '24'

# The ceiling. Each job narrows it to what its mode needs, and the effective
# grant is the intersection with the caller's job permissions: a caller that
# only grants `pull-requests: read` gets a probe that can read and not comment
# — it then fails loudly on its first write rather than silently never writing.
permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    if: inputs.mode == 'probe'
    name: Probe open PRs
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # Serialized per target, never cancelled mid-write: two quick pushes to
    # the base must not both miss an existing comment and write a second one.
    # GitHub keeps one running and one PENDING run per group and a newer run
    # replaces the pending one — harmless here, because the newer full probe
    # covers every PR and the newer single-PR probe covers the same PR. A full
    # probe and a single-PR probe can still overlap (different groups); the
    # probe re-reads the comments right before creating, for exactly that.
    concurrency:
      group: conflict-monitor-probe-${{ github.repository }}-${{ inputs.pr || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base and the culprit history need the base's whole line.
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - uses: 12-apps/ci/.github/actions/conflict-monitor@v2
        with:
          mode: probe
          config: ${{ inputs.config }}
          base: ${{ inputs.base }}
          pr: ${{ inputs.pr }}

  report:
    if: inputs.mode == 'report'
    name: Conflict report
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - uses: 12-apps/ci/.github/actions/conflict-monitor@v2
        with:
          mode: report
          config: ${{ inputs.config }}
          base: ${{ inputs.base }}
          window-days: ${{ inputs.window-days }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conflict-report
          path: conflict-report/
          if-no-files-found: ignore
