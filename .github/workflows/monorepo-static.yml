name: Monorepo Static

# Reusable STATIC tier of the org's fail-fast monorepo CI (pnpm + turborepo).
# Pairs with monorepo-tests.yml: the consumer calls THIS first, then gates the
# heavy tier (tests/build) and its repo-specific jobs on this workflow's
# outputs — preserving the fail-fast topology (a lint or type error skips every
# expensive lane) while sharing the machinery across repos.
#
# What it standardizes (originally proven in future-pay, FUT-213):
#   - paths-filtered `changes` detection (positive globs only — see below),
#     including the CALLER's own repo-specific filters via `extra-filters` —
#     one `Detect Changes` job for the whole pipeline. A consumer-side second
#     one costs a full billed minute per CI trigger for ~6s of work (FUT-468)
#   - full-suite behavior on `push` events (every output forced 'true', no
#     --affected): the post-merge safety net that makes PR-time incremental
#     selection safe to trust
#   - turbo --affected lint/type-check with a cross-run .turbo cache
#   - actionlint on workflow-file changes
#
# Caller responsibilities (see CONSUMING.md "Monorepo CI pipeline"):
#   - define workflow-level `concurrency` (reusable workflows cannot):
#       concurrency:
#         group: ci-${{ github.workflow }}-${{ github.ref }}
#         cancel-in-progress: ${{ github.event_name != 'push' }}
#   - trigger on BOTH pull_request and push:[default branch]
#   - grant the caller job: permissions: contents: read, pull-requests: read
#   - declare correct per-package turbo `outputs` (a build cache hit restores
#     only what the package's turbo.json declares — wrong outputs mean a hit
#     that restores nothing)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      code-paths:
        description: >-
          Newline-separated POSITIVE globs that define "code" for the changes
          filter. Do NOT use `!` negations: under dorny/paths-filter's default
          `predicate-quantifier: some` a single negation matches ANY other path
          and defeats the filter. Anything not matched (docs, shell scripts,
          workflow/docker YAML) skips the heavy lanes. The default covers the
          common JS/TS monorepo surface plus the pnpm manifests.
        type: string
        required: false
        default: |
          **/*.ts
          **/*.tsx
          **/*.js
          **/*.jsx
          **/*.mjs
          **/*.cjs
          **/*.json
          **/*.html
          **/*.css
          **/*.scss
          **/*.toml
          pnpm-lock.yaml
          pnpm-workspace.yaml
      pre-typecheck-command:
        description: >-
          Shell run before `turbo run check-types` (e.g. generate the Prisma
          client, which lives in node_modules where no turbo cache can restore
          it). Empty to skip.
        type: string
        required: false
        default: ''
      extra-filters:
        description: >-
          Optional RAW YAML appended verbatim to the generated paths-filter
          spec, so a consumer can fold its repo-specific filters into THIS job
          instead of paying for a second `Detect Changes` job of its own
          (GitHub bills every job that starts, rounded up to a whole minute —
          the duplicate cost ~1 min per CI trigger). Their results come back
          through the `matched` output.


          Pass it as an unindented block scalar (`extra-filters: |`) with each
          filter name at column 0 — those column-0 `name:` lines are what the
          job reads to learn the filter names, which it needs on `push` where
          the filter step does not run at all. A block whose names are indented
          declares none and FAILS the job rather than silently disabling the
          caller's lanes on the branch that gates releases.


          The same positive-globs-only rule as `code-paths` applies (no `!`
          negations under `predicate-quantifier: some`). `code`, `workflows`
          and `changes` are reserved names and are rejected.
        type: string
        required: false
        default: ''
      probe-scripts:
        description: >-
          Optional newline-separated list of root `package.json` script names
          to probe for. The ones that exist come back in the `scripts` output,
          so a caller can put "does this repo define script X?" in a job-level
          `if:` — which is otherwise impossible, because `if:` is evaluated
          BEFORE the job starts, when there is no checkout to inspect and
          expressions cannot read file contents. Answering it here costs
          nothing: this job already runs and already bills its whole minute.


          Deliberately NOT event-gated (unlike the path filters): the answer is
          a property of the repo, not of the diff, so it is correct on push too.
        type: string
        required: false
        default: ''
      run-actionlint:
        description: 'Lint workflow files (actionlint + shellcheck) when they change.'
        type: boolean
        required: false
        default: true
      actionlint-version:
        description: 'Pinned actionlint version.'
        type: string
        required: false
        default: '1.7.7'
    outputs:
      code:
        description: >-
          'true' when code changed (or on any push event — the full-suite
          safety net skips nothing). Gate the tests tier and repo-specific
          jobs on this.
        value: ${{ jobs.changes.outputs.code }}
      workflows:
        description: "'true' when .github/workflows/** changed (or on push)."
        value: ${{ jobs.changes.outputs.workflows }}
      matched:
        description: >-
          JSON array of every filter name that matched — the built-in `code` /
          `workflows` plus anything declared via `extra-filters`. Gate a
          repo-specific job with
          `contains(fromJSON(needs.<job>.outputs.matched), '<name>')`.


          On `push` it lists EVERY declared name, matched or not: the full-suite
          safety net skips nothing, exactly as `code` and `workflows` are forced
          'true' there. Never empty — it falls back to `[]` so `fromJSON` on it
          can't blow up.
        value: ${{ jobs.changes.outputs.matched }}
      scripts:
        description: >-
          JSON array of the `probe-scripts` names that the root `package.json`
          actually defines (on every event, push included). Gate a lane that
          only makes sense once a script exists with
          `contains(fromJSON(needs.<job>.outputs.scripts), '<script>')`.
          Never empty — falls back to `[]`.
        value: ${{ jobs.changes.outputs.scripts }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # On a push (the full-suite safety net) every output is forced 'true':
    # the whole point of that run is to skip nothing, so the filter step does
    # not even execute. `matched` mirrors that contract for the caller's
    # `extra-filters` — on push it carries EVERY declared name, which is why
    # the spec step (which is where the names are parsed) runs unconditionally
    # while the filter step below stays PR-only.
    #
    # The trailing `|| '[]'` on the two JSON outputs is deliberate: a consumer
    # reads them through `fromJSON`, and `fromJSON('')` is a hard expression
    # error, so they must never resolve empty.
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      workflows: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.workflows }}
      matched: ${{ (github.event_name != 'pull_request' && steps.spec.outputs.names || steps.filter.outputs.changes) || '[]' }}
      scripts: ${{ steps.probe.outputs.scripts || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dorny/paths-filter takes its filter spec as a YAML string; build it
      # from the newline-list input so consumers pass plain globs, not YAML.
      #
      # NOT event-gated (the filter step is): on push this step is the only
      # thing that knows which extra-filter names were declared, and `matched`
      # has to report all of them for the full-suite safety net to hold.
      - name: Build filter spec
        id: spec
        shell: bash
        env:
          CODE_PATHS: ${{ inputs.code-paths }}
          EXTRA_FILTERS: ${{ inputs.extra-filters }}
        run: |
          set -euo pipefail

          # Top-level keys of the raw extra YAML = the caller's filter names.
          # Only column-0 `name:` lines count, which is what a `|` block scalar
          # produces; comments and the indented glob lines are skipped.
          names=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^([A-Za-z0-9_.-]+): ]]; then
              names+=("${BASH_REMATCH[1]}")
            fi
          done <<< "$EXTRA_FILTERS"

          # Fail LOUD on a non-empty block that declares nothing (the classic
          # cause: the whole block indented one level). Silently accepting it
          # would leave `matched` missing those names on push, and the caller's
          # lanes would stop running on main with CI still green.
          if [ -n "${EXTRA_FILTERS//[[:space:]]/}" ] && [ "${#names[@]}" -eq 0 ]; then
            echo "::error::extra-filters is non-empty but declares no top-level filter names. Pass it as an UNINDENTED block scalar (extra-filters: |) with every filter name at column 0."
            exit 1
          fi

          for name in ${names[@]+"${names[@]}"}; do
            case "$name" in
              code | workflows)
                echo "::error::extra-filters may not redefine the built-in '$name' filter."
                exit 1
                ;;
              changes)
                # dorny/paths-filter refuses to set its own `changes` output
                # when a filter of that name exists ("Cannot set changes output
                # variable - name already used by filter output"), which would
                # empty `matched` on every PR without failing anything.
                echo "::error::extra-filters may not define a filter named 'changes' — dorny/paths-filter then suppresses its own 'changes' output and 'matched' would be silently empty on pull_request."
                exit 1
                ;;
            esac
          done

          # Every declared name, for the push safety net. Names are validated
          # against [A-Za-z0-9_.-]+ above, so no JSON escaping is needed.
          json='['
          sep=''
          for name in code workflows ${names[@]+"${names[@]}"}; do
            json="${json}${sep}\"${name}\""
            sep=','
          done
          json="${json}]"
          echo "names=$json" >> "$GITHUB_OUTPUT"

          {
            echo 'yaml<<__FILTERS__'
            echo 'code:'
            while IFS= read -r glob; do
              [ -n "$glob" ] && printf -- "  - '%s'\n" "$glob"
            done <<< "$CODE_PATHS"
            echo 'workflows:'
            echo "  - '.github/workflows/**'"
            if [ -n "${EXTRA_FILTERS//[[:space:]]/}" ]; then
              printf '%s\n' "$EXTRA_FILTERS"
            fi
            echo '__FILTERS__'
          } >> "$GITHUB_OUTPUT"

      # Answers "does the repo define script X?" for a caller's job-level `if:`
      # — see the probe-scripts input. Runs on every event: the answer is a
      # property of the repo, not of the diff.
      - name: Probe package.json scripts
        id: probe
        if: ${{ inputs.probe-scripts != '' }}
        shell: bash
        env:
          PROBE_SCRIPTS: ${{ inputs.probe-scripts }}
        run: |
          set -euo pipefail
          present=()
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            if SCRIPT="$script" node -e "const s=require('./package.json').scripts||{};process.exit(Object.hasOwn(s,process.env.SCRIPT)?0:1)"; then
              present+=("$script")
            else
              echo "::notice::no '$script' script defined in package.json — any lane gated on it will not start"
            fi
          done <<< "$PROBE_SCRIPTS"
          # Script names can contain ':' and '-' but JSON-escaping is still the
          # safe move here, since these come from a free-form input.
          printf '%s\n' ${present[@]+"${present[@]}"} \
            | node -e "const l=require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean);console.log('scripts='+JSON.stringify(l))" \
            >> "$GITHUB_OUTPUT"

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: ${{ steps.spec.outputs.yaml }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history so `turbo --affected` can compute the merge-base against
        # the PR's base branch (auto-detected from GITHUB_BASE_REF); a shallow
        # clone hides that commit and turbo falls back to running everything.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Cross-run turbo cache: a later commit on the same PR replays unchanged
      # packages instead of re-running them.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: |
            turbo-lint-

      - name: Lint
        shell: bash
        # PR: --affected lints only the packages the diff touched (plus
        # dependents). Push (safety net): everything — --affected against the
        # branch's own tip would diff empty and lint nothing.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run lint --affected 2>&1 | tee lint.log
          else
            pnpm turbo run lint 2>&1 | tee lint.log
          fi

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history for turbo --affected merge-base detection (see lint).
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Command inputs are routed through env (not interpolated into the
      # script) so shell metacharacters in a computed value can never be
      # template-expanded into the run block (Actions hardening guidance).
      - name: Pre-typecheck setup
        if: ${{ inputs.pre-typecheck-command != '' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-typecheck-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-typecheck.log

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-

      - name: Type check
        shell: bash
        # PR: --affected (turbo still builds each affected package's upstream
        # deps first, so cross-package type errors are caught). Push: everything.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run check-types --affected 2>&1 | tee typecheck.log
          else
            pnpm turbo run check-types 2>&1 | tee typecheck.log
          fi

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ inputs.run-actionlint && needs.changes.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static gate for the workflow files themselves — deploy workflows can't
      # be e2e-tested without live infra, so actionlint is their safety net:
      # undefined-input refs, bad expressions, invalid `uses:`, and (via
      # shellcheck, preinstalled on ubuntu-latest) shell bugs in `run:` blocks.
      - name: Lint GitHub workflows
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          # Silence only the pure-style "group your redirects" suggestion.
          SHELLCHECK_OPTS: -e SC2129
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color
