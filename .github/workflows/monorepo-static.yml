name: Monorepo Static

# Reusable STATIC tier of the org's fail-fast monorepo CI (pnpm + turborepo).
# Pairs with monorepo-tests.yml: the consumer calls THIS first, then gates the
# heavy tier (tests/build) and its repo-specific jobs on this workflow's
# outputs — preserving the fail-fast topology (a lint or type error skips every
# expensive lane) while sharing the machinery across repos.
#
# What it standardizes (originally proven in future-pay, FUT-213):
#   - paths-filtered `changes` detection (positive globs only — see below),
#     including the CALLER's own repo-specific filters via `extra-filters` —
#     one `Detect Changes` job for the whole pipeline. A consumer-side second
#     one costs a full billed minute per CI trigger for ~6s of work (FUT-468)
#   - full-suite behavior on `push` events (every output forced 'true', no
#     --affected): the post-merge safety net that makes PR-time incremental
#     selection safe to trust
#   - turbo --affected lint/type-check with a cross-run .turbo cache
#   - actionlint on workflow-file changes
#
# Caller responsibilities (see CONSUMING.md "Monorepo CI pipeline"):
#   - define workflow-level `concurrency` (reusable workflows cannot):
#       concurrency:
#         group: ci-${{ github.workflow }}-${{ github.ref }}
#         cancel-in-progress: ${{ github.event_name != 'push' }}
#   - trigger on BOTH pull_request and push:[default branch]
#   - grant the caller job: permissions: contents: read, pull-requests: read
#   - declare correct per-package turbo `outputs` (a build cache hit restores
#     only what the package's turbo.json declares — wrong outputs mean a hit
#     that restores nothing)

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: >-
          npm token for consumers whose installs resolve RESTRICTED packages
          (e.g. a private @12-apps package). Optional and backward-compatible:
          absent, NODE_AUTH_TOKEN resolves empty and installs stay anonymous,
          exactly as before. Takes effect only when the consumer's committed
          .npmrc reads ${NODE_AUTH_TOKEN}.
        required: false
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      code-paths:
        description: >-
          Newline-separated POSITIVE globs that define "code" for the changes
          filter. Do NOT use `!` negations: under dorny/paths-filter's default
          `predicate-quantifier: some` a single negation matches ANY other path
          and defeats the filter. Anything not matched (docs, shell scripts,
          workflow/docker YAML) skips the heavy lanes. The default covers the
          common JS/TS monorepo surface plus the pnpm manifests.
        type: string
        required: false
        default: |
          **/*.ts
          **/*.tsx
          **/*.js
          **/*.jsx
          **/*.mjs
          **/*.cjs
          **/*.json
          **/*.html
          **/*.css
          **/*.scss
          **/*.toml
          pnpm-lock.yaml
          pnpm-workspace.yaml
      pre-typecheck-command:
        description: >-
          Shell run before `turbo run check-types` (e.g. generate the Prisma
          client, which lives in node_modules where no turbo cache can restore
          it). Empty to skip.
        type: string
        required: false
        default: ''
      extra-filters:
        description: >-
          Optional RAW YAML appended verbatim to the generated paths-filter
          spec, so a consumer can fold its repo-specific filters into THIS job
          instead of paying for a second `Detect Changes` job of its own
          (GitHub bills every job that starts, rounded up to a whole minute —
          the duplicate cost ~1 min per CI trigger). Their results come back
          through the `matched` output.


          Pass it as an unindented block scalar (`extra-filters: |`) with each
          filter name at column 0 — those column-0 `name:` lines are what the
          job reads to learn the filter names, which it needs on `push` where
          the filter step does not run at all. A block whose names are indented
          declares none and FAILS the job rather than silently disabling the
          caller's lanes on the branch that gates releases.


          The same positive-globs-only rule as `code-paths` applies (no `!`
          negations under `predicate-quantifier: some`). `code`, `workflows`
          and `changes` are reserved names and are rejected.
        type: string
        required: false
        default: ''
      stack-aware:
        description: >-
          On a STACKED pull request, treat the STACK's base as the diff base for
          both selection mechanisms in this tier. Off by default.

          Mid-stack, a pull request's base is the branch BELOW it, so both the
          path filter and `turbo --affected` see one layer only. A layer that
          changes package B on top of a layer that changed package A selects
          only B, and A's lint/type-check never run even though the merged
          result contains both. This fails OPEN — the tier goes green having
          skipped work it should have done.

          BOTH selectors are told, because they answer different halves of the
          question and both are stack-blind by default: the path filter bounds
          WHETHER this tier runs (its `base` becomes the stack base), and
          `turbo --affected` bounds WHICH packages it runs for (its
          `TURBO_SCM_BASE` becomes the stack base). Fixing one and not the other
          would leave the tier selecting correctly at one level and wrongly at
          the other, which is harder to spot than fixing neither.

          Off by default because GitHub ships stacked pull requests as a PUBLIC
          PREVIEW "subject to change", and this repo hands workflows to
          consumers on a moving major tag. No effect off a stack.
        type: boolean
        required: false
        default: false
      probe-scripts:
        description: >-
          Optional newline-separated list of root `package.json` script names
          to probe for. The ones that exist come back in the `scripts` output,
          so a caller can put "does this repo define script X?" in a job-level
          `if:` — which is otherwise impossible, because `if:` is evaluated
          BEFORE the job starts, when there is no checkout to inspect and
          expressions cannot read file contents. Answering it here costs
          nothing: this job already runs and already bills its whole minute.


          Deliberately NOT event-gated (unlike the path filters): the answer is
          a property of the repo, not of the diff, so it is correct on push too.
        type: string
        required: false
        default: ''
      run-actionlint:
        description: 'Lint workflow files (actionlint + shellcheck) when they change.'
        type: boolean
        required: false
        default: true
      actionlint-version:
        description: 'Pinned actionlint version.'
        type: string
        required: false
        default: '1.7.7'
    outputs:
      code:
        description: >-
          'true' when code changed (or on any push event — the full-suite
          safety net skips nothing). Gate the tests tier and repo-specific
          jobs on this.
        value: ${{ jobs.changes.outputs.code }}
      workflows:
        description: "'true' when .github/workflows/** changed (or on push)."
        value: ${{ jobs.changes.outputs.workflows }}
      matched:
        description: >-
          JSON array of every filter name that matched — the built-in `code` /
          `workflows` plus anything declared via `extra-filters`. Gate a
          repo-specific job with
          `contains(fromJSON(needs.<job>.outputs.matched), '<name>')`.


          On `push` it lists EVERY declared name, matched or not: the full-suite
          safety net skips nothing, exactly as `code` and `workflows` are forced
          'true' there. Never empty — it falls back to `[]` so `fromJSON` on it
          can't blow up.
        value: ${{ jobs.changes.outputs.matched }}
      scripts:
        description: >-
          JSON array of the `probe-scripts` names that the root `package.json`
          actually defines (on every event, push included). Gate a lane that
          only makes sense once a script exists with
          `contains(fromJSON(needs.<job>.outputs.scripts), '<script>')`.
          Never empty — falls back to `[]`.
        value: ${{ jobs.changes.outputs.scripts }}

# Authenticate npm installs for consumers with RESTRICTED packages. Workflow-
# level so every `pnpm install` in this file sees it; the consumer's .npmrc is
# what turns the variable into a registry credential (see the NPM_TOKEN secret
# declaration above). Empty when the secret is not passed — anonymous installs,
# the pre-existing behavior.
env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  # pnpm 10+ stopped expanding env vars in credentials that come from a
  # PROJECT .npmrc (a committed file could redirect the expanded secret to an
  # attacker-controlled registry), so a consumer's ${NODE_AUTH_TOKEN} line is
  # silently ignored there and a restricted install 404s. Re-reading the same
  # file as the USER config restores the expansion: user-level credentials
  # stay trusted, and the trust is declared here, outside the repository.
  # (pnpm 11's PNPM_CONFIG_NPMRC_AUTH_FILE does not exist in pnpm 10 —
  # verified against 10.34.5.) Identical behavior for pnpm 9 consumers, and
  # a no-op for repos with no .npmrc: a missing userconfig file reads empty.
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # On a push (the full-suite safety net) every output is forced 'true':
    # the whole point of that run is to skip nothing, so the filter step does
    # not even execute. `matched` mirrors that contract for the caller's
    # `extra-filters` — on push it carries EVERY declared name, which is why
    # the spec step (which is where the names are parsed) runs unconditionally
    # while the filter step below stays PR-only.
    #
    # The trailing `|| '[]'` on the two JSON outputs is deliberate: a consumer
    # reads them through `fromJSON`, and `fromJSON('')` is a hard expression
    # error, so they must never resolve empty.
    outputs:
      # Exactly one of `stackfilter` / `filter` runs on a pull_request — the
      # stacked path when dorny could not be told the right base, dorny
      # otherwise. A skipped step's outputs are empty, so `||` picks the one that
      # ran. Both emit the same shapes: '<name>=true|false' and a JSON `changes`.
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.stackfilter.outputs.code || steps.filter.outputs.code }}
      workflows: ${{ github.event_name != 'pull_request' && 'true' || steps.stackfilter.outputs.workflows || steps.filter.outputs.workflows }}
      matched: ${{ (github.event_name != 'pull_request' && steps.spec.outputs.names || steps.stackfilter.outputs.changes || steps.filter.outputs.changes) || '[]' }}
      scripts: ${{ steps.probe.outputs.scripts || '[]' }}
      # Empty off a stack. Exposed as a job output because the turbo lanes below
      # are separate JOBS — a `steps.` context does not cross a job boundary, so
      # they read it through `needs.changes.outputs.stack-base`.
      stack-base: ${{ steps.stackbase.outputs.value }}
    steps:
      # Resolved before the checkout, because the checkout's depth depends on
      # the answer. Empty unless the caller opted in AND this pull request is
      # actually in a stack — `stack` is absent on an unstacked pull request and
      # on every non-pull_request event, so everything below collapses to the
      # previous behaviour in all of those cases.
      - name: Resolve the stack base
        id: stackbase
        shell: bash
        env:
          STACK_BASE: ${{ (inputs.stack-aware && github.event.pull_request.stack != null) && github.event.pull_request.stack.base.sha || '' }}
        run: |
          set -euo pipefail
          echo "value=$STACK_BASE" >> "$GITHUB_OUTPUT"
          if [ -n "$STACK_BASE" ]; then
            echo "Stacked pull request — selecting against the stack base: $STACK_BASE"
          else
            echo "Not a stacked pull request (or stack-aware is off) — default selection."
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A stack base is a raw sha that only local history can resolve, so
          # those runs need the full clone. Quoted '0' deliberately: GitHub
          # expressions treat bare 0 as falsy, so `cond && 0 || 1` would always
          # yield 1 and the filter would fail on a shallow clone with a "bad
          # object" error nothing here would explain.
          fetch-depth: ${{ steps.stackbase.outputs.value != '' && '0' || '1' }}

      # dorny/paths-filter takes its filter spec as a YAML string; build it
      # from the newline-list input so consumers pass plain globs, not YAML.
      #
      # NOT event-gated (the filter step is): on push this step is the only
      # thing that knows which extra-filter names were declared, and `matched`
      # has to report all of them for the full-suite safety net to hold.
      - name: Build filter spec
        id: spec
        shell: bash
        env:
          CODE_PATHS: ${{ inputs.code-paths }}
          EXTRA_FILTERS: ${{ inputs.extra-filters }}
        run: |
          set -euo pipefail

          # Top-level keys of the raw extra YAML = the caller's filter names.
          # Only column-0 `name:` lines count, which is what a `|` block scalar
          # produces; comments and the indented glob lines are skipped.
          names=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^([A-Za-z0-9_.-]+): ]]; then
              names+=("${BASH_REMATCH[1]}")
            fi
          done <<< "$EXTRA_FILTERS"

          # Fail LOUD on a non-empty block that declares nothing (the classic
          # cause: the whole block indented one level). Silently accepting it
          # would leave `matched` missing those names on push, and the caller's
          # lanes would stop running on main with CI still green.
          if [ -n "${EXTRA_FILTERS//[[:space:]]/}" ] && [ "${#names[@]}" -eq 0 ]; then
            echo "::error::extra-filters is non-empty but declares no top-level filter names. Pass it as an UNINDENTED block scalar (extra-filters: |) with every filter name at column 0."
            exit 1
          fi

          for name in ${names[@]+"${names[@]}"}; do
            case "$name" in
              code | workflows)
                echo "::error::extra-filters may not redefine the built-in '$name' filter."
                exit 1
                ;;
              changes)
                # dorny/paths-filter refuses to set its own `changes` output
                # when a filter of that name exists ("Cannot set changes output
                # variable - name already used by filter output"), which would
                # empty `matched` on every PR without failing anything.
                echo "::error::extra-filters may not define a filter named 'changes' — dorny/paths-filter then suppresses its own 'changes' output and 'matched' would be silently empty on pull_request."
                exit 1
                ;;
            esac
          done

          # Every declared name, for the push safety net. Names are validated
          # against [A-Za-z0-9_.-]+ above, so no JSON escaping is needed.
          json='['
          sep=''
          for name in code workflows ${names[@]+"${names[@]}"}; do
            json="${json}${sep}\"${name}\""
            sep=','
          done
          json="${json}]"
          echo "names=$json" >> "$GITHUB_OUTPUT"

          {
            echo 'yaml<<__FILTERS__'
            echo 'code:'
            while IFS= read -r glob; do
              [ -n "$glob" ] && printf -- "  - '%s'\n" "$glob"
            done <<< "$CODE_PATHS"
            echo 'workflows:'
            echo "  - '.github/workflows/**'"
            if [ -n "${EXTRA_FILTERS//[[:space:]]/}" ]; then
              printf '%s\n' "$EXTRA_FILTERS"
            fi
            echo '__FILTERS__'
          } >> "$GITHUB_OUTPUT"

      # Answers "does the repo define script X?" for a caller's job-level `if:`
      # — see the probe-scripts input. Runs on every event: the answer is a
      # property of the repo, not of the diff.
      - name: Probe package.json scripts
        id: probe
        if: ${{ inputs.probe-scripts != '' }}
        shell: bash
        env:
          PROBE_SCRIPTS: ${{ inputs.probe-scripts }}
        run: |
          set -euo pipefail
          present=()
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            if SCRIPT="$script" node -e "const s=require('./package.json').scripts||{};process.exit(Object.hasOwn(s,process.env.SCRIPT)?0:1)"; then
              present+=("$script")
            else
              echo "::notice::no '$script' script defined in package.json — any lane gated on it will not start"
            fi
          done <<< "$PROBE_SCRIPTS"
          # Script names can contain ':' and '-' but JSON-escaping is still the
          # safe move here, since these come from a free-form input.
          printf '%s\n' ${present[@]+"${present[@]}"} \
            | node -e "const l=require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean);console.log('scripts='+JSON.stringify(l))" \
            >> "$GITHUB_OUTPUT"

      # ── Stacked pull requests cannot go through dorny ────────────────────────
      # dorny/paths-filter honours `base` only on push/workflow_dispatch. On a
      # pull_request it ignores it and reads the PR's own file list from the API
      # — mid-stack, the top layer alone. Passing the stack base therefore looked
      # right and did nothing, which a real stacked pull request proved: the
      # correct sha went in, one layer's files came out.
      #
      # git does the globbing instead. Each category's globs become `:(glob)`
      # pathspecs and git reports whether the stack-base..head diff touches any
      # of them — no new dependency, and `:(glob)` handles `**` the way these
      # specs assume. Relies on the positive-globs-only rule already documented
      # for `code-paths` and `extra-filters`.
      - name: Check for code changes against the stack base
        id: stackfilter
        if: ${{ github.event_name == 'pull_request' && steps.stackbase.outputs.value != '' }}
        shell: bash
        env:
          SPEC: ${{ steps.spec.outputs.yaml }}
          BASE: ${{ steps.stackbase.outputs.value }}
        run: |
          set -euo pipefail
          # The generated spec is always block-style YAML with names at column 0.
          parsed="$(node <<'EOF'
          const raw = process.env.SPEC ?? "";
          const out = []; let cur = null, globs = [];
          const flush = () => { if (cur) out.push([cur, ...globs].join("\t")); };
          for (const line of raw.split("\n")) {
            if (!line.trim() || line.trimStart().startsWith("#")) continue;
            const top = line.match(/^([A-Za-z0-9_.-]+):\s*$/);
            if (top) { flush(); cur = top[1]; globs = []; continue; }
            const item = line.match(/^\s*-\s*(.+?)\s*$/);
            if (item && cur) globs.push(item[1].replace(/^['"]|['"]$/g, ""));
          }
          flush();
          console.log(out.join("\n"));
          EOF
          )"

          matched=()
          while IFS=$'\t' read -r -a row; do
            [ "${#row[@]}" -gt 1 ] || continue
            name="${row[0]}"; pathspecs=()
            for g in "${row[@]:1}"; do pathspecs+=(":(glob)$g"); done
            if [ -n "$(git diff --name-only "${BASE}...HEAD" -- "${pathspecs[@]}")" ]; then
              matched+=("$name"); echo "$name=true" >> "$GITHUB_OUTPUT"; echo "· $name matched"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done <<<"$parsed"

          printf '%s\n' "${matched[@]+"${matched[@]}"}" \
            | node -e "const l=require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean);console.log('changes='+JSON.stringify(l))" \
            >> "$GITHUB_OUTPUT"

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        # Skipped on a stacked pull request — the step above did it with a base
        # dorny would have ignored.
        if: ${{ github.event_name == 'pull_request' && steps.stackbase.outputs.value == '' }}
        with:
          filters: ${{ steps.spec.outputs.yaml }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history so `turbo --affected` can compute the merge-base against
        # the PR's base branch (auto-detected from GITHUB_BASE_REF); a shallow
        # clone hides that commit and turbo falls back to running everything.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Cross-run turbo cache: a later commit on the same PR replays unchanged
      # packages instead of re-running them.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: |
            turbo-lint-

      # `turbo --affected` derives base...head from GITHUB_BASE_REF, which
      # mid-stack is the branch BELOW this pull request — so it would select
      # only this layer's packages and silently skip every package the layers
      # underneath touched. TURBO_SCM_BASE overrides that base.
      #
      # Off a stack this used to set NOTHING, leaving turbo to resolve
      # GITHUB_BASE_REF by NAME — and a pull request checkout has no local
      # `main` branch. Turbo printed "Failed to resolve base ref 'main' …
      # unknown revision", then "unable to detect git range, assuming all files
      # have changed", and ran EVERY package while still reporting success
      # (measured: all 26 packages for a three-file diff). So the ordinary pull
      # request — not the stacked edge case — was the one silently paying for a
      # full run. Fetching the base and pinning turbo to its SHA is what makes
      # `--affected` mean anything here.
      #
      # Still written to GITHUB_ENV from a CONDITIONAL branch rather than a
      # job-level `env:` that can resolve to '': turbo documents
      # TURBO_SCM_BASE as "base used by --affected" but does NOT document how it
      # treats an empty value, and an unset variable is the only behaviour we
      # can be sure of.
      # No `with:` — the step only runs on a pull request, where the action's
      # default (GITHUB_BASE_REF) is exactly the ref wanted.
      - name: Fetch the base for turbo --affected
        id: base
        if: ${{ github.event_name == 'pull_request' }}
        uses: 12-apps/ci/.github/actions/fetch-base@v1

      - name: Point turbo --affected at the base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          STACK_BASE: ${{ needs.changes.outputs.stack-base }}
          BASE_SHA: ${{ steps.base.outputs.base-sha }}
        run: |
          set -euo pipefail
          # Both empty means unrelated histories: set nothing and let turbo run
          # everything, which is the safe direction to fail in.
          base="${STACK_BASE:-$BASE_SHA}"
          if [ -n "$base" ]; then
            {
              echo "TURBO_SCM_BASE=$base"
              echo "TURBO_SCM_HEAD=HEAD"
            } >> "$GITHUB_ENV"
            echo "--affected diffs against $base"
          fi

      - name: Lint
        shell: bash
        # PR: --affected lints only the packages the diff touched (plus
        # dependents). Push (safety net): everything — --affected against the
        # branch's own tip would diff empty and lint nothing.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run lint --affected 2>&1 | tee lint.log
          else
            pnpm turbo run lint 2>&1 | tee lint.log
          fi

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history for turbo --affected merge-base detection (see lint).
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Command inputs are routed through env (not interpolated into the
      # script) so shell metacharacters in a computed value can never be
      # template-expanded into the run block (Actions hardening guidance).
      - name: Pre-typecheck setup
        if: ${{ inputs.pre-typecheck-command != '' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-typecheck-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-typecheck.log

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-

      # Same reasoning as the lint lane: mid-stack, turbo's default base is the
      # layer below, so type-check would skip the packages the lower layers
      # touched. See the note there for why this is a conditional step.
      - name: Point turbo --affected at the stack base
        if: needs.changes.outputs.stack-base != ''
        shell: bash
        run: echo "TURBO_SCM_BASE=${{ needs.changes.outputs.stack-base }}" >> "$GITHUB_ENV"

      - name: Type check
        shell: bash
        # PR: --affected (turbo still builds each affected package's upstream
        # deps first, so cross-package type errors are caught). Push: everything.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run check-types --affected 2>&1 | tee typecheck.log
          else
            pnpm turbo run check-types 2>&1 | tee typecheck.log
          fi

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ inputs.run-actionlint && needs.changes.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static gate for the workflow files themselves — deploy workflows can't
      # be e2e-tested without live infra, so actionlint is their safety net:
      # undefined-input refs, bad expressions, invalid `uses:`, and (via
      # shellcheck, preinstalled on ubuntu-latest) shell bugs in `run:` blocks.
      - name: Lint GitHub workflows
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          # Silence only the pure-style "group your redirects" suggestion.
          SHELLCHECK_OPTS: -e SC2129
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color
