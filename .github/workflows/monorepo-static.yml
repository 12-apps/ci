name: Monorepo Static

# Reusable STATIC tier of the org's fail-fast monorepo CI (pnpm + turborepo).
# Pairs with monorepo-tests.yml: the consumer calls THIS first, then gates the
# heavy tier (tests/build) and its repo-specific jobs on this workflow's
# outputs — preserving the fail-fast topology (a lint or type error skips every
# expensive lane) while sharing the machinery across repos.
#
# What it standardizes (originally proven in future-pay, FUT-213):
#   - paths-filtered `changes` detection (positive globs only — see below)
#   - full-suite behavior on `push` events (every output forced 'true', no
#     --affected): the post-merge safety net that makes PR-time incremental
#     selection safe to trust
#   - turbo --affected lint/type-check with a cross-run .turbo cache
#   - actionlint on workflow-file changes
#
# Caller responsibilities (see CONSUMING.md "Monorepo CI pipeline"):
#   - define workflow-level `concurrency` (reusable workflows cannot):
#       concurrency:
#         group: ci-${{ github.workflow }}-${{ github.ref }}
#         cancel-in-progress: ${{ github.event_name != 'push' }}
#   - trigger on BOTH pull_request and push:[default branch]
#   - grant the caller job: permissions: contents: read, pull-requests: read
#   - declare correct per-package turbo `outputs` (a build cache hit restores
#     only what the package's turbo.json declares — wrong outputs mean a hit
#     that restores nothing)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      code-paths:
        description: >-
          Newline-separated POSITIVE globs that define "code" for the changes
          filter. Do NOT use `!` negations: under dorny/paths-filter's default
          `predicate-quantifier: some` a single negation matches ANY other path
          and defeats the filter. Anything not matched (docs, shell scripts,
          workflow/docker YAML) skips the heavy lanes. The default covers the
          common JS/TS monorepo surface plus the pnpm manifests.
        type: string
        required: false
        default: |
          **/*.ts
          **/*.tsx
          **/*.js
          **/*.jsx
          **/*.mjs
          **/*.cjs
          **/*.json
          **/*.html
          **/*.css
          **/*.scss
          **/*.toml
          pnpm-lock.yaml
          pnpm-workspace.yaml
      pre-typecheck-command:
        description: >-
          Shell run before `turbo run check-types` (e.g. generate the Prisma
          client, which lives in node_modules where no turbo cache can restore
          it). Empty to skip.
        type: string
        required: false
        default: ''
      run-actionlint:
        description: 'Lint workflow files (actionlint + shellcheck) when they change.'
        type: boolean
        required: false
        default: true
      actionlint-version:
        description: 'Pinned actionlint version.'
        type: string
        required: false
        default: '1.7.7'
    outputs:
      code:
        description: >-
          'true' when code changed (or on any push event — the full-suite
          safety net skips nothing). Gate the tests tier and repo-specific
          jobs on this.
        value: ${{ jobs.changes.outputs.code }}
      workflows:
        description: "'true' when .github/workflows/** changed (or on push)."
        value: ${{ jobs.changes.outputs.workflows }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # On a push (the full-suite safety net) every output is forced 'true':
    # the whole point of that run is to skip nothing, so the filter step does
    # not even execute.
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      workflows: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dorny/paths-filter takes its filter spec as a YAML string; build it
      # from the newline-list input so consumers pass plain globs, not YAML.
      - name: Build filter spec
        id: spec
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CODE_PATHS: ${{ inputs.code-paths }}
        run: |
          {
            echo 'yaml<<__FILTERS__'
            echo 'code:'
            while IFS= read -r glob; do
              [ -n "$glob" ] && printf -- "  - '%s'\n" "$glob"
            done <<< "$CODE_PATHS"
            echo 'workflows:'
            echo "  - '.github/workflows/**'"
            echo '__FILTERS__'
          } >> "$GITHUB_OUTPUT"

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: ${{ steps.spec.outputs.yaml }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history so `turbo --affected` can compute the merge-base against
        # the PR's base branch (auto-detected from GITHUB_BASE_REF); a shallow
        # clone hides that commit and turbo falls back to running everything.
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Cross-run turbo cache: a later commit on the same PR replays unchanged
      # packages instead of re-running them.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: |
            turbo-lint-

      - name: Lint
        shell: bash
        # PR: --affected lints only the packages the diff touched (plus
        # dependents). Push (safety net): everything — --affected against the
        # branch's own tip would diff empty and lint nothing.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run lint --affected 2>&1 | tee lint.log
          else
            pnpm turbo run lint 2>&1 | tee lint.log
          fi

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history for turbo --affected merge-base detection (see lint).
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      # Command inputs are routed through env (not interpolated into the
      # script) so shell metacharacters in a computed value can never be
      # template-expanded into the run block (Actions hardening guidance).
      - name: Pre-typecheck setup
        if: ${{ inputs.pre-typecheck-command != '' }}
        shell: bash
        env:
          PRE_CMD: ${{ inputs.pre-typecheck-command }}
        run: |
          set -o pipefail
          bash -c "$PRE_CMD" 2>&1 | tee pre-typecheck.log

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-

      - name: Type check
        shell: bash
        # PR: --affected (turbo still builds each affected package's upstream
        # deps first, so cross-package type errors are caught). Push: everything.
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run check-types --affected 2>&1 | tee typecheck.log
          else
            pnpm turbo run check-types 2>&1 | tee typecheck.log
          fi

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ inputs.run-actionlint && needs.changes.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static gate for the workflow files themselves — deploy workflows can't
      # be e2e-tested without live infra, so actionlint is their safety net:
      # undefined-input refs, bad expressions, invalid `uses:`, and (via
      # shellcheck, preinstalled on ubuntu-latest) shell bugs in `run:` blocks.
      - name: Lint GitHub workflows
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
          # Silence only the pure-style "group your redirects" suggestion.
          SHELLCHECK_OPTS: -e SC2129
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color
