name: MCP Contract (reusable)

# Reusable MCP-surface contract gate. Consuming repos add a small caller:
#
#   jobs:
#     mcp-contract:
#       needs: changes
#       if: needs.changes.outputs.code == 'true'
#       permissions:
#         contents: read
#         # packages: read   # add ONLY if pnpm install pulls private GitHub Packages
#       uses: 12-apps/ci/.github/workflows/mcp-contract.yml@v1
#       with:
#         pre-command: pnpm --filter @repo/mcp build
#         # github-packages-scope: '@my-org'   # only if you install private GitHub Packages
#       # NOTE: deliberately NO `secrets: inherit` — see the security note below.
#
# SHAPE: the four gates that need a dependency install — drift, lint, coverage,
# parity — run as sequential STEPS of one `contract-gates` job: one runner, one
# checkout, one pnpm/Node setup, one `pnpm install --frozen-lockfile`, one
# `pre-command`. They used to be four jobs each repeating all of that to run a
# single offline script that finishes in seconds. The consolidation and the
# gate-vs-gate failure isolation follow quality.yml's `Static Gates`; the
# `pre-command` handling does NOT — that job has no pre-command step at all, so
# it is no precedent either way (see the GATE GUARD comment below for what is
# actually modelled on what). store-compliance stays its own job because it
# needs neither the install nor the pre-command (see its comment below).
# CONSUMING.md points consumers at their own aggregation job for the branch
# ruleset rather than this workflow's internal job names, so the per-gate
# check-run names are not part of the contract.
#
# SECRETS: this gate needs NONE, and MUST NOT be given any. Every gate runs
# consumer-controlled code (dependency install, pre-command, and the mcp:*
# scripts), so any inherited secret could be exfiltrated by a compromised
# dependency or script. `permissions: contents: read` scopes only the
# GITHUB_TOKEN — it does NOT protect env secrets. Withholding `secrets: inherit`
# is the separate, necessary control. Generate the OpenAPI, run the drift check,
# and lint OFFLINE (no live DB / real credentials); pass any mcp:parity config as
# non-secret plain `env:` on the caller job.
#
# Runs in the CALLER's checkout, so it uses the consumer repo's own OpenAPI
# spec, generated MCP tool manifest, and `mcp:*` package.json scripts. The
# workflow only orchestrates — every app owns the generation/validation logic
# behind three scripts (see CONSUMING.md):
#
#   mcp:check   — regenerate the MCP tool manifest from the app's OpenAPI and
#                 FAIL (non-zero exit) if it drifts from the committed artifact.
#                 This is the load-bearing gate: it guarantees the served MCP
#                 surface always matches the endpoint surface.
#   mcp:lint    — static lint of the exposed surface: no secret-bearing fields
#                 leak into tool schemas, every tool has an input schema, write
#                 tools are classified, etc. Fails on violation.
#   mcp:coverage — route/action coverage: every HTTP route the app serves is
#                 registered on the MCP surface (or on a documented infra
#                 allowlist), and every server action maps to a registered
#                 operation or a reviewed exclusion. Completeness, where
#                 mcp:check is only non-drift. Runs when the consumer defines
#                 the script; skips with a notice otherwise, so rolling this
#                 gate out via the floating major tag breaks no caller.
# A fifth gate, store-compliance, needs NO consumer script: it reads the
# generated manifest directly and holds it to the assistant-directory review
# rules. Keeping it here rather than in each repo's mcp:lint is deliberate —
# it is the one gate that must be identical across every org repo, and a repo
# cannot weaken it by writing a laxer local lint.
#
#   mcp:parity  — (opt-in) boot the MCP server in-process against the rendered
#                 OpenAPI and diff the SERVED tool schemas vs the generated
#                 manifest. Heavier; off by default.

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: >-
          npm token for consumers whose installs resolve RESTRICTED packages
          (e.g. a private @12-apps package). Optional and backward-compatible:
          absent, NODE_AUTH_TOKEN resolves empty and installs stay anonymous,
          exactly as before. Takes effect only when the consumer's committed
          .npmrc reads ${NODE_AUTH_TOKEN}.
        required: false
    inputs:
      node-version:
        description: 'Node version for all jobs.'
        type: string
        required: false
        default: '24'
      run-drift:
        description: 'Regenerate the MCP tool manifest from OpenAPI and fail on drift (mcp:check).'
        type: boolean
        required: false
        default: true
      run-lint:
        description: 'Static lint of the exposed MCP surface (mcp:lint): secret-leak + schema-shape.'
        type: boolean
        required: false
        default: true
      run-coverage:
        description: >-
          Route/action coverage of the MCP surface (mcp:coverage). On by default,
          but the gate self-skips (with a notice) when the consumer does not
          define the script — so existing callers on the floating major tag are
          unaffected until they adopt it.
        type: boolean
        required: false
        default: true
      run-parity:
        description: 'Boot the MCP server in-process and diff served schemas vs the manifest (mcp:parity). Opt-in.'
        type: boolean
        required: false
        default: false
      run-store-compliance:
        description: >-
          Validate the generated MCP manifest against the Anthropic Connectors
          Directory + OpenAI Apps SDK review rules (annotations, tool naming,
          prompt-injection patterns, and payment-card / government-identifier /
          precise-location exposure). On by default; the job self-skips with a
          notice when `manifest-path` does not exist, so callers already pinned
          to the floating major tag are unaffected until they serve a manifest.
        type: boolean
        required: false
        default: true
      manifest-path:
        description: 'Generated MCP tool manifest to hold to the store-review rules.'
        type: string
        required: false
        default: 'apps/web/mcp/manifest.json'
      store-exceptions-path:
        description: >-
          Per-repo declared store-compliance exceptions, each with a reason.
          Stale entries fail the gate.
        type: string
        required: false
        default: 'mcp-store-exceptions.json'
      pre-command:
        description: 'Shell run before the gate (e.g. build the MCP package / render the OpenAPI). Empty to skip.'
        type: string
        required: false
        default: ''
      github-packages-scope:
        description: >-
          npm scope (e.g. @my-org) whose dependencies come from GitHub Packages.
          When set, the gate job wires ~/.npmrc to install that scope from
          npm.pkg.github.com using the job GITHUB_TOKEN (requires packages: read
          on the caller). Empty (default) = no private-registry wiring; the token
          is never used and public installs are unaffected.
        type: string
        required: false
        default: ''

# Least-privilege, enforced at the source. The effective grant is the
# INTERSECTION of these and the caller's job permissions, so a consumer that
# grants more in a combined CI file (e.g. contents: write, actions: write) cannot
# leak that privilege here. Both grants are READ-only.
#
# `packages: read` is the CEILING (not an auto-grant): consumers whose
# `pnpm install` pulls PRIVATE GitHub Packages need it, so it must be allowed
# here or the intersection would strip it and installs would 401/403. Public-only
# consumers simply grant `contents: read` in their caller and packages access
# never takes effect. It cannot enable writes.
permissions:
  contents: read
  packages: read

# Authenticate npm installs for consumers with RESTRICTED packages. Workflow-
# level so every `pnpm install` in this file sees it; the consumer's .npmrc is
# what turns the variable into a registry credential (see the NPM_TOKEN secret
# declaration above). Empty when the secret is not passed — anonymous installs,
# the pre-existing behavior.
env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  # pnpm 10+ stopped expanding env vars in credentials that come from a
  # PROJECT .npmrc (a committed file could redirect the expanded secret to an
  # attacker-controlled registry), so a consumer's ${NODE_AUTH_TOKEN} line is
  # silently ignored there and a restricted install 404s. This is pnpm's
  # documented opt-back-in: it names the checked-out .npmrc as the user-level
  # auth file, restoring the expansion. Env-only by design (pnpm ignores it
  # when committed); a no-op for consumers still on pnpm 9 (no such setting)
  # and for repos whose .npmrc carries no auth line.
  PNPM_CONFIG_NPMRC_AUTH_FILE: .npmrc

jobs:
  # The four install-dependent gates run as sequential steps of this ONE job —
  # one runner spin-up + checkout + pnpm install + pre-command, instead of four
  # of each to run four offline scripts that finish in seconds.
  #
  # FAILURE ISOLATION, gate vs gate (this half IS quality.yml's `Static Gates`
  # shape): every gate step is guarded by `!cancelled()`, NOT the implicit
  # `success()`. Under plain success() the first failing gate would mask every
  # gate after it, so a PR would surface one violation per run instead of the
  # full inventory four independent jobs gave us. The job still ends FAILED if
  # any gate failed, which is what the caller's required check reads.
  #
  # Because `!cancelled()` is a status-check function it also DELETES the
  # implicit `success()`, so anything that must still short-circuit the gates has
  # to be named explicitly — hence the `steps.install.*` and `steps.pre.*` terms
  # in the GATE GUARD comment below.
  contract-gates:
    name: MCP Contract Gates
    # Skip the runner entirely when every gate in this job is off; otherwise it
    # would boot, install, and then run nothing. store-compliance is a separate
    # job and is unaffected by this condition.
    if: ${{ inputs.run-drift || inputs.run-lint || inputs.run-coverage || inputs.run-parity }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Probe FIRST, before the toolchain setup and install, so its answer can
      # gate them (see the next step). Uses only the checkout and the runner's
      # preinstalled node. Itself skipped when the caller opted out of coverage,
      # so `run-coverage: false` stays silent (as it did when this was its own
      # job with a job-level `if`).
      - name: Probe for mcp:coverage script
        id: probe
        if: ${{ inputs.run-coverage }}
        shell: bash
        run: |
          set -o pipefail
          if node -e "const s=require('./package.json').scripts||{};process.exit(s['mcp:coverage']?0:1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mcp:coverage script not defined — skipping (see CONSUMING.md to adopt the coverage gate)"
          fi
      # One decision for the whole toolchain block below: can ANY gate in this
      # job actually run? drift / lint / parity need only their own toggle;
      # coverage additionally needs the consumer to define the script, which only
      # the probe above can answer. When the answer is no there is nothing for an
      # install to serve, so pnpm/Node setup, the npmrc wiring, the install and
      # the pre-command are all skipped and the job reports green having honestly
      # run nothing.
      #
      # That state is reachable in exactly one way: coverage is the only enabled
      # gate and the consumer has not adopted `mcp:coverage`. Before the four
      # jobs were merged into this one, the `coverage` job guarded every heavy
      # step on this same probe output, so such a caller paid a checkout and
      # nothing else; without this step the merged job would pay a full
      # `pnpm install --frozen-lockfile` plus an arbitrary `pre-command` to run
      # zero gates, and would report FAILED if either of them broke — a failure
      # about no gate the caller enabled.
      #
      # Modelled on quality.yml's `e2e-reliability`, which gates pnpm setup,
      # Node setup, install and `Pre-e2e setup` on a `changed-specs` step output
      # for the same reason. (`Static Gates` is NOT the precedent here: it has no
      # skippable setup and no pre-command.)
      - name: Any install-dependent gate to run?
        id: need
        shell: bash
        env:
          ANY: >-
            ${{ inputs.run-drift || inputs.run-lint || inputs.run-parity || (inputs.run-coverage && steps.probe.outputs.present == 'true') }}
        run: |
          set -o pipefail
          # Compared against 'false', not 'true', so this FAILS SAFE: only a
          # definite `false` skips the toolchain. Any unexpected value runs the
          # install and lets each gate's own guard decide — the one thing that
          # must never happen here is silently skipping every gate and
          # reporting green.
          if [ "${ANY}" = 'false' ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no install-dependent gate can run (drift/lint/parity off and mcp:coverage not defined) — skipping pnpm/Node setup, install and pre-command"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: ${{ steps.need.outputs.any == 'true' }}
        with:
          run_install: false
      - uses: actions/setup-node@v4
        if: ${{ steps.need.outputs.any == 'true' }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      # Wire ~/.npmrc for private GitHub Packages BEFORE install, using the job's
      # own GITHUB_TOKEN (packages: read) — NOT an inherited user secret, so the
      # no-secrets boundary holds. Skipped entirely unless a scope is given, so
      # public-only consumers are unaffected and the token is never written.
      - name: Configure GitHub Packages auth
        if: ${{ steps.need.outputs.any == 'true' && inputs.github-packages-scope != '' }}
        shell: bash
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "${{ inputs.github-packages-scope }}:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GH_PKG_TOKEN}"
          } >> "$HOME/.npmrc"
      # `id: install` is one of the two conditions every gate guard below keys on
      # (the other is `id: pre`): no gate can run without node_modules.
      - name: Install dependencies
        id: install
        if: ${{ steps.need.outputs.any == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # Runs ONCE for all four gates (it used to run four times, once per job).
      # `id: pre` is read by all four gate guards below — a failed pre-command
      # short-circuits them instead of letting each one fail again downstream of
      # the same missing build product. Left on the implicit `success()` itself,
      # so a failed install skips it.
      - name: Pre-command
        id: pre
        if: ${{ steps.need.outputs.any == 'true' && inputs.pre-command != '' }}
        shell: bash
        run: |
          set -o pipefail
          ${{ inputs.pre-command }} 2>&1 | tee pre-command.log

      # GATE GUARD — the same three shared terms on all four gates, plus that
      # gate's own toggle. Term by term:
      #
      #   !cancelled()
      #     Keep running after an EARLIER GATE failed, so one run reports the full
      #     inventory instead of the first violation (FAILURE ISOLATION above).
      #     It is a status-check function, so it removes the implicit `success()`
      #     — which is why the two step-outcome terms below have to be spelled
      #     out; without them nothing would short-circuit the gates at all.
      #
      #   steps.install.outcome == 'success'
      #     No gate can run without node_modules. `== 'success'` is right here
      #     because the only way install is SKIPPED is `steps.need.outputs.any !=
      #     'true'` — i.e. no gate could have run anyway, and each gate's own
      #     toggle/probe term is false in that state too. So this term never
      #     hides a gate that had work to do.
      #
      #   steps.pre.outcome != 'failure'
      #     A broken pre-command must not be followed by four cascading failures.
      #     The pre-command typically builds something the mcp:* scripts import,
      #     so when it dies the four gates all die on the same missing artifact
      #     (in future-pay: four `Cannot find module …/dist/search/index.js`),
      #     burying the one real error under noise. The old five-job shape ended
      #     at `Pre-command` with the real error last and the gate SKIPPED; this
      #     restores that.
      #
      #     `!= 'failure'` and deliberately NOT `== 'success'`: `pre-command` is
      #     optional, so the step is SKIPPED (outcome 'skipped', not 'success')
      #     whenever the caller passes none — and skipped again when the
      #     toolchain block above is skipped. Under `== 'success'` every consumer
      #     that passes no pre-command would silently skip ALL FOUR gates and the
      #     job would report GREEN having run nothing: a far worse bug than the
      #     cascade this term fixes. `!= 'failure'` treats 'skipped' as "no
      #     obstacle", which is exactly what it is.
      #
      # Provenance, since #29's comment got it wrong: the `!cancelled()` half is
      # quality.yml's `Static Gates`; the pre-command half is NOT — that job has
      # no pre-command step. quality.yml's only pre-command steps are `Pre-e2e
      # setup` in `e2e-affected` and in `e2e-reliability`, and both leave every
      # later step on the implicit `success()`, so there a failed pre-command
      # skips the rest of the job. `!= 'failure'` is the narrowest form of that
      # same precedent, kept compatible with the gate-vs-gate isolation above.
      #
      # DRIFT is the primary gate: it proves the generated MCP tool surface still
      # matches the app's OpenAPI. mcp:check must regenerate and exit non-zero when
      # the committed manifest is stale (the consumer typically regenerates to a temp
      # path and `git diff --exit-code`s the committed artifact).
      - name: MCP manifest drift (regenerate + diff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.pre.outcome != 'failure' && inputs.run-drift }}
        shell: bash
        run: |
          set -o pipefail
          pnpm mcp:check 2>&1 | tee mcp-check.log

      - name: MCP surface lint (secret-leak + schema-shape)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.pre.outcome != 'failure' && inputs.run-lint }}
        shell: bash
        run: |
          set -o pipefail
          pnpm mcp:lint 2>&1 | tee mcp-lint.log

      # COVERAGE makes the surface COMPLETE where drift only keeps it honest: every
      # served route must be registered (or explicitly allowlisted as infra) and
      # every server action mapped or excluded with a reason. The script-existence
      # probe above keeps the gate non-breaking for consumers that have not adopted
      # mcp:coverage yet — they see a skip notice, not a failure.
      - name: MCP route/action coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.pre.outcome != 'failure' && inputs.run-coverage && steps.probe.outputs.present == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          pnpm mcp:coverage 2>&1 | tee mcp-coverage.log

      - name: MCP served-schema parity (in-process)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.pre.outcome != 'failure' && inputs.run-parity }}
        shell: bash
        run: |
          set -o pipefail
          pnpm mcp:parity 2>&1 | tee mcp-parity.log

  # STORE COMPLIANCE is the org-wide floor. Unlike the gates above it runs a
  # ruleset owned by THIS repo against the consumer's committed manifest, so no
  # repo can ship a tool that would fail an assistant-directory review by
  # shipping a permissive local mcp:lint. A repo may still enforce MORE in its
  # own lint; it cannot enforce less.
  store-compliance:
    name: MCP Store Compliance
    if: ${{ inputs.run-store-compliance }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate reads the COMMITTED manifest, so it needs neither an install
      # nor the pre-command — the drift gate above is what proves that manifest
      # is current. Keeping this job dependency-free makes it the cheapest gate
      # in the set, which matters when it runs in every org repo — and is exactly
      # why it was NOT folded into `contract-gates`: sharing that job would give
      # the cheapest gate a pnpm install + pre-command it does not need, ADDING
      # setup cost instead of removing any.
      - name: MCP store compliance
        uses: 12-apps/ci/.github/actions/mcp-store-compliance@v1
        with:
          manifest-path: ${{ inputs.manifest-path }}
          exceptions-path: ${{ inputs.store-exceptions-path }}
          node-version: ${{ inputs.node-version }}
