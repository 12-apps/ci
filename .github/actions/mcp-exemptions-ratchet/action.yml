name: 'MCP test-coverage exemptions ratchet'
description: >-
  Shrink-only and touch-must-fix for an MCP test-coverage exemptions file, on a
  pull request. (A) any ADDED entry fails, except on the PR that adopts the file;
  (B) a PR that changes (renames, deletes) a file backing a still-listed tool
  fails until its entry is removed. The consumer's `mcp:test-coverage
  --exempt-files` owns the tool-to-file mapping. Needs a checkout with history
  (fetch-depth 0) and an install. One copy of the rule, used by
  mcp-test-coverage.yml and by package-gates.yml when a consumer runs its MCP
  gates there.
inputs:
  exemptions-file:
    description: 'The exemptions file, repo-relative. Absent or comments-only: nothing to enforce.'
    required: true
  package-dir:
    description: 'Directory whose package.json defines mcp:test-coverage.'
    required: false
    default: '.'
  base-ref:
    description: 'Branch the PR merges into.'
    required: false
    default: 'main'
runs:
  using: composite
  steps:
    - name: Enforce exemptions burn-down (shrink-only + touch-must-fix)
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        EXEMPTIONS_FILE: ${{ inputs.exemptions-file }}
        PKG_DIR: ${{ inputs.package-dir }}
      run: |
        set -o pipefail
        if [ ! -f "$EXEMPTIONS_FILE" ]; then
          echo "No $EXEMPTIONS_FILE — nothing to enforce (the gate is at full coverage)."
          exit 0
        fi
        # A file holding only comments/blank lines is SEMANTICALLY empty: the
        # consumer is at full coverage but kept the header. Treat it exactly
        # like an absent file — otherwise the empty `--exempt-files` output
        # below is read as a broken mapping and a fully-covered repo fails its
        # own required check for having zero debt.
        entry_count="$(grep -cvE '^\s*(#|$)' "$EXEMPTIONS_FILE" || true)"
        if [ "${entry_count:-0}" -eq 0 ]; then
          echo "$EXEMPTIONS_FILE has no entries (comments only) — nothing to enforce."
          exit 0
        fi
        # Fail-fast on the diff baseline (never masked): we must have the base.
        git fetch --no-tags origin "$BASE_REF"
        merge_base="$(git merge-base "origin/$BASE_REF" HEAD)" || {
          echo "::error::Could not compute merge-base with origin/$BASE_REF"
          exit 1
        }

        fail=0

        # (A) Shrink-only: any ADDED non-comment line is a new grandfather
        # entry — forbidden.
        #
        # EXCEPT on the adoption commit. When the file does not exist at the
        # merge base, every line of the initial baseline is an "added" line, so
        # a blanket rule would reject the very PR that adopts the gate and
        # demand the whole debt be paid before the ratchet can start — the
        # opposite of an incremental rollout. Recognise that case explicitly
        # and let the baseline through; from the next PR on, the file exists at
        # the base and the rule applies with no exception.
        if git cat-file -e "$merge_base:$EXEMPTIONS_FILE" 2>/dev/null; then
          added="$(
            git diff "$merge_base" HEAD -- "$EXEMPTIONS_FILE" \
              | grep -E '^\+' | grep -vE '^\+\+\+' | sed -E 's/^\+//' \
              | sed -E 's/[[:space:]]+$//' | grep -vE '^\s*(#|$)' || true
          )"
          if [ -n "$added" ]; then
            echo "::error::$EXEMPTIONS_FILE may only shrink, never grow. Entries ADDED:"
            printf '%s\n' "$added" | sed 's/^/  + /'
            echo "You cannot grandfather an MCP tool — write its test instead of listing it."
            fail=1
          fi
        else
          echo "::notice::$EXEMPTIONS_FILE is new at this merge base — accepting the initial baseline of $entry_count entry/entries. From the next PR on it can only shrink."
        fi

        # (B) Touch-must-fix: if the PR changes the file backing a still-listed
        # tool, the entry must be removed (which means its test was written).
        # Ask the consumer's script which files those are — it owns the
        # tool→file mapping. Use --name-status -M (not --name-only) so a
        # RENAMED or DELETED file is caught too: the mapping yields the path as
        # it exists NOW, but a rename's old path and a delete's path must count
        # as touching as well, or the tool could be moved out from under its
        # exemption and silently stay grandfathered.
        #
        # Check the EXIT STATUS, not just the output: a script that dies partway
        # can print some paths and still fail, and treating that partial list as
        # authoritative would silently narrow the check to whatever it managed
        # to emit. `set +e` around the call only because errexit would abort
        # before rc could be read.
        set +e
        listed_files="$(pnpm -s -C "$PKG_DIR" run mcp:test-coverage --exempt-files)"
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "::error::mcp:test-coverage --exempt-files exited $rc — its output cannot be trusted, so touch-must-fix cannot be evaluated"
          printf '%s\n' "$listed_files" | sed 's/^/  | /'
          exit 1
        fi
        if [ -z "$listed_files" ]; then
          echo "::error::mcp:test-coverage --exempt-files printed nothing while $EXEMPTIONS_FILE lists $entry_count entry/entries — cannot evaluate touch-must-fix"
          exit 1
        fi
        offenders=""
        while IFS=$'\t' read -r status p1 p2; do
          [ -z "$status" ] && continue
          case "$status" in
            C*) involved="$p2" ;;            # copy: only the new file is new work
            R*) involved="$p1"$'\n'"$p2" ;;  # rename: BOTH old (source) and new
            *)  involved="$p1" ;;            # A / M / D: the single path
          esac
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if printf '%s\n' "$listed_files" | grep -qxF "$f"; then
              offenders="$offenders$f"$'\n'
            fi
          done <<< "$involved"
        done < <(git diff --name-status -M --diff-filter=ACMRD "$merge_base" HEAD)
        offenders="$(printf '%s' "$offenders" | grep -vE '^[[:space:]]*$' | sort -u || true)"
        if [ -n "$offenders" ]; then
          echo "::error::You changed files backing MCP tools that are still exempt (a rename or delete counts as touching):"
          printf '%s\n' "$offenders" | sed 's/^/  - /'
          echo "Policy: touching the code behind an exempt tool means writing its test and"
          echo "deleting its line from $EXEMPTIONS_FILE in the same PR. For a rename, the"
          echo "OLD path counts too; for a delete, prune the stale entry."
          fail=1
        fi

        if [ "$fail" -ne 0 ]; then exit 1; fi
        echo "✓ exemptions ratchet OK (shrink-only; no touched tool left grandfathered)."
