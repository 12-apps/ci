name: 'Skip what is already green'
description: >-
  Do not re-run, on a later push of the same pull request, a test that an
  earlier GREEN run of this lane already passed with identical inputs.

  Selection is cumulative on purpose (every push diffs against the merge base
  with the default branch), so push 3 of a PR re-runs push 1's tests even when
  push 3 changed nothing they can see. `affected-plan` hashes each selected
  test's inputs — its transitive import closure plus the lane's declared global
  inputs, as blob shas — into the plan. This action, in `filter` mode, compares
  those hashes with the manifest an earlier green run of the lane recorded on
  this PR and drops (or, under `shadow`, only reports) the tests whose inputs
  have not moved. In `record` mode, after the lane passed, it writes the
  manifest the next push will read.

  Fails safe in every direction: no manifest, an unreadable one, a plan without
  hashes, a test with no bounded hash, a test on the consumer's always-run list,
  an always-run list that cannot be read — each runs the test. Only what
  passed is recorded: a lane whose result is `success` records every test it
  ran; a lane that failed or was cancelled records only the lists of the
  shards whose own test step exited 0 (`shard` mode, FUT-4548).

inputs:
  mode:
    description: >-
      `filter` (in the plan job, before the matrix is sized), `shard` (inside a
      shard whose test step succeeded: write what THIS shard proved), or
      `record` (after the matrix: a green lane's tests, or a failed/cancelled
      lane's green shard records).
    required: true
  lane:
    description: 'Lane name (`unit`, `integration`); the manifest is per lane.'
    required: true
  plan:
    description: 'Path to the affected-plan JSON document, relative to working-directory. `filter` rewrites it in place.'
    required: true
  manifest:
    description: 'Path of the lane''s manifest file inside the restored/saved cache directory, relative to working-directory.'
    required: true
  policy:
    description: '`filter` only: `shadow` (report, run everything) or `enforce` (drop the already-green tests).'
    required: false
    default: 'shadow'
  always-run:
    description: >-
      `filter` only. Path to the consumer's list of tests that must always run
      (a JSON array, or `{"tests": [...]}`) — non-hermetic suites whose verdict
      depends on something no hash sees. Empty for no list.
    required: false
    default: ''
  max-shards:
    description: '`filter` only: the lane''s shard ceiling, to size the filtered list by the same rule as the plan.'
    required: false
    default: '4'
  min-tests-per-shard:
    description: '`filter` only: below this many tests the lane stays on one runner.'
    required: false
    default: '40'
  lane-result:
    description: '`record` only: the lane''s result (`needs.<lane>-tests.result`). Anything but `success` records nothing.'
    required: false
    default: ''
  head-sha:
    description: '`record` only: the pull request head the green run tested (what the skip line names). Defaults to GITHUB_SHA.'
    required: false
    default: ''
  shard-records:
    description: >-
      `record` only: directory of the shard records (`shard` mode) of THIS run.
      Read only when `lane-result` is `failure` or `cancelled`; a green lane
      records from the plan as it always has. Empty for none.
    required: false
    default: ''
  leg:
    description: >-
      `shard` only: this leg's file list (lane-timings `leg` output). Empty when
      the lane was not sized, which records nothing above one shard — a shard
      split by the runner cannot name the files it ran.
    required: false
    default: ''
  shard:
    description: '`shard` only: this shard''s index.'
    required: false
    default: ''
  shard-total:
    description: '`shard`, and `record` with `shard-records`: the lane''s shard count (the merge evicts the leg of a shard that left no record when the plan carries no `legs`).'
    required: false
    default: ''
  outcome:
    description: '`shard` only: the outcome of the shard''s test step. `success` writes a green record, `failure` an eviction record, anything else nothing.'
    required: false
    default: ''
  reports:
    description: >-
      `shard` only: the lane's JUnit report paths (space-separated, globs
      expanded). When set, a shard whose reports hold zero test cases records
      nothing. Empty skips that check.
    required: false
    default: ''
  out:
    description: '`shard` only: where to write the shard record, relative to working-directory.'
    required: false
    default: '.skip-green-shard/record.json'
  working-directory:
    description: 'Consumer checkout root.'
    required: false
    default: '.'

outputs:
  mode:
    description: '`filter`: the plan''s mode after filtering (`narrowed`, `none`).'
    value: ${{ steps.filter.outputs.mode }}
  count:
    description: '`filter`: tests left to run.'
    value: ${{ steps.filter.outputs.count }}
  shard-total:
    description: '`filter`: shard count for the filtered list; `0` when nothing is left.'
    value: ${{ steps.filter.outputs.shard-total }}
  skipped:
    description: '`filter`: tests dropped (enforce).'
    value: ${{ steps.filter.outputs.skipped }}
  would-skip:
    description: '`filter`: tests that would have been dropped (shadow).'
    value: ${{ steps.filter.outputs.would-skip }}
  filtered:
    description: >-
      `filter`: `true` when the plan document was REWRITTEN (enforce dropped
      at least one test), so the caller sizes its matrix from `shard-total`
      rather than from the unfiltered plan; anything else means the plan on
      disk is the one `affected-plan` wrote.
    value: ${{ steps.filter.outputs.filtered }}
  written:
    description: '`shard`: `true` when a shard record was written.'
    value: ${{ steps.shard.outputs.written }}
  recorded:
    description: '`record`: `true` when a manifest was written.'
    value: ${{ steps.record.outputs.recorded }}
  entries:
    description: '`record`: entries in the manifest after this run.'
    value: ${{ steps.record.outputs.entries }}

runs:
  using: composite
  steps:
    - name: Filter the plan against the green manifest
      id: filter
      if: ${{ inputs.mode == 'filter' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANE: ${{ inputs.lane }}
        PLAN: ${{ inputs.plan }}
        MANIFEST: ${{ inputs.manifest }}
        POLICY: ${{ inputs.policy }}
        ALWAYS_RUN: ${{ inputs.always-run }}
        MAX_SHARDS: ${{ inputs.max-shards }}
        PER_SHARD: ${{ inputs.min-tests-per-shard }}
      run: |
        set -uo pipefail
        # NOT `set -e`: a filter that cannot decide must leave the plan as it
        # is, which is exactly what a non-zero exit from the script means.
        node "$GITHUB_ACTION_PATH/filter.mjs" \
          --lane "$LANE" --plan "$PLAN" --manifest "$MANIFEST" --policy "$POLICY" \
          --always-run "$ALWAYS_RUN" --max-shards "$MAX_SHARDS" --min-tests-per-shard "$PER_SHARD" \
          || echo "::warning::skip-green ($LANE): the filter could not run — the plan runs unfiltered."

    - name: Record what this green shard proved
      id: shard
      if: ${{ inputs.mode == 'shard' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANE: ${{ inputs.lane }}
        PLAN: ${{ inputs.plan }}
        LEG: ${{ inputs.leg }}
        SHARD: ${{ inputs.shard }}
        SHARD_TOTAL: ${{ inputs.shard-total }}
        OUTCOME: ${{ inputs.outcome }}
        REPORTS: ${{ inputs.reports }}
        OUT: ${{ inputs.out }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -uo pipefail
        # Globs in REPORTS (`apps/*/reports/junit/unit`) are expanded here, the
        # way the zero-test guard's paths are; a glob matching nothing stays
        # literal and simply does not exist.
        # shellcheck disable=SC2086
        expanded="$(printf '%s ' $REPORTS)"
        node "$GITHUB_ACTION_PATH/shard.mjs" \
          --lane "$LANE" --plan "$PLAN" --leg "$LEG" --shard "$SHARD" --shard-total "$SHARD_TOTAL" \
          --outcome "$OUTCOME" --reports "$expanded" --out "$OUT" \
          --head-sha "${HEAD_SHA:-$GITHUB_SHA}" --run-id "$GITHUB_RUN_ID" \
          || echo "::warning::skip-green ($LANE): the shard record could not be written — this shard's tests re-run if the lane fails."

    - name: Record what this green lane proved
      id: record
      if: ${{ inputs.mode == 'record' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANE: ${{ inputs.lane }}
        PLAN: ${{ inputs.plan }}
        MANIFEST: ${{ inputs.manifest }}
        LANE_RESULT: ${{ inputs.lane-result }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHARD_RECORDS: ${{ inputs.shard-records }}
        SHARD_TOTAL: ${{ inputs.shard-total }}
      run: |
        set -uo pipefail
        node "$GITHUB_ACTION_PATH/record.mjs" \
          --lane "$LANE" --plan "$PLAN" --manifest "$MANIFEST" \
          --lane-result "$LANE_RESULT" --head-sha "${HEAD_SHA:-$GITHUB_SHA}" --run-id "$GITHUB_RUN_ID" \
          --shard-records "$SHARD_RECORDS" --shard-total "$SHARD_TOTAL" \
          || echo "::warning::skip-green ($LANE): the record step could not run — nothing recorded."
