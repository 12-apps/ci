name: 'Vitest signal guard'
description: >-
  Fail a test lane that reported zero executed test cases. Affected-test
  selection plus `--passWithNoTests` cannot distinguish "nothing needed running"
  from "the selector resolved nothing at all"; both exit 0. This asserts the
  lane's JUnit reports at least one test case. Fail-closed: a missing or
  unparseable report fails too.

inputs:
  reports:
    description: >-
      Space-separated JUnit XML files and/or directories (scanned recursively
      for *.xml). Multiple paths are summed — a unit lane that runs vitest per
      workspace package emits one report per package, and a suite with no vitest
      project (root `scripts/__tests__`, say) adds one more from `node --test`.
      Any producer is read: the totals are taken from `<testsuites tests>`, from
      a sum over `<testsuite tests>`, or — when a producer declares neither, as
      `node --test` does — by counting the `<testcase>` elements themselves.
    required: true
  lane:
    description: 'Lane name used in log and annotation text (e.g. unit, integration).'
    required: false
    default: 'test'
  working-directory:
    description: 'Consumer checkout root the report paths are relative to.'
    required: false
    default: '.'
  bypass-label:
    description: >-
      The PR label that skips this guard, named in the failure message. Passed
      in rather than hardcoded so the remediation cannot tell someone to apply a
      label the caller did not configure — advice that sends a blocked author
      to a label that does nothing is worse than no advice.
    required: false
    default: 'ci:allow-zero-tests'

runs:
  using: composite
  steps:
    - name: Verify the lane executed at least one test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANE_LABEL: ${{ inputs.lane }}
        BYPASS_LABEL: ${{ inputs.bypass-label }}
        REPORTS: ${{ inputs.reports }}
      run: |
        set -euo pipefail
        # Intentionally unquoted: REPORTS is a space-separated path list.
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/check-test-signal.mjs" $REPORTS
