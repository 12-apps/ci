name: 'CD gate'
description: >-
  Paces a CD. With min_interval_minutes, a push waits until that long has
  passed since the last deploy attempt started, then deploys (give the gate job
  a cancelling concurrency group, so a newer merge replaces a waiting gate);
  with when_recent: skip it skips instead of waiting.
  Without it, a scheduled run deploys only when the branch moved. Either way it
  names the last successfully deployed commit as the image-reuse base. Ships
  scripts/deploy/cd-gate.mjs, which argues the rules.
inputs:
  token:
    description: 'Reads the workflow run history (actions: read).'
    required: false
    default: ${{ github.token }}
  min_interval_minutes:
    description: 'At least this many minutes between deploy attempts; empty for the schedule mode.'
    required: false
    default: ''
  when_recent:
    description: >-
      With min_interval_minutes, what a push inside the interval does: `wait`
      (the default) until it has passed, or `skip` at once, leaving the next
      merge after the interval to deploy. Use `skip` for an interval of hours.
    required: false
    default: wait
  discover_job:
    description: "The engine's first job; a run whose copy of it ran to an end was a deploy attempt."
    required: false
    default: Discover targets
outputs:
  deploy:
    description: "'true' when this run should deploy"
    value: ${{ steps.gate.outputs.deploy }}
  base_sha:
    description: 'The last successfully deployed commit, for cd.yml `base_sha` (empty: full rebuild)'
    value: ${{ steps.gate.outputs.base_sha }}
  reason:
    description: 'Why, in one line'
    value: ${{ steps.gate.outputs.reason }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DISCOVER_JOB: ${{ inputs.discover_job }}
        MIN_INTERVAL_MINUTES: ${{ inputs.min_interval_minutes }}
        WHEN_RECENT: ${{ inputs.when_recent }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/deploy/cd-gate.mjs"
