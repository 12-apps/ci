name: 'Post-merge regeneration'
description: >-
  Run the caller's regeneration command on the live tip of the base branch and
  land what it changed as ONE squash-merged pull request that starts no
  workflow on the base (so it does not deploy).

  Everything a repository can derive after a merge — an index, a number, a
  tightened budget — is derived HERE instead of in each pull request, where two
  open PRs deriving the same file conflict. The PR is opened with a PAT so the
  caller's `pull_request` checks run; auto-merge is enabled with GITHUB_TOKEN,
  and GitHub starts no workflow run for an event that token causes, so the
  merge commit neither deploys nor triggers another regeneration.

  One branch per run (`<branch-prefix><sha7>`): a ruleset may refuse a
  non-fast-forward push to any branch, so a reused branch could not be rebuilt
  from a newer tip. Older regen PRs are closed once the new one is open.
  Needs a full-history checkout of the base with `persist-credentials: false`.
inputs:
  command:
    description: 'The shell that regenerates. It runs at the repository root on the base tip, with no token in its environment.'
    required: true
  base:
    description: 'The base branch. Empty: the repository default branch.'
    required: false
    default: ''
  branch-prefix:
    description: "Every regen PR's head starts with this; the run appends the tip's short sha. Reserve it: the job closes any open PR under it."
    required: false
    default: 'chore/post-merge-regen-'
  title:
    description: 'The PR title and the commit header. Put whatever your commit rules demand (a ticket reference) here.'
    required: true
  body:
    description: 'The PR body and the commit body.'
    required: false
    default: ''
  commit-author:
    description: 'The commit author, as "Name <email>".'
    required: false
    default: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
  pr-token:
    description: 'A PAT with contents and pull-requests write: pushes the branch and opens the PR. Required — a PR opened with GITHUB_TOKEN never gets its checks.'
    required: true
  github-token:
    description: 'Enables auto-merge and closes superseded regen PRs (`contents: write`, `pull-requests: write`).'
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_TOKEN: ${{ inputs.pr-token }}
        BASE_BRANCH: ${{ inputs.base || github.event.repository.default_branch }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        REGEN_COMMAND: ${{ inputs.command }}
        PR_TITLE: ${{ inputs.title }}
        PR_BODY: ${{ inputs.body }}
        COMMIT_AUTHOR: ${{ inputs.commit-author }}
      run: node "$GITHUB_ACTION_PATH/regen.mjs"
